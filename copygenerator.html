<script>
const DATA = {"lineName": "Sagrada Madre – New additions", "languages": [{"code": "NL", "label": "NL"}, {"code": "EN", "label": "EN"}, {"code": "DE", "label": "DE"}, {"code": "IT", "label": "IT"}, {"code": "FR", "label": "FR"}, {"code": "ES", "label": "ES"}], "products": [{"sku": "7288", "title": {"NL": "Sagrada Madre Natuurlijke wierook Cosmos Zon -- ±24g", "EN": "Sagrada Madre Natural incense Cosmos Sun -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Cosmos Sonne -- ±24g", "IT": "Sagrada Madre incenso naturale Cosmos Sole -- ±24g", "FR": "Sagrada Madre Encens naturel Cosmos Soleil -- ±24g", "ES": "Sagrada Madre incienso natural Cosmos Sol -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 7 sticks.\n  <br>\n  Samenstelling: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Zon: de energie is extra krachtig op zondag, maar je kunt deze wierook gebruiken wanneer je het nodig hebt. Geur: citrus.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos bestaat uit 7 wieroken, elk gekoppeld aan een planeet en diens unieke kracht. Met specifieke geuren helpen ze je energie te balanceren en te versterken, zodat je je makkelijker afstemt op kosmische ritmes. Een ritueel om lichaam, geest en ziel te harmoniseren. Met elke geur activeer je de unieke kracht van een planeet: van de vitaliteit van de Zon tot de structuur van Saturnus. Een astrale reset voor emoties, wilskracht en je verbinding met de natuurlijke cycli van het universum.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Sun: Its energy is enhanced on Sundays, but it can be used whenever you need. Fragrance: Citrus.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  7 incenses, each linked to a planet and its unique power. With special scents, they balance and enhance your energies, helping you connect with cosmic rhythms. A ritual to harmonize body, mind, and soul. Cosmos Explore the energy of the planets with Cosmos, a line of energetic incenses that represent each of the celestial bodies influencing your life. With each scent, you will activate the unique force of a planet: from the vitality of the Sun to the structure of Saturn. An astral ritual to harmonize emotions, strengthen willpower, and awaken your cosmic connection to the natural cycles of the universe.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 7 sticks.\n  <br>\n  Zusammensetzung: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Sonne: Die Energie ist besonders am Sonntag verstärkt, kann aber jederzeit verwendet werden. Duft: Zitrus.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos umfasst 7 Räucherwerke, jeweils einer Planetenkraft zugeordnet. Mit speziellen Düften helfen sie, Energien auszugleichen und zu stärken und sich mit kosmischen Rhythmen zu verbinden. Ein Ritual zur Harmonisierung von Körper, Geist und Seele. Mit jedem Duft aktivierst du die einzigartige Kraft eines Planeten – von der Vitalität der Sonne bis zur Struktur des Saturn. Ein astrales Ritual, um Emotionen zu ordnen, den Willen zu stärken und die Verbindung zu den natürlichen Zyklen des Universums zu wecken.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 7 sticks.\n  <br>\n  Composizione: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Sole: l’energia è potenziata la domenica, ma puoi usarlo quando ne hai bisogno. Fragranza: agrumi.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos comprende 7 incensi, ciascuno legato a un pianeta e alla sua forza unica. Con profumazioni specifiche aiutano a riequilibrare e potenziare le energie, favorendo la sintonia con i ritmi cosmici. Un rituale per armonizzare corpo, mente e anima. Con ogni fragranza attivi l’energia di un corpo celeste: dalla vitalità del Sole alla struttura di Saturno. Un rituale astrale per armonizzare le emozioni, rafforzare la volontà e risvegliare la connessione con i cicli naturali dell’universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Soleil : l’énergie est renforcée le dimanche, mais peut être utilisé à tout moment. Parfum : agrumes.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos réunit 7 encens, chacun lié à une planète et à sa force propre. Grâce à des senteurs spécifiques, ils aident à équilibrer et à renforcer les énergies, pour se relier aux rythmes cosmiques. Un rituel pour harmoniser corps, esprit et âme. À chaque parfum, vous activez la force d’un astre : de la vitalité du Soleil à la structure de Saturne. Un rituel astral pour harmoniser les émotions, renforcer la volonté et éveiller la connexion aux cycles naturels de l’univers.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 7 sticks.\n  <br>\n  Composición: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Sol: su energía se potencia el domingo, pero puede usarse cuando lo necesites. Fragancia: cítricos.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos incluye 7 inciensos, cada uno vinculado a un planeta y a su poder único. Con aromas específicos ayudan a equilibrar y potenciar tus energías, conectándote con los ritmos cósmicos. Un ritual para armonizar cuerpo, mente y alma. Con cada fragancia activas la fuerza de un cuerpo celeste: desde la vitalidad del Sol hasta la estructura de Saturno. Un ritual astral para armonizar emociones, fortalecer la voluntad y despertar la conexión con los ciclos naturales del universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7289", "title": {"NL": "Sagrada Madre Natuurlijke wierook Cosmos Maan -- ±24g", "EN": "Sagrada Madre Natural incense Cosmos Moon -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Cosmos Mond -- ±24g", "IT": "Sagrada Madre incenso naturale Cosmos Luna -- ±24g", "FR": "Sagrada Madre Encens naturel Cosmos Lune -- ±24g", "ES": "Sagrada Madre incienso natural Cosmos Luna -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 7 sticks.\n  <br>\n  Samenstelling: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Maan: de energie is extra krachtig op maandag, maar je kunt deze wierook gebruiken wanneer je het nodig hebt. Geur: yagra.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos bestaat uit 7 wieroken, elk gekoppeld aan een planeet en diens unieke kracht. Met specifieke geuren helpen ze je energie te bal onnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Lune : l’énergie est renforcée le lundi, mais peut être utilisé à tout moment. Parfum : yagra.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos réunit 7 encens, chacun lié à une planète et à sa force propre. Grâce à des senteurs spécifiques, ils aident à équilibrer et à renforcer les énergies, pour se relier aux rythmes cosmiques. Un rituel pour harmoniser corps, esprit et âme. À chaque parfum, vous activez la force d’un astre : de la vitalité du Soleil à la structure de Saturne. Un rituel astral pour harmoniser les émotions, renforcer la volonté et éveiller la connexion aux cycles naturels de l’univers.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 7 sticks.\n  <br>\n  Composición: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Luna: su energía se potencia el lunes, pero puede usarse cuando lo necesites. Fragancia: yagra.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos incluye 7 inciensos, cada uno vinculado a un planeta y a su poder único. Con aromas específicos ayudan a equilibrar y potenciar tus energías, conectándote con los ritmos cósmicos. Un ritual para armonizar cuerpo, mente y alma. Con cada fragancia activas la fuerza de un cuerpo celeste: desde la vitalidad del Sol hasta la estructura de Saturno. Un ritual astral para armonizar emociones, fortalecer la voluntad y despertar la conexión con los ciclos naturales del universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7290", "title": {"NL": "Sagrada Madre Natuurlijke wierook Cosmos Mars -- ±24g", "EN": "Sagrada Madre Natural incense Cosmos Mars -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Cosmos Mars -- ±24g", "IT": "Sagrada Madre incenso naturale Cosmos Marte -- ±24g", "FR": "Sagrada Madre Encens naturel Cosmos Mars -- ±24g", "ES": "Sagrada Madre incienso natural Cosmos Marte -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 7 sticks.\n  <br>\n  Samenstelling: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Mars: de energie is extra krachtig op dinsdag, maar je kunt deze wierook gebruiken wanneer je het nodig hebt. Geur: rode vruchten en palo santo.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos bestaat uit 7 wieroken, elk gekoppeld aan een planeet en diens unieke kracht. Met specifieke geuren helpen ze je energie te balanceren en te versterken, zodat je je makkelijker afstemt op kosmische ritmes. Een ritueel om lichaam, geest en ziel te harmoniseren. Met elke geur activeer je de unieke kracht van een planeet: van de vitaliteit van de Zon tot de structuur van Saturnus. Een astrale reset voor emoties, wilskracht en je verbinding met de natuurlijke cycli van het universum.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Mars: Its energy is enhanced on Tuesdays, but they can be used whenever you need. Fragrance: Red fruits and Palo Santo.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  7 incenses, each linked to a planet and its unique power. With special scents, they balance and enhance your energies, helping you connect with cosmic rhythms. A ritual to harmonize body, mind, and soul. Cosmos Explore the energy of the planets with Cosmos, a line of energetic incenses that represent each of the celestial bodies influencing your life. With each scent, you will activate the unique force of a planet: from the vitality of the Sun to the structure of Saturn. An astral ritual to harmonize emotions, strengthen willpower, and awaken your cosmic connection to the natural cycles of the universe.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 7 sticks.\n  <br>\n  Zusammensetzung: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Mars: Die Energie ist besonders am Dienstag verstärkt, kann aber jederzeit verwendet werden. Duft: rote Früchte und Palo Santo.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos umfasst 7 Räucherwerke, jeweils einer Planetenkraft zugeordnet. Mit speziellen Düften helfen sie, Energien auszugleichen und zu stärken und sich mit kosmischen Rhythmen zu verbinden. Ein Ritual zur Harmonisierung von Körper, Geist und Seele. Mit jedem Duft aktivierst du die einzigartige Kraft eines Planeten – von der Vitalität der Sonne bis zur Struktur des Saturn. Ein astrales Ritual, um Emotionen zu ordnen, den Willen zu stärken und die Verbindung zu den natürlichen Zyklen des Universums zu wecken.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 7 sticks.\n  <br>\n  Composizione: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Marte: l’energia è potenziata il martedì, ma puoi usarlo quando ne hai bisogno. Fragranza: frutti rossi e Palo Santo.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos comprende 7 incensi, ciascuno legato a un pianeta e alla sua forza unica. Con profumazioni specifiche aiutano a riequilibrare e potenziare le energie, favorendo la sintonia con i ritmi cosmici. Un rituale per armonizzare corpo, mente e anima. Con ogni fragranza attivi l’energia di un corpo celeste: dalla vitalità del Sole alla struttura di Saturno. Un rituale astrale per armonizzare le emozioni, rafforzare la volontà e ris n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos comprende 7 incensi, ciascuno legato a un pianeta e alla sua forza unica. Con profumazioni specifiche aiutano a riequilibrare e potenziare le energie, favorendo la sintonia con i ritmi cosmici. Un rituale per armonizzare corpo, mente e anima. Con ogni fragranza attivi l’energia di un corpo celeste: dalla vitalità del Sole alla struttura di Saturno. Un rituale astrale per armonizzare le emozioni, rafforzare la volontà e risvegliare la connessione con i cicli naturali dell’universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Mercure : l’énergie est renforcée le mercredi, mais peut être utilisé à tout moment. Parfum : hindu et yagra.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos réunit 7 encens, chacun lié à une planète et à sa force propre. Grâce à des senteurs spécifiques, ils aident à équilibrer et à renforcer les énergies, pour se relier aux rythmes cosmiques. Un rituel pour harmoniser corps, esprit et âme. À chaque parfum, vous activez la force d’un astre : de la vitalité du Soleil à la structure de Saturne. Un rituel astral pour harmoniser les émotions, renforcer la volonté et éveiller la connexion aux cycles naturels de l’univers.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 7 sticks.\n  <br>\n  Composición: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Mercurio: su energía se potencia el miércoles, pero puede usarse cuando lo necesites. Fragancia: hindu y yagra.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos incluye 7 inciensos, cada uno vinculado a un planeta y a su poder único. Con aromas específicos ayudan a equilibrar y potenciar tus energías, conectándote con los ritmos cósmicos. Un ritual para armonizar cuerpo, mente y alma. Con cada fragancia activas la fuerza de un cuerpo celeste: desde la vitalidad del Sol hasta la estructura de Saturno. Un ritual astral para armonizar emociones, fortalecer la voluntad y despertar la conexión con los ciclos naturales del universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7292", "title": {"NL": "Sagrada Madre Natuurlijke wierook Cosmos Jupiter -- ±24g", "EN": "Sagrada Madre Natural incense Cosmos Jupiter -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Cosmos Jupiter -- ±24g", "IT": "Sagrada Madre incenso naturale Cosmos Giove -- ±24g", "FR": "Sagrada Madre Encens naturel Cosmos Jupiter -- ±24g", "ES": "Sagrada Madre incienso natural Cosmos Júpiter -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 7 sticks.\n  <br>\n  Samenstelling: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Jupiter: de energie is extra krachtig op donderdag, maar je kunt deze wierook gebruiken wanneer je het nodig hebt. Geur: basilicum, olibanum en amber.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos bestaat uit 7 wieroken, elk gekoppeld aan een planeet en diens unieke kracht. Met specifieke geuren helpen ze je energie te balanceren en te versterken, zodat je je makkelijker afstemt op kosmische ritmes. Een ritueel om lichaam, geest en ziel te harmoniseren. Met elke geur activeer je de unieke kracht van een planeet: van de vitaliteit van de Zon cties voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos bestaat uit 7 wieroken, elk gekoppeld aan een planeet en diens unieke kracht. Met specifieke geuren helpen ze je energie te balanceren en te versterken, zodat je je makkelijker afstemt op kosmische ritmes. Een ritueel om lichaam, geest en ziel te harmoniseren. Met elke geur activeer je de unieke kracht van een planeet: van de vitaliteit van de Zon tot de structuur van Saturnus. Een astrale reset voor emoties, wilskracht en je verbinding met de natuurlijke cycli van het universum.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Venus: Its energy is enhanced on Fridays, but they can be used whenever you need. Fragrance: Rose and Sandalwood\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  7 incenses, each linked to a planet and its unique power. With special scents, they balance and enhance your energies, helping you connect with cosmic rhythms. A ritual to harmonize body, mind, and soul. Cosmos Explore the energy of the planets with Cosmos, a line of energetic incenses that represent each of the celestial bodies influencing your life. With each scent, you will activate the unique force of a planet: from the vitality of the Sun to the structure of Saturn. An astral ritual to harmonize emotions, strengthen willpower, and awaken your cosmic connection to the natural cycles of the universe.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 7 sticks.\n  <br>\n  Zusammensetzung: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Venus: Die Energie ist besonders am Freitag verstärkt, kann aber jederzeit verwendet werden. Duft: Rose und Sandelholz.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos umfasst 7 Räucherwerke, jeweils einer Planetenkraft zugeordnet. Mit speziellen Düften helfen sie, Energien auszugleichen und zu stärken und sich mit kosmischen Rhythmen zu verbinden. Ein Ritual zur Harmonisierung von Körper, Geist und Seele. Mit jedem Duft aktivierst du die einzigartige Kraft eines Planeten – von der Vitalität der Sonne bis zur Struktur des Saturn. Ein astrales Ritual, um Emotionen zu ordnen, den Willen zu stärken und die Verbindung zu den natürlichen Zyklen des Universums zu wecken.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 7 sticks.\n  <br>\n  Composizione: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Venere: l’energia è potenziata il venerdì, ma puoi usarlo quando ne hai bisogno. Fragranza: rosa e sandalo.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos comprende 7 incensi, ciascuno legato a un pianeta e alla sua forza unica. Con profumazioni specifiche aiutano a riequilibrare e potenziare le energie, favorendo la sintonia con i ritmi cosmici. Un rituale per armonizzare corpo, mente e anima. Con ogni fragranza attivi l’energia di un corpo celeste: dalla vitalità del Sole alla struttura di Saturno. Un rituale astrale per armonizzare le emozioni, rafforzare la volontà e risvegliare la connessione con i cicli naturali dell’universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Vénus : l’énergie est renforcée le vendredi, mais peut être utilisé à tout moment. Parfum : rose et santal.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos réunit 7 encens, chacun lié à une planète et à sa force propre. Grâce à des senteurs spécifiques, ils aident à équilibrer et à renforcer les énergies, pour se relier aux rythmes cosmiques. Un rituel pour harmoniser corps, esprit et âme. À chaque parfum, vous activez la force d’un astre : de la vitalité du Soleil à la structure de Saturne. Un rituel astral pour harmoniser les émotions, renforcer la volonté et éveiller la connexion aux cycles naturels de l’univers.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 7 sticks.\n  <br>\n  Composición: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Venus: su energía se potencia el viernes, pero puede usarse cuando lo necesites. Fragancia: rosa y sándalo.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos incluye 7 inciensos, cada uno vinculado a un planeta y a su poder único. Con aromas específicos ayudan a equilibrar y potenciar tus energías, conectándote con los ritmos cósmicos. Un ritual para armonizar cuerpo, mente y alma. Con cada fragancia activas la fuerza de un cuerpo celeste: desde la vitalidad del Sol hasta la estructura de Saturno. Un ritual astral para armonizar emociones, fortalecer la voluntad y despertar la conexión con los ciclos naturales del universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7294", "title": {"NL": "Sagrada Madre Natuurlijke wierook Cosmos Saturnus -- ±24g", "EN": "Sagrada Madre Natural incense Cosmos Saturn -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Cosmos Saturn -- ±24g", "IT": "Sa >\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos comprende 7 incensi, ciascuno legato a un pianeta e alla sua forza unica. Con profumazioni specifiche aiutano a riequilibrare e potenziare le energie, favorendo la sintonia con i ritmi cosmici. Un rituale per armonizzare corpo, mente e anima. Con ogni fragranza attivi l’energia di un corpo celeste: dalla vitalità del Sole alla struttura di Saturno. Un rituale astrale per armonizzare le emozioni, rafforzare la volontà e risvegliare la connessione con i cicli naturali dell’universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Saturne : l’énergie est renforcée le samedi, mais peut être utilisé à tout moment. Parfum : myrrhe et cyprès.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos réunit 7 encens, chacun lié à une planète et à sa force propre. Grâce à des senteurs spécifiques, ils aident à équilibrer et à renforcer les énergies, pour se relier aux rythmes cosmiques. Un rituel pour harmoniser corps, esprit et âme. À chaque parfum, vous activez la force d’un astre : de la vitalité du Soleil à la structure de Saturne. Un rituel astral pour harmoniser les émotions, renforcer la volonté et éveiller la connexion aux cycles naturels de l’univers.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 7 sticks.\n  <br>\n  Composición: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  Saturno: su energía se potencia el sábado, pero puede usarse cuando lo necesites. Fragancia: mirra y ciprés.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos incluye 7 inciensos, cada uno vinculado a un planeta y a su poder único. Con aromas específicos ayudan a equilibrar y potenciar tus energías, conectándote con los ritmos cósmicos. Un ritual para armonizar cuerpo, mente y alma. Con cada fragancia activas la fuerza de un cuerpo celeste: desde la vitalidad del Sol hasta la estructura de Saturno. Un ritual astral para armonizar emociones, fortalecer la voluntad y despertar la conexión con los ciclos naturales del universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7295", "title": {"NL": "Sagrada Madre Natuurlijke wierook Cosmos Assortiment 7 planeten -- ±24g", "EN": "Sagrada Madre Natural incense Cosmos Assorted 7 planets -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Cosmos Sortiment 7 Planeten -- ±24g", "IT": "Sagrada Madre incenso naturale Cosmos assortimento 7 pianeti -- ±24g", "FR": "Sagrada Madre Encens naturel Cosmos assortiment 7 planètes -- ±24g", "ES": "Sagrada Madre incienso natural Cosmos surtido 7 planetas -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 7 sticks.\n  <br>\n  Samenstelling: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  7 Cosmos-wierookstokjes, elk gekoppeld aan een planeet en diens unieke kracht. Met speciale aroma’s balanceren en versterken ze je energie en verbinden ze je met kosmische ritmes.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos bestaat uit 7 wieroken, elk gekoppeld aan een planeet en diens unieke kracht. Met specifieke geuren helpen ze je energie te balanceren en te versterken, zodat je je makkelijker afstemt op kosmische ritmes. Een ritueel om lichaam, geest en ziel te harmoniseren. Met elke geur activeer je de unieke kracht van een planeet: van de vitaliteit van de Zon tot de structuur van Saturnus. Een astrale reset voor emoties, wilskracht en je verbinding met de natuurlijke cycli van het universum.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 7 sticks.\n  <br>\n  Composition: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  7 Cosmos Incense sticks, each linked to a planet and its unique power. With special aromas, they balance and enhance your energies, helping you connect with cosmic rhythms. A ritual to harmonize body, mind, and soul.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  7 incenses, each linked to a planet and its unique power. With special scents, they balance and enhance your energies, helping you connect with cosmic rhythms. A ritual to harmonize body, mind, and soul. Cosmos Explore the energy of the planets with Cosmos, a line of energetic incenses that represent each of the celestial bodies influencing your life. With each scent, you will activate the unique force of a planet: from the vitality of the Sun to the structure of Saturn. An astral ritual to harmonize emotions, strengthen willpower, and awaken your cosmic connection to the natural cycles of the universe.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 7 sticks.\n  <br>\n  Zusammensetzung: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  7 Cosmos-Räucherstäbchen, jeweils einer Planetenkraft zugeordnet. Mit besonderen Düften gleichen sie Energien aus, stärken sie und verbinden mit kosmischen Rhythmen.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos umfasst 7 Räucherwerke, jeweils einer Planetenkraft zugeordnet. Mit speziellen Düften helfen sie, Energien auszugleichen und zu stärken und sich mit kosmischen Rhythmen zu verbinden. Ein Ritual zur Harmonisierung von Körper, Geist und Seele. Mit jedem Duft aktivierst du die einzigartige Kraft eines Planeten – von der Vitalität der Sonne bis zur Struktur des Saturn. Ein astrales Ritual, um Emotionen zu ordnen, den Willen zu stärken und die Verbindung zu den natürlichen Zyklen des Universums zu wecken.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 7 sticks.\n  <br>\n  Composizione: Herbs, resins, cedar, vegetable charcoal, fruit biomass, natural binder and salt.\n  <br>\n  <br>\n  7 bastoncini d’incenso Cosmos, ciascuno legato a un pianeta e al suo potere unico. Con aromi speciali equilibrano e potenziano le energie e aiutano a connettersi ai ritmi cosmici.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos comprende 7 incensi, ciascuno legato a un pianeta e alla sua forza unica. Con profumazioni specifiche aiutano a riequilibrare e potenziare le energie, favorendo la sintonia con i ritmi cosmici. Un rituale per armonizzare corpo, mente e anima. Con ogni fragranza attivi l’energia di un corpo celeste: dalla vitalità del Sole alla struttura di Saturno. Un rituale astrale per armonizzare le emozioni, rafforzare la volontà e risvegliare la connessione con i cicli naturali dell’universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR" Cosmos, cada una vinculada a un planeta y a su poder único. Con aromas especiales equilibran y potencian las energías y ayudan a conectar con los ritmos cósmicos.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Cosmos\n  </strong>\n  <br>\n  Cosmos incluye 7 inciensos, cada uno vinculado a un planeta y a su poder único. Con aromas específicos ayudan a equilibrar y potenciar tus energías, conectándote con los ritmos cósmicos. Un ritual para armonizar cuerpo, mente y alma. Con cada fragancia activas la fuerza de un cuerpo celeste: desde la vitalidad del Sol hasta la estructura de Saturno. Un ritual astral para armonizar emociones, fortalecer la voluntad y despertar la conexión con los ciclos naturales del universo.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7296", "title": {"NL": "Sagrada Madre Natuurlijke wierook Orakel Heilige Dieren -- ±24g", "EN": "Sagrada Madre Natural incense Oracle Sacred Animals -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Orakel Heilige Tiere -- ±24g", "IT": "Sagrada Madre incenso naturale Oracolo Animali sacri -- ±24g", "FR": "Sagrada Madre Encens naturel Oracle Animaux sacrés -- ±24g", "ES": "Sagrada Madre incienso natural Oráculo Animales sagrados -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 8 sticks.\n  <br>\n  Samenstelling: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Een orakel met 12 tarotkaarten uit de Grote Arcana: elke doos bevat een verrassingskaart met een unieke boodschap. De wierook bevat aroma’s van jasmijn, roos en citroen.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Orakel\n  </strong>\n  <br>\n  Oracle Incense is een moment om te pauzeren, te ademen en terug te keren naar je centrum. Elke doos nodigt uit om via geur en boodschap contact te maken met intuïtie. Elke kaart die verschijnt draagt de energie die je op dat moment nodig hebt—niet toeval, maar synchroniciteit. Inhoud per doos: 1 verrassings-orakelkaart (uit 12 verzamelkaarten) en 8 wierookstokjes met jasmijn-, rozen- en citroenaroma. Gebruik de kaarten als een single-card reading (één vraag, één boodschap) of een three-card reading (het nu, de uitdaging, de beschikbare guidance).\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 8 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  An oracle with 12 major arcana tarot cards: each box contains a surprise card that carries a unique message. The incense inside enhances the experience, expanding the senses with the aroma of mystical myrrh.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Oracle\n  </strong>\n  <br>\n  Oracle Incense A moment to pause, breathe, and return to your center. This box is an invitation to connect with your intuition through aroma and message.Each card that appears carries the exact energy you need to receive at that moment. It’s not chance: it’s synchronicity. Each box includes: 1 surprise oracle card (from 12 collectables) 8 incense sticks with jasmine, rose, and lemon aroma You can use the cards in different ways. One option is a single-card reading: choose one card while holding a question in mind, and receive a clear message for your present. Another option is a three-card reading, ideal when you need deeper insight. In this spread, each card represents the now, the challenge, and the guidance available to you. This oracle helps you connect with your inner energy, see with greater clarity, and find the message your soul needs to hear.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 8 sticks.\n  <br>\n  Zusammensetzung: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Ein Orakel mit 12 Tarotkarten der Großen Arkana: Jede Box enthält eine Überraschungskarte mit einer einzigartigen Botschaft. Das Räucherwerk duftet nach Jasmin, Rose und Zitrone.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Orakel\n  </strong>\n  <br>\n  Oracle Incense ist ein Moment zum Innehalten, Durchatmen und Zurückkehren in die eigene Mitte. Jede Box lädt dazu ein, über Duft und Botschaft die Intuition zu stärken. Jede gezogene Karte trägt genau die Energie, die du gerade brauchst – nicht Zufall, sondern Synchronizität. Inhalt: 1 Überraschungs-Orakelkarte (aus 12 Sammelkarten) und 8 Räucherstäbchen mit Jasmin-, Rosen- und Zitronenduft. Die Karten lassen sich als Ein-Karten-Legung oder als Drei-Karten-Legung nutzen (Jetzt, Herausforderung, Führung).\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 8 sticks.\n  <br>\n  Composizione: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Un oracolo con 12 carte dei Tarocchi degli Arcani Maggiori: ogni confezione include una carta sorpresa con un messaggio unico. L’incenso ha note di gelsomino, rosa e limone.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Oracolo\n  </strong>\n  <br>\n  Oracle Incense è un invito a fermarsi, respirare e tornare al centro. Ogni confezione ti accompagna verso l’intuizione attraverso aroma e messaggio. La carta che appare porta l’energia di cui hai bisogno in quel momento: non è caso, è sincronicità. Ogni box include: 1 carta oracolo sorpresa (tra 12 collezionabili) e 8 bastoncini d’incenso con aroma di gelsomino, rosa e limone. Le carte si possono usare con una lettura a una carta o con una lettura a tre carte (il presente, la sfida, la guida disponibile).\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 8 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Un oracle avec 12 cartes de tarot des Arcanes majeurs : chaque boîte contient une carte surprise portant un message unique. L’encens est aux notes de jasmin, rose et citron.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Oracle\n  </strong>\n  <br>\n  Oracle Incense, c’est une pause pour respirer et revenir à son centre. Chaque boîte invite à se relier à l’intuition par le parfum et le message. La carte qui apparaît porte l’énergie dont vous avez besoin à cet instant : ce n’est pas le hasard, c’est la synchronicité. Chaque boîte contient : 1 carte oracle surprise (parmi 12 à collectionner) et 8 bâtonnets d’encens aux notes de jasmin, rose et citron. Les cartes s’utilisent en tirage à une carte ou en tirage à trois cartes (le présent, le défi, la guidance).\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 8 sticks.\n  <br>\n  Composición: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Un oráculo con 12 cartas del tarot de los Arcanos Mayores: cada caja incluye una carta sorpresa con un mensaje único. El incienso tiene aromas de jazmín, rosa y limón.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Oráculo\n  </strong>\n  <br>\n  Oracle Incense es un momento para parar, respirar y volver al centro. Cada caja invita a conectar con la intuición a través del aroma y del mensaje. La carta que aparece trae la energía que necesitas en ese instante: no es azar, es sincronicidad. Cada caja incluye: 1 carta de oráculo sorpresa (de 12 coleccionables) y 8 varillas de incienso con aroma de jazmín, rosa y limón. Puedes usar las cartas en una lectura de una carta o en una lectura de tres cartas (el ahora, el desafío y la guía disponible).\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7297", "title": {"NL": "Sagrada Madre Natuurlijke wierook Orakel Wijsheid -- ±24g", "EN": "Sagrada Madre Natural incense Oracle Wisdom -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Orakel Weisheit -- ±24g", "IT": "Sagrada Madre incenso naturale Oracolo Saggezza -- ±24g", "FR": "Sagrada Madre Encens naturel Oracle Sagesse -- ±24g", "ES": "Sagrada Madre incienso natural Oráculo Sabiduría -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 8 sticks.\n  <br>\n  Samenstelling: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Een orakel met 12 kaarten van heilige dieren: elke doos bevat een verrassingskaart met een unieke boodschap. De wierook bevat aroma’s van jasmijn, roos en citroen.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7275", "title": {"NL": "Sagrada Madre Natuurlijke wierook Tarot de Marsella Musk Frankincense -- ±24g", "EN": "Sagrada Madre Natural incense Tarot de Marsella Musk Frankincense -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Tarot de Marsella Moschus Frankincense -- ±24g", "IT": "Sagrada Madre incenso naturale Tarot de Marsella Muschio Frankincense -- ±24g", "FR": "Sagrada Madre Encens naturel Tarot de Marseille Musc Frankincense -- ±24g", "ES": "Sagrada Madre incienso natural Tarot de Marsella Almizcle Frankincense -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 6 sticks.\n  <br>\n  Samenstelling: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  De diepte van musk mengt met de zuiverende kracht van olibanum. Een combinatie die aardt, zuivert en energie vernieuwt. Een geurige reis naar balans en concentratie.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Verzameleditie aromatische wierook uit de Tarot de Marseille-lijn. Elke doos bevat een exclusieve geur en twee willekeurig geselecteerde gestanste kaarten uit de 22 Grote Arcana. Soms fluistert het universum; Tarot de Marseille biedt dat moment van geur, symbool en stilte. Steek aan, adem, en laat de rook de weg naar intuïtie openen.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 6 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  The depth of Musk blends with the purifying power of Frankincense. A fusion that grounds, cleanses, and renews energy. An intense aroma to balance body, mind, and spirit.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Collectible edition of aromatic incense from the Tarot of Marseille line. Each box includes an exclusive scent and two randomly selected die-cut cards from the 22 Major Arcana of the Tarot. Tarot Incenses Sometimes the universe whispers, and all we need is a moment of silence to hear it. Tarot de Marseille is that space — scent, symbol, and stillness. Inside each box, two arcana arrive with the precise message your soul needs. Light, breathe, and allow the smoke to open the path to your intuition. Each reading is a reunion with your inner power — a subtle guide between fragrance and mystery.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 6 sticks.\n  <br>\n  Zusammensetzung: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Die Tiefe von Moschus verbindet sich mit der reinigenden Kraft von Weihrauch. Eine Mischung, die erdet, klärt und Energie erneuert. Eine duftende Reise zu Balance und Fokus.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Sammel-Edition aromatischen Räucherwerks aus der Tarot-de-Marseille-Linie. Jede Box enthält einen exklusiven Duft und zwei zufällig ausgewählte Stanzkarten aus den 22 Großen Arkana. Manchmal flüstert das Universum – Tarot de Marseille ist dieser Raum aus Duft, Symbol und Stille. Anzünden, atmen und dem Rauch den Weg zur Intuition öffnen lassen.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 6 sticks.\n  <br>\n  Composizione: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La profondità del muschio si unisce al potere purificante dell’olibano. Una fusione che radica, pulisce e rinnova l’energia. Un viaggio olfattivo verso equilibrio e concentrazione.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edizione da collezione di incenso aromatico della linea Tarot de Marseille. Ogni confezione include una fragranza esclusiva e due carte fustellate selezionate casualmente tra i 22 Arcani Maggiori. A volte l’universo sussurra: Tarot de Marseille è quello spazio di profumo, simbolo e silenzio. Accendi, respira e lascia che il fumo apra la via all’intuizione.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 6 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La profondeur du musc se mêle au pouvoir purifiant de l’oliban. Une fusion qui ancre, purifie et renouvelle l’énergie. Un voyage olfactif vers l’équilibre et la concentration.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marseille\n  </strong>\n  <br>\n  Édition à collectionner d’encens aromatique de la gamme Tarot de Marseille. Chaque boîte comprend une senteur exclusive et deux cartes découpées au hasard parmi les 22 Arcanes majeurs. Parfois l’univers murmure : Tarot de Marseille crée cet espace — parfum, symbole et silence. Allumez, respirez et laissez la fumée ouvrir le chemin de l’intuition.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 6 sticks.\n  <br>\n  Composición: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La profundidad del almizcle se une al poder purificador del olíbano. Una fusión que enraíza, limpia y renueva la energía. Un viaje aromático hacia equilibrio y enfoque.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edición coleccionable de incienso aromático de la línea Tarot de Marseille. Cada caja incluye una fragancia exclusiva y dos cartas troqueladas elegidas al azar de los 2
