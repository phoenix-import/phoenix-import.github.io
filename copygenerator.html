a del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edición coleccionable de incienso aromático de la línea Tarot de Marseille. Cada caja incluye una fragancia exclusiva y dos cartas troqueladas elegidas al azar de los 22 Arcanos Mayores. A veces el universo susurra: Tarot de Marseille es ese espacio de aroma, símbolo y silencio. Enciende, respira y deja que el humo abra el camino hacia la intuición.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7277", "title": {"NL": "Sagrada Madre Natuurlijke wierook Tarot de Marsella Nag Champa Frankincense -- ±24g", "EN": "Sagrada Madre Natural incense Tarot de Marsella Nag Champa Frankincense -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Tarot de Marsella Nag Champa Frankincense -- ±24g", "IT": "Sagrada Madre incenso naturale Tarot de Marsella Nag Champa Frankincense -- ±24g", "FR": "Sagrada Madre Encens naturel Tarot de Marseille Nag Champa Frankincense -- ±24g", "ES": "Sagrada Madre incienso natural Tarot de Marsella Nag Champa Frankincense -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 6 sticks.\n  <br>\n  Samenstelling: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  De bloemige zachtheid van nag champa mengt met de zuiverende kracht van olibanum. Een combinatie die energie verheft, zuivert en de weg opent naar innerlijke rust.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Verzameleditie aromatische wierook uit de Tarot de Marseille-lijn. Elke doos bevat een exclusieve geur en twee willekeurig geselecteerde gestanste kaarten uit de 22 Grote Arcana. Soms fluistert het universum; Tarot de Marseille biedt dat moment van geur, symbool en stilte. Steek aan, adem, en laat de rook de weg naar intuïtie openen.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 6 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  The floral softness of Nag Champa blends with the purifying power of Frankincense. A combination that elevates energy, cleanses the space, and soothes the spirit. A sacred aroma for moments of inner connection.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Collectible edition of aromatic incense from the Tarot of Marseille line. Each box includes an exclusive scent and two randomly selected die-cut cards from the 22 Major Arcana of the Tarot. Tarot Incenses Sometimes the universe whispers, and all we need is a moment of silence to hear it. Tarot de Marseille is that space — scent, symbol, and stillness. Inside each box, two arcana arrive with the precise message your soul needs. Light, breathe, and allow the smoke to open the path to your intuition. Each reading is a reunion with your inner power — a subtle guide between fragrance and mystery.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 6 sticks.\n  <br>\n  Zusammensetzung: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Die florale Sanftheit von Nag Champa verbindet sich mit der reinigenden Kraft von Weihrauch. Eine Kombination, die Energie anhebt, klärt und den Weg zu innerer Ruhe öffnet.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Sammel-Edition aromatischen Räucherwerks aus der Tarot-de-Marseille-Linie. Jede Box enthält einen exklusiven Duft und zwei zufällig ausgewählte Stanzkarten aus den 22 Großen Arkana. Manchmal flüstert das Universum – Tarot de Marseille ist dieser Raum aus Duft, Symbol und Stille. Anzünden, atmen und dem Rauch den Weg zur Intuition öffnen lassen.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 6 sticks.\n  <br>\n  Composizione: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La morbidezza floreale del Nag Champa si unisce al potere purificante dell’olibano. Una combinazione che eleva l’energia, purifica e apre la via alla calma interiore.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edizione da collezione di incenso aromatico della linea Tarot de Marseille. Ogni confezione include una fragranza esclusiva e due carte fustellate selezionate casualmente tra i 22 Arcani Maggiori. A volte l’universo sussurra: Tarot de Marseille è quello spazio di profumo, simbolo e silenzio. Accendi, respira e lascia che il fumo apra la via all’intuizione.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più ve simbolo e silenzio. Accendi, respira e lascia che il fumo apra la via all’intuizione.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 6 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La fraîcheur vive du poivre rose rencontre l’essence sacrée de l’oliban. Une fusion qui réveille l’énergie et purifie l’atmosphère.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marseille\n  </strong>\n  <br>\n  Édition à collectionner d’encens aromatique de la gamme Tarot de Marseille. Chaque boîte comprend une senteur exclusive et deux cartes découpées au hasard parmi les 22 Arcanes majeurs. Parfois l’univers murmure : Tarot de Marseille crée cet espace — parfum, symbole et silence. Allumez, respirez et laissez la fumée ouvrir le chemin de l’intuition.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 6 sticks.\n  <br>\n  Composición: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La frescura vibrante de la pimienta rosa se une a la esencia sagrada del olíbano. Una fusión que despierta la energía y purifica el entorno.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edición coleccionable de incienso aromático de la línea Tarot de Marseille. Cada caja incluye una fragancia exclusiva y dos cartas troqueladas elegidas al azar de los 22 Arcanos Mayores. A veces el universo susurra: Tarot de Marseille es ese espacio de aroma, símbolo y silencio. Enciende, respira y deja que el humo abra el camino hacia la intuición.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7279", "title": {"NL": "Sagrada Madre Natuurlijke wierook Tarot de Marsella Sandalwood Frankincense -- ±24g", "EN": "Sagrada Madre Natural incense Tarot de Marsella Sandalwood Frankincense -- ±24g", "DE": "Sagrada Madre Natural Räucherwerk Tarot an. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 6 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  The warm sweetness of Vanilla meets the purity of Frankincense. A combination that comforts, cleanses, and uplifts the soul. A serene aroma that invites peace and gratitude.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Collectible edition of aromatic incense from the Tarot of Marseille line. Each box includes an exclusive scent and two randomly selected die-cut cards from the 22 Major Arcana of the Tarot. Tarot Incenses Sometimes the universe whispers, and all we need is a moment of silence to hear it. Tarot de Marseille is that space — scent, symbol, and stillness. Inside each box, two arcana arrive with the precise message your soul needs. Light, breathe, and allow the smoke to open the path to your intuition. Each reading is a reunion with your inner power — a subtle guide between fragrance and mystery.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 6 sticks.\n  <br>\n  Zusammensetzung: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  Die warme Süße von Vanille trifft auf die Reinheit von Weihrauch. Eine Mischung, die tröstet, klärt und den Geist aufhellt.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Sammel-Edition aromatischen Räucherwerks aus der Tarot-de-Marseille-Linie. Jede Box enthält einen exklusiven Duft und zwei zufällig ausgewählte Stanzkarten aus den 22 Großen Arkana. Manchmal flüstert das Universum – Tarot de Marseille ist dieser Raum aus Duft, Symbol und Stille. Anzünden, atmen und dem Rauch den Weg zur Intuition öffnen lassen.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 6 sticks.\n  <br>\n  Composizione: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La dolcezza calda della vaniglia incontra la purezza dell’olibano. Una combinazione che conforta, purifica e alleggerisce la mente.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edizione da collezione di incenso aromatico della linea Tarot de Marseille. Ogni confezione include una fragranza esclusiva e due carte fustellate selezionate casualmente tra i 22 Arcani Maggiori. A volte l’universo sussurra: Tarot de Marseille è quello spazio di profumo, simbolo e silenzio. Accendi, respira e lascia che il fumo apra la via all’intuizione.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 6 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La douceur chaude de la vanille rencontre la pureté de l’oliban. Une combinaison qui réconforte, purifie et allège l’esprit.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marseille\n  </strong>\n  <br>\n  Édition à collectionner d’encens aromatique de la gamme Tarot de Marseille. Chaque boîte comprend une senteur exclusive et deux cartes découpées au hasard parmi les 22 Arcanes majeurs. Parfois l’univers murmure : Tarot de Marseille crée cet espace — parfum, symbole et silence. Allumez, respirez et laissez la fumée ouvrir le chemin de l’intuition.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 6 sticks.\n  <br>\n  Composición: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  La dulzura cálida de la vainilla se une a la pureza del olíbano. Una combinación que reconforta, limpia y aligera la mente.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Tarot de Marsella\n  </strong>\n  <br>\n  Edición coleccionable de incienso aromático de la línea Tarot de Marseille. Cada caja incluye una fragancia exclusiva y dos cartas troqueladas elegidas al azar de los 22 Arcanos Mayores. A veces el universo susurra: Tarot de Marseille es ese espacio de aroma, símbolo y silencio. Enciende, respira y deja que el humo abra el camino hacia la intuición.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7281", "title": {"NL": "Sagrada Madre Natuurlijke wierook Palo Santo & Witte salie -- ±30g", "EN": "Sagrada Madre Natural incense Palo Santo & White sage -- ±30g", "DE": "Sagrada Madre Natural Räucherwerk Palo Santo & Weißer Salbei -- ±30g", "IT": "Sagrada Madre incenso naturale Palo Santo & Salvia bianca -- ±30g", "FR": "Sagrada Madre Encens naturel Palo Santo & Sauge blanche -- ±30g", "ES": "Sagrada Madre incienso natural Palo Santo & Salvia blanca -- ±30g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 8 sticks.\n  <br>\n  Samenstelling: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  ‘Moge de vibratie van palo santo en salie mijn ruimte en mijn zijn zuiveren. Moge de warmte van palo santo mij leiden naar heling. Moge salie mijn ziel bevrijden en mijn energie beschermen. Moge de geur mijn intentie versterken en mijn licht verheffen.’\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Palo Santo\n  </strong>\n  <br>\n  Wierook met duurzaam Palo Santo als basis. In combinatie met biomassa vormt dit een milieubewuste wierook, aangevuld met zorgvuldig samengestelde geurcombinaties.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 8 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  May the vibration of palo santo and sage purify my space and being. May the warmth of palo santo guide me towards healing, while the smoke of sage dispels negativity. May both energies surround me with love and peace.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Palo Santo\n  </strong>\n  <br>\n  An incense with sustainable palo santo as a base, along with biomass, make up this eco-friendly incense, to which the most exquisite fragrance combinations are added.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 8 sticks.\n  <br>\n  Zusammensetzung: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  „Möge die Schwingung von Palo Santo und Salbei meinen Raum und mein Sein reinigen. Möge die Wärme von Palo Santo mich zur Heilung führen. Möge Salbei meine Seele befreien und meine Energie schützen. Möge der Duft meine Intention stärken und mein Licht anheben.“\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Palo Santo\n  </strong>\n  <br>\n  Räucherwerk mit nachhaltigem Palo Santo als Basis. Zusammen mit Biomasse entsteht ein umweltbewusstes Räucherwerk, ergänzt um sorgfältig kombinierte Duftkompositionen.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 8 sticks.\n  <br>\n  Composizione: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  “Che la vibrazione del Palo Santo e della salvia purifichi il mio spazio e il mio essere. Che il calore del Palo Santo mi guidi verso la guarigione. Che la salvia liberi la mia anima e protegga la mia energia. Che il profumo rafforzi la mia intenzione ed elevi la mia luce.”\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Palo Santo\n  </strong>\n  <br>\n  Incenso con Palo Santo sostenibile come base. In combinazione con la biomassa, dà origine a un incenso più eco-friendly, completato da combinazioni di fragranze selezionate.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 8 sticks.\n  <br>\n  Composition: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  « Que la vibration du Palo Santo et de la sauge purifie mon espace et mon être. Que la chaleur du Palo Santo me guide vers la guérison. Que la sauge libère mon âme et protège mon énergie. Que le parfum renforce mon intention et élève ma lumière. »\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Palo Santo\n  </strong>\n  <br>\n  Encens à base de Palo Santo durable. Associé à la biomasse, il devient un encens plus respectueux de l’environnement, enrichi de combinaisons olfactives soigneusement choisies.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 8 sticks.\n  <br>\n  Composición: Herbs, fruit biomass, concentrated aromatic oil, charcoal, natural binder, and salt.\n  <br>\n  <br>\n  “Que la vibración del Palo Santo y la salvia purifique mi espacio y mi ser. Que el calor del Palo Santo me guíe hacia la sanación. Que la salvia libere mi alma y proteja mi energía. Que el aroma fortalezca mi intención y eleve mi luz.”\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Palo Santo\n  </strong>\n  <br>\n  Incienso con Palo Santo sostenible como base. Junto con biomasa, forma un incienso más respetuoso con el medio ambiente, al que se añaden combinaciones de fragancias seleccionadas.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7273", "title": {"NL": "Sagrada Madre wierook kit small smudge Sacred Clean Energy -- ±38g", "EN": "Sagrada Madre incense kit small smudge Sacred Clean Energy -- ±38g", "DE": "Sagrada Madre Räucherwerk Set small smudge Sacred Clean Energy -- ±38g", "IT": "Sagrada Madre kit small smudge Sacred Clean Energy -- ±38g", "FR": "Sagrada Madre coffret small smudge Sacred Clean Energy -- ±38g", "ES": "Sagrada Madre kit small smudge Sacred Clean Energy -- ±38g"}, "html": {"NL": "<p>\n  Smudge kit van Sagrada Madre.\n  <br>\n  Samenstelling: 1 Energy Pyramid, 1 Incense Cone, 1 Orange and Incense Incense, 3 Lavender and Incense Beads, 3 Double Combined Incense Sticks, 1 Incense Burner.\n  <br>\n  <br>\n  Smudgen is een handeling van zuivering en verbinding met de natuur. De rook tilt intenties en gebeden op en helpt negatieve energie los te laten. Een smudge kit bevat alles om te beginnen en de ruimte in een rustige flow te brengen.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    Sacred Clean Energy\n  </strong>\n  <br>\n  Wist je dat onze producten milieuvriendelijker zijn? Sagrada Madre is het enige wierookbedrijf in het land dat biomassa als basis in de producten verwerkt, waardoor het gebruik van houtskool sterk wordt verminderd. Zo blijven ze de aarde eren en verkleinen ze de impact. Ze maken deel uit van de suprarecycling-beweging: we zijn onderdeel van deze aarde en trillen in harmonie met haar.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Smudge kit from Sagrada Madre.\n  <br>\n  Composition: 1 Energy Pyramid, 1 Incense Cone, 1 Orange and Incense Incense, 3 Lavender and Incense Beads, 3 Double Combined Incense Sticks, 1 Incense Burner.\n  <br>\n  <br>\n  Smudging is an act of purification, connection with nature. The smoke uplifts our intentions and prayers, connecting us with the earth and the universe. Smudging cleanses energies and connects us with our essence.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    Sacred Clean Energy\n  </strong>\n  <br>\n  Did you know that our products are more environmentally friendly? We are the only incense company in the country that incorporates Biomass as the base of our products, significantly reducing the use of charcoal to continue honoring the earth and lessen our impact on it. We are part of the suprarecycling movement, we are part of this earth, and we vibrate in harmony with it.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Zusammensetzung: 1 Energy Pyramid, 1 Incense Cone, 1 Orange and Incense Incense, 3 Lavender and Incense Beads, 3 Double Combined Incense Sticks, 1 Incense Burner.\n  <br>\n  <br>\n  Smudging ist ein Akt der Reinigung und der Verbindung mit der Natur. Der Rauch trägt Intentionen und Gebete und hilft, negative Energie loszulassen. Ein Smudge-Kit enthält alles, um zu beginnen und den Raum in einen ruhigen Flow zu bringen.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Sacred Clean Energy\n  </strong>\n  <br>\n  Wusstest du, dass unsere Produkte umweltfreundlicher sind? Sagrada Madre ist das einzige Räucherwerk-Unternehmen im Land, das Biomasse als Basis in seine Produkte integriert und so den Einsatz von Holzkohle deutlich reduziert. Damit ehren sie die Erde und verringern ihre Auswirkungen. Sie sind Teil der Suprarecycling-Bewegung – wir sind Teil dieser Erde und schwingen in Harmonie mit ihr.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Kit smudge di Sagrada Madre.\n  <br>\n  Composizione: 1 Energy Pyramid, 1 Incense Cone, 1 Orange and Incense Incense, 3 Lavender and Incense Beads, 3 Double Combined Incense Sticks, 1 Incense Burner.\n  <br>\n  <br>\n  Lo smudging è un atto di purificazione e di connessione con la natura. Il fumo sostiene intenzioni e preghiere e aiuta a lasciar andare l’energia negativa. Un kit smudge contiene tutto il necessario per iniziare e portare l’ambiente in un flusso più calmo.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    Sacred Clean Energy\n  </strong>\n  <br>\n  Sapevi che i nostri prodotti sono più eco-friendly? Sagrada Madre è l’unica azienda di incensi del paese che integra la biomassa come base dei propri prodotti, riducendo in modo significativo l’uso del carbone per continuare a onorare la terra e diminuire l’impatto. Fa parte del movimento suprarecycling: siamo parte di questa terra e vibra in armonia con essa.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Composition: 1 Energy Pyramid, 1 Incense Cone, 1 Orange and Incense Incense, 3 Lavender and Incense Beads, 3 Double Combined Incense Sticks, 1 Incense Burner.\n  <br>\n  <br>\n  Le smudging est un acte de purification et de connexion à la nature. La fumée soutient nos intentions et nos prières et aide à relâcher les énergies négatives. Un kit smudge contient l’essentiel pour commencer et installer une atmosphère plus calme.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    Sacred Clean Energy\n  </strong>\n  <br>\n  Saviez-vous que nos produits sont plus respectueux de l’environnement ? Sagrada Madre est la seule entreprise d’encens du pays à intégrer la biomasse comme base de ses produits, réduisant fortement l’utilisation de charbon afin d’honorer la Terre et de limiter l’impact. Ils font partie du mouvement du suprarecycling : nous faisons partie de cette Terre et vibrons en harmonie avec elle.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Kit de smudging de Sagrada Madre.\n  <br>\n  Composición: 1 Energy Pyramid, 1 Incense Cone, 1 Orange and Incense Incense, 3 Lavender and Incense Beads, 3 Double Combined Incense Sticks, 1 Incense Burner.\n  <br>\n  <br>\n  El smudging es un acto de purificación y conexión con la naturaleza. El humo eleva intenciones y plegarias y ayuda a soltar la energía negativa. Un kit de smudging incluye lo necesario para empezar y llevar el espacio a un estado más sereno.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    Sacred Clean Energy\n  </strong>\n  <br>\n  ¿Sabías que nuestros productos son más respetuosos con el medio ambiente? Sagrada Madre es la única empresa de incienso del país que incorpora biomasa como base de sus productos, reduciendo significativamente el uso de carbón para seguir honrando la tierra y disminuir su impacto. Forma parte del movimiento suprarecycling: somos parte de esta tierra y vibramos en armonía con ella.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7298", "title": {"NL": "Sagrada Madre premium perfume wierook real champa -- ±24g", "EN": "Sagrada Madre premium perfume incense real champa -- ±24g", "DE": "Sagrada Madre Premium Parfüm Räucherwerk Real Champa -- ±24g", "IT": "Sagrada Madre incenso profumo premium real champa -- ±24g", "FR": "Sagrada Madre encens parfum premium real champa -- ±24g", "ES": "Sagrada Madre incienso perfume premium real champa -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 8 sticks.\n  <br>\n  Samenstelling: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  De mystieke essentie van Nag Champa op z’n best: een parfumachtige geur die de zintuigen omhult en een serene, spirituele sfeer neerzet.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    real\n  </strong>\n  <br>\n  IMPACT OP HET MILIEU Sagrada Madre is zich zeer bewust van de impact op het milieu, persoonlijk en als bedrijf. Daarom versterken ze dagelijks hun commitment met concrete acties die positief bijdragen aan de zorg voor de planeet en haar bewoners. Via ReforestArg (herbebossing) helpen ze met ecologisch herstel van bossen die door branden zijn aangetast, met focus op inheemse soorten en de bijbehorende ecologische relaties. In het regenseizoen werkt Sagrada Madre samen met de plattelandsgemeenschap van Andanjo in Piura (Peru) om inheemse Palo Santo-bomen te planten. Elke keer dat je Sagrada Madre gebruikt, draag je bij aan herbebossing en milieuzorg. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 8 sticks.\n  <br>\n  Composition: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  The mystical essence of Nag Champa at its finest, a perfume that elevates the soul and envelops the senses in an aura of royalty and spirituality.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    real\n  </strong>\n  <br>\n  IMPACT ON THE ENVIRONMENT At Sagrada Madre, we are very aware of our impact on the environment, personally and as a company, which is why we daily reinforce our commitment with concrete actions that contribute positively to the care of the planet and the beings that inhabit it. Through ReforestArg, an organisation for reforestation, we help carry out the ecological restoration of forests degraded by fires, seeking to recover their original structure and diversity. This active restoration is necessary in areas where natural recovery is difficult. We prioritize native species that have evolved and adapted to local conditions over thousands of years, forming part of biotic communities and important ecological interrelationships with other species.ReforestationEvery rainy season, Sagrada Madre collaborates with the rural community of Andanjo in Piura, Peru, to plant native Palo Santo trees and contribute to the reforestation of this tree that does so much good to our land and to ourselves.Every time you use an incense from Sagrada Madre, you are contributing to reforestation and environmental care.We are united in harmony\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 8 sticks.\n  <br>\n  Zusammensetzung: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Die mystische Essenz von Nag Champa in ihrer feinsten Form: ein parfumartiger Duft, der die Sinne umhüllt und eine ruhige, spirituelle Atmosphäre schafft.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Real\n  </strong>\n  <br>\n  UMWELTAUSWIRKUNGEN Sagrada Madre ist sich der Auswirkungen auf die Umwelt sehr bewusst – persönlich und als Unternehmen. Deshalb bekräftigen sie ihr Engagement täglich mit konkreten Maßnahmen für den Schutz des Planeten und seiner Bewohner. Über ReforestArg unterstützen sie die ökologische Wiederherstellung von durch Brände geschädigten Wäldern und priorisieren dabei heimische Arten und ihre ökologischen Beziehungen. In der Regenzeit arbeitet Sagrada Madre mit der ländlichen Gemeinschaft Andanjo in Piura (Peru) zusammen, um heimische Palo-Santo-Bäume zu pflanzen. Mit jedem Sagrada Madre Räucherwerk unterstützt du Wiederaufforstung und Umweltpflege. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 8 sticks.\n  <br>\n  Composizione: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  L’essenza mistica del Nag Champa al suo meglio: una fragranza tipo profumo che avvolge i sensi e crea un’atmosfera serena e spirituale.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    profumo\n  </strong>\n  <br>\n  IMPATTO SULL’AMBIENTE Sagrada Madre è molto consapevole del proprio impatto ambientale, come persone e come azienda. Per questo rafforza ogni giorno il proprio impegno con azioni concrete a favore della cura del pianeta e degli esseri che lo abitano. Tramite ReforestArg sostiene il ripristino ecologico di foreste degradate dagli incendi, privilegiando specie autoctone e le loro relazioni ecologiche. Durante la stagione delle piogge collabora con la comunità rurale di Andanjo a Piura (Perù) per piantare alberi nativi di Palo Santo. Ogni volta che utilizzi un incenso Sagrada Madre contribuisci alla riforestazione e alla tutela dell’ambiente. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 8 sticks.\n  <br>\n  Composition: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  L’essence mystique du Nag Champa dans ce qu’elle a de plus pur : un parfum qui enveloppe les sens et installe une atmosphère sereine et spirituelle.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    parfum\n  </strong>\n  <br>\n  IMPACT SUR L’ENVIRONNEMENT Sagrada Madre est très consciente de son impact environnemental, personnel et en tant qu’entreprise. Ils renforcent chaque jour cet engagement par des actions concrètes pour le soin de la planète et des êtres qui l’habitent. Via ReforestArg, ils soutiennent la restauration écologique de forêts dégradées par les incendies, en privilégiant des espèces natives et leurs interactions écologiques. Pendant la saison des pluies, Sagrada Madre collabore avec la communauté rurale d’Andanjo à Piura (Pérou) pour planter des Palo Santo natifs. Chaque utilisation d’un encens Sagrada Madre contribue à la reforestation et à la protection de l’environnement. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 8 sticks.\n  <br>\n  Composición: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  La esencia mística del Nag Champa en su mejor versión: una fragancia tipo perfume que envuelve los sentidos y crea un ambiente sereno y espiritual.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    perfume\n  </strong>\n  <br>\n  IMPACTO EN EL MEDIO AMBIENTE Sagrada Madre es muy consciente de su impacto ambiental, a nivel personal y como empresa. Por eso refuerzan a diario su compromiso con acciones concretas que contribuyen al cuidado del planeta y de quienes lo habitan. A través de ReforestArg ayudan en la restauración ecológica de bosques degradados por incendios, priorizando especies nativas y sus interrelaciones ecológicas. En temporada de lluvias, Sagrada Madre colabora con la comunidad rural de Andanjo en Piura (Perú) para plantar árboles nativos de Palo Santo. Cada vez que usas incienso Sagrada Madre contribuyes a la reforestación y al cuidado ambiental. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7299", "title": {"NL": "Sagrada Madre premium perfume wierook heavenly nectar -- ±24g", "EN": "Sagrada Madre premium perfume incense heavenly nectar -- ±24g", "DE": "Sagrada Madre Premium Parfüm Räucherwerk Heavenly Nectar -- ±24g", "IT": "Sagrada Madre incenso profumo premium nettare celeste -- ±24g", "FR": "Sagrada Madre encens parfum premium nectar céleste -- ±24g", "ES": "Sagrada Madre incienso perfume premium néctar celestial -- ±24g"}, "html": {"NL": "<p>\n  Wierookstokjes van Sagrada Madre.\n  <br>\n  Elke verpakking bevat 8 sticks.\n  <br>\n  Samenstelling: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Deze premium geparfumeerde wierook is geïnspireerd op Heavenly Nectar, met warme, omhullende tonen van Indiase bloemen en zachte zoetheid.\n</p>\n<p>\n  <strong>\n    Waarschuwingen - instructies voor gebruik\n  </strong>\n  <br>\n  Plaats de wierook in een geschikte wierookbrander.\n  <br>\n  Laat brandende wierook niet onbeheerd achter.\n  <br>\n  Buiten bereik van kinderen houden.\n  <br>\n  Goed ventileren.\n  <br>\n</p>\n<p>\n  <strong>\n    heavenly\n  </strong>\n  <br>\n  IMPACT OP HET MILIEU Sagrada Madre is zich zeer bewust van de impact op het milieu, persoonlijk en als bedrijf. Daarom versterken ze dagelijks hun commitment met concrete acties die positief bijdragen aan de zorg voor de planeet en haar bewoners. Via ReforestArg (herbebossing) helpen ze met ecologisch herstel van bossen die door branden zijn aangetast, met focus op inheemse soorten en de bijbehorende ecologische relaties. In het regenseizoen werkt Sagrada Madre samen met de plattelandsgemeenschap van Andanjo in Piura (Peru) om inheemse Palo Santo-bomen te planten. Elke keer dat je Sagrada Madre gebruikt, draag je bij aan herbebossing en milieuzorg. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre betekent &#x27;Heilige Moeder&#x27;, Pancha Mama, en deze naam duidt op hoe zij omgaan met de hulpbronnen van onze Aarde. Voor het oogsten van Palo Santo, gebruikt Sagrada Madre alleen de oudere takken die van nature uit de boom zijn gevallen. Ze werken direct samen met inheemse gemeenschappen in Peru en Argentinië om Palo Santo bomen te planten en ontbossing tegen te gaan. Ook draagt Sagrada Madre er zorg voor meer bomen te planten dan zij verbruiken.\n</p>", "EN": "<p>\n  Incense sticks from Sagrada Madre.\n  <br>\n  Each pack contains 8 sticks.\n  <br>\n  Composition: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  This premium scented incense line is inspired by the mystical Heavenly Nectar, with warm and enveloping tones of Indian aromas. An olfactory experience that transports the soul to sacred lands, evoking serenity and spiritual connection.\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    heavenly\n  </strong>\n  <br>\n  IMPACT ON THE ENVIRONMENT At Sagrada Madre, we are very aware of our impact on the environment, personally and as a company, which is why we daily reinforce our commitment with concrete actions that contribute positively to the care of the planet and the beings that inhabit it. Through ReforestArg, an organisation for reforestation, we help carry out the ecological restoration of forests degraded by fires, seeking to recover their original structure and diversity. This active restoration is necessary in areas where natural recovery is difficult. We prioritize native species that have evolved and adapted to local conditions over thousands of years, forming part of biotic communities and important ecological interrelationships with other species.ReforestationEvery rainy season, Sagrada Madre collaborates with the rural community of Andanjo in Piura, Peru, to plant native Palo Santo trees and contribute to the reforestation of this tree that does so much good to our land and to ourselves.Every time you use an incense from Sagrada Madre, you are contributing to reforestation and environmental care.We are united in harmony\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 8 sticks.\n  <br>\n  Zusammensetzung: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Diese premium parfümierte Räucherware ist von Heavenly Nectar inspiriert, mit warmen, umhüllenden Noten indischer Blüten und sanfter Süße.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Heavenly\n  </strong>\n  <br>\n  UMWELTAUSWIRKUNGEN dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    profumo\n  </strong>\n  <br>\n  IMPATTO SULL’AMBIENTE Sagrada Madre è molto consapevole del proprio impatto ambientale, come persone e come azienda. Per questo rafforza ogni giorno il proprio impegno con azioni concrete a favore della cura del pianeta e degli esseri che lo abitano. Tramite ReforestArg sostiene il ripristino ecologico di foreste degradate dagli incendi, privilegiando specie autoctone e le loro relazioni ecologiche. Durante la stagione delle piogge collabora con la comunità rurale di Andanjo a Piura (Perù) per piantare alberi nativi di Palo Santo. Ogni volta che utilizzi un incenso Sagrada Madre contribuisci alla riforestazione e alla tutela dell’ambiente. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 8 sticks.\n  <br>\n  Composition: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Cet encens premium parfumé s’inspire de la profondeur de Hindu Sandalwood. Des notes chaudes et boisées pour une ambiance calme et méditative.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    parfum\n  </strong>\n  <br>\n  IMPACT SUR L’ENVIRONNEMENT Sagrada Madre .\n</p>\n<p>\n  <strong>\n    Warnings – instructions for use\n  </strong>\n  <br>\n  Place in a suitable incense burner.\n  <br>\n  Do not leave burning incense unattended.\n  <br>\n  Keep out of the reach of children.\n  <br>\n  Ventilate well.\n  <br>\n</p>\n<p>\n  <strong>\n    orange\n  </strong>\n  <br>\n  IMPACT ON THE ENVIRONMENT At Sagrada Madre, we are very aware of our impact on the environment, personally and as a company, which is why we daily reinforce our commitment with concrete actions that contribute positively to the care of the planet and the beings that inhabit it. Through ReforestArg, an organisation for reforestation, we help carry out the ecological restoration of forests degraded by fires, seeking to recover their original structure and diversity. This active restoration is necessary in areas where natural recovery is difficult. We prioritize native species that have evolved and adapted to local conditions over thousands of years, forming part of biotic communities and important ecological interrelationships with other species.ReforestationEvery rainy season, Sagrada Madre collaborates with the rural community of Andanjo in Piura, Peru, to plant native Palo Santo trees and contribute to the reforestation of this tree that does so much good to our land and to ourselves.Every time you use an incense from Sagrada Madre, you are contributing to reforestation and environmental care.We are united in harmony\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre means ‘Holy Mother’, Pancha Mama, and this name reflects how they treat the Earth’s resources. For Palo Santo harvesting, Sagrada Madre only uses older branches that fell from the tree naturally. They work directly with native communities in Peru and Argentina to plant Palo Santo trees and fight deforestation. They also make sure to plant more trees than they use.\n</p>", "DE": "<p>\n  Räucherstäbchen von Sagrada Madre.\n  <br>\n  Jede Packung enthält 8 sticks.\n  <br>\n  Zusammensetzung: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Diese premium parfümierte Räucherware ist von der lebendigen Intensität von Pfeffer und der strahlenden Wärme von Orange inspiriert. Eine dynamische Kombination mit Biss.\n</p>\n<p>\n  <strong>\n    Warnhinweise - Gebrauchsanweisung\n  </strong>\n  <br>\n  In ein geeignetes Räuchergefäß stellen.\n  <br>\n  Brennendes Räucherwerk nicht unbeaufsichtigt lassen.\n  <br>\n  Außerhalb der Reichweite von Kindern aufbewahren.\n  <br>\n  Gut lüften.\n  <br>\n</p>\n<p>\n  <strong>\n    Orange\n  </strong>\n  <br>\n  UMWELTAUSWIRKUNGEN Sagrada Madre ist sich der Auswirkungen auf die Umwelt sehr bewusst – persönlich und als Unternehmen. Deshalb bekräftigen sie ihr Engagement täglich mit konkreten Maßnahmen für den Schutz des Planeten und seiner Bewohner. Über ReforestArg unterstützen sie die ökologische Wiederherstellung von durch Brände geschädigten Wäldern und priorisieren dabei heimische Arten und ihre ökologischen Beziehungen. In der Regenzeit arbeitet Sagrada Madre mit der ländlichen Gemeinschaft Andanjo in Piura (Peru) zusammen, um heimische Palo-Santo-Bäume zu pflanzen. Mit jedem Sagrada Madre Räucherwerk unterstützt du Wiederaufforstung und Umweltpflege. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre bedeutet „Heilige Mutter“, Pancha Mama, und dieser Name spiegelt wider, wie sie mit den Ressourcen der Erde umgehen. Für die Ernte von Palo Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 8 sticks.\n  <br>\n  Composizione: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Questo incenso profumato premium si ispira all’intensità del pepe e al calore agrumato dell’arancia. Una combinazione vivace e decisa.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    profumo\n  </strong>\n  <br>\n  IMPATTO SULL’AMBIENTE Sagrada Madre è molto consapevole del proprio impatto ambientale, come persone e come azienda. Per questo rafforza ogni giorno il proprio impegno con azioni concrete a favore della cura del pianeta e degli esseri che lo abitano. Tramite ReforestArg sostiene il ripristino ecologico di foreste degradate dagli incendi, privilegiando specie autoctone e le loro relazioni ecologiche. Durante la stagione delle piogge collabora con la comunità rurale di Andanjo a Piura (Perù) per piantare alberi nativi di Palo Santo. Ogni volta che utilizzi un incenso Sagrada Madre contribuisci alla riforestazione e alla tutela dell’ambiente. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 8 sticks.\n  <br>\n  Composition: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Cet encens premium parfumé s’inspire de l’intensité du poivre et de la chaleur lumineuse de l’orange. Une composition vive, avec du caractère.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    parfum\n  </strong>\n  <br>\n  IMPACT SUR L’ENVIRONNEMENT Sagrada Madre est très consciente de son impact environnemental, personnel et en tant qu’entreprise. Ils renforcent chaque jour cet engagement par des actions concrètes pour le soin de la planète et des êtres qui l’habitent. Via ReforestArg, ils soutiennent la restauration écologique de forêts dégradées par les incendies, en privilégiant des espèces natives et leurs interactions écologiques. Pendant la saison des pluies, Sagrada Madre collabore avec la communauté rurale d’Andanjo à Piura (Pérou) pour planter des Palo Santo natifs. Chaque utilisation d’un encens Sagrada Madre contribue à la reforestation et à la protection de l’environnement. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 8 sticks.\n  <br>\n  Composición: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Este incienso premium perfumado se inspira en la intensidad de la pimienta y la calidez radiante de la naranja. Una combinación viva y con carácter.\n</p>\n<p>\n  <  Santo verwendet Sagrada Madre nur ältere Äste, die auf natürliche Weise vom Baum gefallen sind. Sie arbeiten direkt mit einheimischen Gemeinschaften in Peru und Argentinien zusammen, um Palo-Santo-Bäume zu pflanzen und die Entwaldung zu bekämpfen. Außerdem stellt Sagrada Madre sicher, dass mehr Bäume gepflanzt werden, als genutzt werden.\n</p>", "IT": "<p>\n  Bastoncini d’incenso di Sagrada Madre.\n  <br>\n  Ogni confezione contiene 8 sticks.\n  <br>\n  Composizione: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Clean Energy diffonde una fragranza pura e rivitalizzante, pensata per liberare l’ambiente da energie pesanti e alleggerire l’atmosfera.\n</p>\n<p>\n  <strong>\n    Avvertenze - istruzioni per l’uso\n  </strong>\n  <br>\n  Posizionare in un portaincenso adatto.\n  <br>\n  Non lasciare l’incenso acceso incustodito.\n  <br>\n  Tenere fuori dalla portata dei bambini.\n  <br>\n  Aerare bene.\n  <br>\n</p>\n<p>\n  <strong>\n    profumo\n  </strong>\n  <br>\n  IMPATTO SULL’AMBIENTE Sagrada Madre è molto consapevole del proprio impatto ambientale, come persone e come azienda. Per questo rafforza ogni giorno il proprio impegno con azioni concrete a favore della cura del pianeta e degli esseri che lo abitano. Tramite ReforestArg sostiene il ripristino ecologico di foreste degradate dagli incendi, privilegiando specie autoctone e le loro relazioni ecologiche. Durante la stagione delle piogge collabora con la comunità rurale di Andanjo a Piura (Perù) per piantare alberi nativi di Palo Santo. Ogni volta che utilizzi un incenso Sagrada Madre contribuisci alla riforestazione e alla tutela dell’ambiente. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, e questo nome riflette il modo in cui trattano le risorse della Terra. Per la raccolta del Palo Santo, Sagrada Madre utilizza solo i rami più vecchi caduti naturalmente dall’albero. Collaborano direttamente con comunità native in Perù e Argentina per piantare alberi di Palo Santo e combattere la deforestazione. Inoltre, si assicurano di piantare più alberi di quanti ne utilizzino.\n</p>", "FR": "<p>\n  Bâtonnets d’encens Sagrada Madre.\n  <br>\n  Chaque boîte contient 8 sticks.\n  <br>\n  Composition: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Clean Energy dégage un parfum pur et revitalisant, conçu pour nettoyer l’atmosphère des énergies lourdes et la rendre plus légère.\n</p>\n<p>\n  <strong>\n    Avertissements – instructions d’utilisation\n  </strong>\n  <br>\n  Placer dans un porte-encens adapté.\n  <br>\n  Ne pas laisser l’encens brûler sans surveillance.\n  <br>\n  Tenir hors de portée des enfants.\n  <br>\n  Bien ventiler.\n  <br>\n</p>\n<p>\n  <strong>\n    parfum\n  </strong>\n  <br>\n  IMPACT SUR L’ENVIRONNEMENT Sagrada Madre est très consciente de son impact environnemental, personnel et en tant qu’entreprise. Ils renforcent chaque jour cet engagement par des actions concrètes pour le soin de la planète et des êtres qui l’habitent. Via ReforestArg, ils soutiennent la restauration écologique de forêts dégradées par les incendies, en privilégiant des espèces natives et leurs interactions écologiques. Pendant la saison des pluies, Sagrada Madre collabore avec la communauté rurale d’Andanjo à Piura (Pérou) pour planter des Palo Santo natifs. Chaque utilisation d’un encens Sagrada Madre contribue à la reforestation et à la protection de l’environnement. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre signifie « Sainte Mère », Pancha Mama, et ce nom reflète la façon dont ils traitent les ressources de la Terre. Pour la récolte du Palo Santo, Sagrada Madre n’utilise que les branches plus anciennes tombées naturellement de l’arbre. Ils travaillent directement avec des communautés indigènes au Pérou et en Argentine pour planter des arbres de Palo Santo et lutter contre la déforestation. Ils veillent également à planter plus d’arbres qu’ils n’en utilisent.\n</p>", "ES": "<p>\n  Varillas de incienso de Sagrada Madre.\n  <br>\n  Cada paquete contiene 8 sticks.\n  <br>\n  Composición: Concentrated aromatic oil, charcoal, natural binder and salt.\n  <br>\n  <br>\n  Clean Energy desprende una fragancia pura y revitalizante, diseñada para limpiar el ambiente de energías densas y aligerar la atmósfera.\n</p>\n<p>\n  <strong>\n    Advertencias - instrucciones de uso\n  </strong>\n  <br>\n  Colocar en un portainciensos adecuado.\n  <br>\n  No dejar el incienso encendido sin supervisión.\n  <br>\n  Mantener fuera del alcance de los niños.\n  <br>\n  Ventilar bien.\n  <br>\n</p>\n<p>\n  <strong>\n    perfume\n  </strong>\n  <br>\n  IMPACTO EN EL MEDIO AMBIENTE Sagrada Madre es muy consciente de su impacto ambiental, a nivel personal y como empresa. Por eso refuerzan a diario su compromiso con acciones concretas que contribuyen al cuidado del planeta y de quienes lo habitan. A través de ReforestArg ayudan en la restauración ecológica de bosques degradados por incendios, priorizando especies nativas y sus interrelaciones ecológicas. En temporada de lluvias, Sagrada Madre colabora con la comunidad rural de Andanjo en Piura (Perú) para plantar árboles nativos de Palo Santo. Cada vez que usas incienso Sagrada Madre contribuyes a la reforestación y al cuidado ambiental. We are united in harmony.\n</p>\n<p>\n  <strong>\n    Sagrada Madre\n  </strong>\n  <br>\n  Sagrada Madre significa “Santa Madre”, Pancha Mama, y este nombre refleja cómo tratan los recursos de la Tierra. Para la recolección de Palo Santo, Sagrada Madre utiliza únicamente ramas más viejas que han caído de forma natural. Trabajan directamente con comunidades nativas de Perú y Argentina para plantar árboles de Palo Santo y combatir la deforestación. Además, se aseguran de plantar más árboles de los que utilizan.\n</p>"}}, {"sku": "7306", "title": {"NL": "Sagrada Madre premiu
