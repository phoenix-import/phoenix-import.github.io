/* =========================
   ENGINE
   ========================= */

function renderFor(product, lang) {
  const theme = product.theme;
  const scent = DATA.themeToScent[theme];
  const spec = product.spec[lang] || product.spec.EN;
  const term = (DATA.productTerms[product.type] && DATA.productTerms[product.type][lang]) ? DATA.productTerms[product.type][lang] : "";
  const packLine = (DATA.packagingLine(lang, product.packQty) || "").trim();
  const scentProfile = (DATA.scentProfiles[scent] && DATA.scentProfiles[scent][lang]) ? DATA.scentProfiles[scent][lang] : "";

  const tpl = (DATA.templates[product.type] && DATA.templates[product.type][lang])
    ? DATA.templates[product.type][lang]
    : (DATA.templates[product.type] ? DATA.templates[product.type].EN : "");

  let filled = tpl
    .replaceAll("{{LINE}}", DATA.lineName)
    .replaceAll("{{THEME}}", theme)
    .replaceAll("{{SCENT}}", scent)
    .replaceAll("{{SPEC}}", spec)
    .replaceAll("{{TERM}}", term)
    .replaceAll("{{PACK_LINE}}", packLine)
    .replaceAll("{{SCENT_PROFILE}}", scentProfile)
    .replaceAll("{{H_SCENT}}", DATA.headings.scent[lang])
    .replaceAll("{{H_ABOUT}}", DATA.headings.about[lang])
    .replaceAll("{{H_SAFETY}}", DATA.headings.safety[lang])
    .replaceAll("{{H_ABOUTLINE}}", DATA.headings.aboutLine[lang])
    .replaceAll("{{ABOUT_LINE_TEXT}}", DATA.aboutLineText[lang]);

  if (!packLine) {
    filled = filled.replace(/\s*\{\{PACK_LINE\}\}\s*\n/g, "");
  }
  return filled;
}

function buildBundle(product) {
  const bundle = {};
  for (const L of DATA.languages) bundle[L.code] = renderFor(product, L.code);
  return bundle;
}

/* =========================
   UI
   ========================= */

const skuSel = document.getElementById("sku");
const langSel = document.getElementById("lang");
const out = document.getElementById("out");
const preview = document.getElementById("preview");
const meta = document.getElementById("meta");
const tabs = document.getElementById("tabs");
const copyBtn = document.getElementById("copyBtn");
const copyAllBtn = document.getElementById("copyAllBtn");

let currentLang = "EN";

function refreshTabs() {
  tabs.innerHTML = "";
  for (const L of DATA.languages) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(L.code === currentLang));
    b.textContent = L.label;
    b.addEventListener("click", () => {
      currentLang = L.code;
      langSel.value = currentLang;
      update();
    });
    tabs.appendChild(b);
  }
}

function update() {
  const sku = skuSel.value;
  const product = DATA.products.find(p => p.sku === sku);
  if (!product) return;

  const theme = product.theme;
  const scent = DATA.themeToScent[theme];
  const packQty = product.packQty;

  meta.innerHTML =
    `SKU <span class="pill">${product.sku}</span>` +
    ` Theme <span class="pill">${theme}</span>` +
    ` Scent <span class="pill">${scent}</span>` +
    ` Type <span class="pill">${product.type}</span>` +
    (packQty ? ` Pack <span class="pill">sold per ${packQty}</span>` : ` <span class="pill">sold per piece</span>`);

  const html = renderFor(product, currentLang);
  out.value = html;
  preview.innerHTML = html;

  refreshTabs();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const tmp = document.createElement("textarea");
    tmp.value = text;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand("copy");
    document.body.removeChild(tmp);
  }
}

copyBtn.addEventListener("click", async () => {
  await copyText(out.value);
});

copyAllBtn.addEventListener("click", async () => {
  const sku = skuSel.value;
  const product = DATA.products.find(p => p.sku === sku);
  const bundle = {
    sku: product.sku,
    line: DATA.lineName,
    theme: product.theme,
    scent: DATA.themeToScent[product.theme],
    type: product.type,
    html: buildBundle(product),
  };
  await copyText(JSON.stringify(bundle, null, 2));
});

skuSel.addEventListener("change", update);
langSel.addEventListener("change", () => {
  currentLang = langSel.value;
  update();
});

(function init() {
  for (const p of DATA.products) {
    const opt = document.createElement("option");
    opt.value = p.sku;
    opt.textContent = p.sku;
    skuSel.appendChild(opt);
  }
  for (const L of DATA.languages) {
    const opt = document.createElement("option");
    opt.value = L.code;
    opt.textContent = L.label;
    langSel.appendChild(opt);
  }
  skuSel.value = DATA.products[0].sku;
  currentLang = "EN";
  langSel.value = currentLang;
  update();
})();
</script>
