<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Import – Copy Block Builder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Calibri, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #68437B;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; margin: 0; }
    header span { font-size: 13px; opacity: 0.65; }

    .controls {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button.secondary {
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button.secondary:hover { background: #f9fafb; border-color: #9ca3af; }
    button.secondary.copied { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }

    button.ghost {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button.ghost:hover { background: #f9fafb; color: #374151; border-color: #9ca3af; }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #d1fae5;
      color: #065f46;
      font-weight: 500;
    }

    .workspace {
      display: grid;
      grid-template-columns: 210px minmax(0, 1.2fr) minmax(0, 1fr);
      flex: 1;
      height: calc(100vh - 106px);
    }

    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e5e7eb;
      overflow: hidden;
      min-width: 0;
    }

    .pane:last-child { border-right: none; }

    .pane-header {
      padding: 10px 16px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .pane-header h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    .hint { font-size: 11px; color: #9ca3af; }

    /* Palette */
    .palette {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .palette-item {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      padding: 9px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 7px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      cursor: grab;
      transition: all 0.12s;
    }

    .palette-item::before {
      content: "＋";
      color: #ca427e;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .palette-item:hover {
      border-color: #ca427e;
      background: #fdf2f8;
      color: #1a1a2e;
    }

    .palette-item:active { cursor: grabbing; }

    /* Toolbar (shared, acts on focused block) */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 1px;
      padding: 5px 8px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .toolbar button {
      min-width: 28px;
      height: 26px;
      padding: 0 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      line-height: 1;
      font-family: inherit;
    }

    .toolbar button:hover { background: #e5e7eb; border-color: #d1d5db; }

    .toolbar button.active {
      background: #ede9fe;
      border-color: #c4b5fd;
      color: #5b21b6;
    }

    .toolbar .sep {
      display: inline-block;
      width: 1px;
      height: 18px;
      background: #d1d5db;
      margin: 0 4px;
      flex-shrink: 0;
    }

    .toolbar select {
      height: 26px;
      padding: 0 6px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 12px;
      color: #374151;
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    .toolbar select:hover { border-color: #9ca3af; }

    /* Block stack */
    .stack {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      background: #f4f4f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stack-hint {
      margin: auto;
      max-width: 240px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.6;
      padding: 24px;
    }

    .block-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .block-card.dragging { opacity: 0.4; }

    .block-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #f9fafb;
      border-bottom: 1px solid #f0f0f0;
    }

    .drag-handle {
      cursor: grab;
      color: #9ca3af;
      font-size: 15px;
      line-height: 1;
      user-select: none;
      padding: 2px 4px;
    }

    .drag-handle:active { cursor: grabbing; }

    .block-label {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #68437B;
    }

    .block-remove {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 4px;
    }

    .block-remove:hover { color: #b33a6f; background: #fdf2f8; }

    .drop-indicator {
      height: 2px;
      background: #ca427e;
      border-radius: 2px;
      margin: -4px 0;
    }

    /* Editor (contenteditable) — block bodies and (typographic rules) the preview */
    .editor {
      outline: none;
      font-family: Calibri, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a2e;
      background: #fff;
    }

    .block-editor {
      min-height: 58px;
      padding: 10px 14px;
    }

    .block-editor:empty::before {
      content: attr(data-placeholder);
      color: #c4c4cc;
      pointer-events: none;
      display: block;
    }

    .editor h1, .preview h1 { font-size: 1.6em; font-weight: 700; margin: 0.5em 0 0.25em; }
    .editor h2, .preview h2 { font-size: 1.3em; font-weight: 600; margin: 0.5em 0 0.25em; }
    .editor h3, .preview h3 { font-size: 1.1em; font-weight: 600; margin: 0.5em 0 0.25em; }
    .editor p,  .preview p  { margin: 0.3em 0; }
    .editor ul, .editor ol, .preview ul, .preview ol { padding-left: 1.5em; margin: 0.3em 0; }
    .editor blockquote, .preview blockquote {
      border-left: 3px solid #68437B;
      margin: 0.5em 0;
      padding: 4px 12px;
      color: #555;
      background: #f9fafb;
    }
    .editor a, .preview a { color: #68437B; }
    .editor hr, .preview hr { border: none; border-top: 1px solid #d1d5db; margin: 0.75em 0; }

    /* Output pane */
    .preview {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a2e;
    }

    .preview:empty::before {
      content: "Live preview appears here as you build…";
      color: #c4c4cc;
    }

    textarea#output {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 16px;
      background: #f9fafb;
      color: #1a1a2e;
    }
  </style>
</head>
<body>

<header>
  <h1>Phoenix Import — Copy Block Builder</h1>
  <span>Assemble product copy from modular blocks, get Shopify-ready HTML</span>
  <a href="index.html" style="margin-left:auto;line-height:0;"><img src="logo.png" alt="Phoenix Import" style="height:36px;"></a>
</header>

<div class="controls">
  <button class="secondary" id="copyBtn">Copy HTML</button>
  <button class="ghost" id="exportBtn">Export JSON</button>
  <button class="ghost" id="importBtn">Import JSON</button>
  <button class="ghost" id="clearBtn">Clear</button>
  <span class="badge" id="badge">live</span>
</div>

<div class="workspace">
  <!-- Left pane: block palette -->
  <div class="pane">
    <div class="pane-header">
      <h2>Block palette</h2>
      <span class="hint">Drag or click</span>
    </div>
    <div class="palette" id="palette"></div>
  </div>

  <!-- Center pane: shared toolbar + block stack -->
  <div class="pane">
    <div class="pane-header">
      <h2>Copy blocks</h2>
      <span class="hint">Drag the ⠿ handle to reorder</span>
    </div>

    <div class="toolbar" id="toolbar">
      <button title="Undo (Ctrl+Z)" data-cmd="undo">↶</button>
      <button title="Redo (Ctrl+Y)" data-cmd="redo">↷</button>
      <span class="sep"></span>

      <select id="formatSelect" title="Paragraph style">
        <option value="p">Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
      </select>
      <span class="sep"></span>

      <button title="Bold (Ctrl+B)" data-cmd="bold" style="font-weight:700">B</button>
      <button title="Italic (Ctrl+I)" data-cmd="italic" style="font-style:italic">I</button>
      <button title="Underline (Ctrl+U)" data-cmd="underline" style="text-decoration:underline">U</button>
      <button title="Strikethrough" data-cmd="strikeThrough" style="text-decoration:line-through">S</button>
      <span class="sep"></span>
      <button title="Subscript" data-cmd="subscript" style="font-size:11px">X<sub>2</sub></button>
      <button title="Superscript" data-cmd="superscript" style="font-size:11px">X<sup>2</sup></button>
      <span class="sep"></span>
      <button title="Remove formatting" data-cmd="removeFormat" style="font-size:11px">T<sub>x</sub></button>
      <span class="sep"></span>

      <button title="Numbered list" data-cmd="insertOrderedList">1.</button>
      <button title="Bullet list" data-cmd="insertUnorderedList">•</button>
      <button title="Decrease indent" data-cmd="outdent">⇤</button>
      <button title="Increase indent" data-cmd="indent">⇥</button>
      <span class="sep"></span>

      <button title="Blockquote" id="blockquoteBtn" style="font-size:16px;font-weight:700">&ldquo;</button>
      <span class="sep"></span>

      <button title="Align left" data-cmd="justifyLeft" aria-label="Align left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg>
      </button>
      <button title="Align center" data-cmd="justifyCenter" aria-label="Align center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm3 4h12v2H6V9zm-3 4h18v2H3v-2zm3 4h12v2H6v-2z"/></svg>
      </button>
      <button title="Align right" data-cmd="justifyRight" aria-label="Align right">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm6 4h12v2H9V9zm-6 4h18v2H3v-2zm6 4h12v2H9v-2z"/></svg>
      </button>
      <button title="Justify" data-cmd="justifyFull" aria-label="Justify">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm0 4h18v2H3V9zm0 4h18v2H3v-2zm0 4h18v2H3v-2z"/></svg>
      </button>
      <span class="sep"></span>

      <button title="Insert link" id="linkBtn">Link</button>
      <button title="Remove link" data-cmd="unlink">Unlink</button>
      <span class="sep"></span>

      <button title="Horizontal rule" data-cmd="insertHorizontalRule">―</button>
    </div>

    <div class="stack" id="stack">
      <div class="stack-hint" id="stackHint">Drag a block here, or click one in the palette, to start building your copy.</div>
    </div>
  </div>

  <!-- Right pane: live preview + HTML output -->
  <div class="pane">
    <div class="pane-header">
      <h2>Shopify-ready HTML</h2>
      <span class="hint">Paste into metafield</span>
    </div>
    <div class="preview" id="preview"></div>
    <textarea id="output" readonly placeholder="HTML appears here as you build…"></textarea>
  </div>
</div>

<script>
// Use <p> as default block separator (Chrome wraps in <div> otherwise)
try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

const STORAGE_KEY = 'copyBlockBuilder.doc';

/* ---- Block-type palette config ---------------------------------------- */
const BLOCK_TYPES = {
  product_type:  { label: "Product type",           seed: "text" },
  practical:     { label: "Practical description",   seed: "text" },
  evocative:     { label: "Evocative description",   seed: "text" },
  sku:           { label: "SKU / price",             seed: "text" },
  content_list:  { label: "Content list (set)",      seed: "list" },
  ingredients:   { label: "Ingredients",             seed: "list" },
  esoteric:      { label: "Esoteric significance",   seed: "text" },
  how_to_use:    { label: "How to use",              seed: "text" },
  safety:        { label: "Safety guidelines",       seed: "text" },
  brand_line:    { label: "Brand / line info",       seed: "text" },
  commercial:    { label: "Commercial boilerplate",  seed: "text" },
  symbolism:     { label: "Symbolism boilerplate",   seed: "text" }
};

function seedHtml(type) {
  return BLOCK_TYPES[type] && BLOCK_TYPES[type].seed === 'list'
    ? '<ul><li><br></li></ul>'
    : '';
}

/* ---- localStorage helpers (pattern from hud.html) --------------------- */
function load(key, def) {
  try { const v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); }
  catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

/* ---- Clean-HTML serializer (lifted from copy-to-html-writer.html) ------ */
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function escText(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function serializeNode(node) {
  if (node.nodeType === Node.TEXT_NODE) return escText(node.textContent);
  if (node.nodeType !== Node.ELEMENT_NODE) return '';

  const tag = node.tagName.toLowerCase();
  const kids = Array.from(node.childNodes).map(serializeNode).join('');

  // Void elements
  if (tag === 'br') return '<br>';
  if (tag === 'hr') return '<hr>\n';

  // Normalize non-semantic tags
  const tagMap = { b: 'strong', i: 'em', strike: 's' };
  const out = tagMap[tag] || tag;

  // Chrome wraps newlines in <div> — convert to <p>
  if (tag === 'div') {
    if (!kids.trim() && !kids.includes('<br>')) return '';
    return `<p>${kids || '<br>'}</p>\n`;
  }

  // Drop <span>/<font> wrappers (usually browser styling artifacts)
  if (tag === 'span' || tag === 'font') return kids;

  // Build attributes
  let attrs = '';
  if (tag === 'a') {
    const href = node.getAttribute('href');
    if (href) attrs += ` href="${escAttr(href)}"`;
  }
  const ta = node.style && node.style.textAlign;
  if (ta && ta !== 'left' && ta !== 'start' && ta !== '') {
    attrs += ` style="text-align:${ta}"`;
  }

  const blockTags = new Set(['p','h1','h2','h3','ul','ol','li','blockquote']);
  const inlineTags = new Set(['strong','em','u','s','sub','sup','a']);

  if (blockTags.has(out)) {
    const body = kids.trim() ? kids : '<br>';
    return `<${out}${attrs}>${body}</${out}>\n`;
  }
  if (inlineTags.has(out)) {
    if (!kids) return '';
    return `<${out}${attrs}>${kids}</${out}>`;
  }

  // Unknown — pass through children
  return kids;
}

// Serialize a single editor element's DOM to clean HTML
function getHTML(editorEl) {
  return Array.from(editorEl.childNodes)
    .map(serializeNode)
    .join('')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

/* ---- State ------------------------------------------------------------ */
let doc = sanitize(load(STORAGE_KEY, []));
let activeEditor = null;   // last-focused block editor
let dragState = null;      // { kind:'palette'|'reorder', type?, id? }
let indicator = null;      // drop-position indicator element

function sanitize(arr) {
  if (!Array.isArray(arr)) return [];
  return arr
    .filter(b => b && BLOCK_TYPES[b.type])
    .map(b => ({
      id: b.id || newId(),
      type: b.type,
      html: typeof b.html === 'string' ? b.html : ''
    }));
}

function newId() { return 'blk_' + Math.random().toString(36).slice(2, 9); }

/* ---- DOM refs --------------------------------------------------------- */
const palette = document.getElementById('palette');
const stack = document.getElementById('stack');
const stackHint = document.getElementById('stackHint');
const outputEl = document.getElementById('output');
const preview = document.getElementById('preview');
const toolbar = document.getElementById('toolbar');
const formatSelect = document.getElementById('formatSelect');

/* ---- Palette ---------------------------------------------------------- */
function renderPalette() {
  palette.innerHTML = '';
  Object.entries(BLOCK_TYPES).forEach(([type, cfg]) => {
    const btn = document.createElement('button');
    btn.className = 'palette-item';
    btn.draggable = true;
    btn.dataset.type = type;
    btn.textContent = cfg.label;
    palette.appendChild(btn);
  });
}

palette.addEventListener('click', e => {
  const item = e.target.closest('.palette-item');
  if (item) addBlock(item.dataset.type);
});

palette.addEventListener('dragstart', e => {
  const item = e.target.closest('.palette-item');
  if (!item) return;
  dragState = { kind: 'palette', type: item.dataset.type };
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', item.dataset.type);
});

palette.addEventListener('dragend', () => { clearIndicator(); dragState = null; });

/* ---- Block stack ------------------------------------------------------ */
function renderStack() {
  stack.querySelectorAll('.block-card').forEach(c => c.remove());
  stackHint.style.display = doc.length ? 'none' : 'block';

  doc.forEach(block => {
    const cfg = BLOCK_TYPES[block.type];
    const card = document.createElement('div');
    card.className = 'block-card';
    card.dataset.id = block.id;

    const head = document.createElement('div');
    head.className = 'block-head';
    head.innerHTML =
      '<span class="drag-handle" title="Drag to reorder">⠿</span>' +
      '<span class="block-label"></span>' +
      '<button class="block-remove" title="Remove block">×</button>';
    head.querySelector('.block-label').textContent = cfg.label;

    const editor = document.createElement('div');
    editor.className = 'editor block-editor';
    editor.contentEditable = 'true';
    editor.dataset.id = block.id;
    editor.setAttribute('data-placeholder', cfg.label + '…');
    editor.innerHTML = block.html || '';

    card.appendChild(head);
    card.appendChild(editor);
    stack.appendChild(card);
    wireBlock(card, editor, block);
  });
}

function wireBlock(card, editor, block) {
  editor.addEventListener('input', () => updateBlockHtml(editor));
  editor.addEventListener('keydown', e => handleEditorKeydown(e, editor));
  editor.addEventListener('mousedown', () => { card.draggable = false; });
  editor.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  const handle = card.querySelector('.drag-handle');
  // Only make the card draggable while the handle is held — keeps the
  // contenteditable body fully selectable the rest of the time.
  handle.addEventListener('mousedown', () => { card.draggable = true; });
  handle.addEventListener('mouseup', () => { card.draggable = false; });

  card.addEventListener('dragstart', e => {
    if (!card.draggable) return;
    dragState = { kind: 'reorder', id: block.id };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', block.id);
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', () => {
    card.draggable = false;
    card.classList.remove('dragging');
    clearIndicator();
    dragState = null;
  });

  card.querySelector('.block-remove').addEventListener('click', () => removeBlock(block.id));
}

function addBlock(type, atIndex) {
  if (!BLOCK_TYPES[type]) return;
  const block = { id: newId(), type, html: seedHtml(type) };
  if (atIndex == null || atIndex > doc.length) doc.push(block);
  else doc.splice(atIndex, 0, block);
  renderStack();
  buildOutput();
  const ed = stack.querySelector('.block-editor[data-id="' + block.id + '"]');
  if (ed) ed.focus();
}

function removeBlock(id) {
  const i = doc.findIndex(b => b.id === id);
  if (i < 0) return;
  doc.splice(i, 1);
  if (activeEditor && activeEditor.dataset.id === id) activeEditor = null;
  renderStack();
  buildOutput();
}

function moveBlock(id, toIndex) {
  const from = doc.findIndex(b => b.id === id);
  if (from < 0) return;
  const [item] = doc.splice(from, 1);
  let t = from < toIndex ? toIndex - 1 : toIndex;
  if (t < 0) t = 0;
  if (t > doc.length) t = doc.length;
  doc.splice(t, 0, item);
  renderStack();
  buildOutput();
}

function updateBlockHtml(editor) {
  const b = doc.find(x => x.id === editor.dataset.id);
  if (b) { b.html = getHTML(editor); buildOutput(); }
}

/* ---- Drag-and-drop position handling ---------------------------------- */
function getDropIndex(clientY) {
  const cards = Array.from(stack.querySelectorAll('.block-card'));
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    if (clientY < r.top + r.height / 2) return i;
  }
  return cards.length;
}

function showIndicator(index) {
  if (!indicator) { indicator = document.createElement('div'); indicator.className = 'drop-indicator'; }
  const cards = Array.from(stack.querySelectorAll('.block-card'));
  if (index >= cards.length) stack.appendChild(indicator);
  else stack.insertBefore(indicator, cards[index]);
}

function clearIndicator() {
  if (indicator && indicator.parentNode) indicator.parentNode.removeChild(indicator);
}

stack.addEventListener('dragover', e => {
  if (!dragState) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = dragState.kind === 'palette' ? 'copy' : 'move';
  showIndicator(getDropIndex(e.clientY));
});

stack.addEventListener('dragleave', e => {
  if (!stack.contains(e.relatedTarget)) clearIndicator();
});

stack.addEventListener('drop', e => {
  if (!dragState) return;
  e.preventDefault();
  const idx = getDropIndex(e.clientY);
  const state = dragState;
  clearIndicator();
  dragState = null;
  if (state.kind === 'palette') addBlock(state.type, idx);
  else moveBlock(state.id, idx);
});

/* ---- Shared toolbar (acts on the focused block) ----------------------- */
stack.addEventListener('focusin', e => {
  const ed = e.target.closest('.block-editor');
  if (ed) { activeEditor = ed; syncToolbarState(); }
});

toolbar.addEventListener('mousedown', e => {
  const btn = e.target.closest('button[data-cmd]');
  if (!btn) return;
  e.preventDefault(); // keep caret in the focused editor
  if (!activeEditor) return;
  activeEditor.focus();
  document.execCommand(btn.dataset.cmd, false, null);
  updateBlockHtml(activeEditor);
  syncToolbarState();
});

formatSelect.addEventListener('change', () => {
  if (!activeEditor) return;
  activeEditor.focus();
  document.execCommand('formatBlock', false, formatSelect.value);
  updateBlockHtml(activeEditor);
});

document.getElementById('linkBtn').addEventListener('mousedown', e => {
  e.preventDefault();
  if (!activeEditor) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) { alert('Select some text first, then click Link.'); return; }
  const url = window.prompt('Enter URL:', 'https://');
  if (url) {
    activeEditor.focus();
    document.execCommand('createLink', false, url);
    updateBlockHtml(activeEditor);
  }
});

document.getElementById('blockquoteBtn').addEventListener('mousedown', e => {
  e.preventDefault();
  if (!activeEditor) return;
  activeEditor.focus();
  document.execCommand('formatBlock', false, 'blockquote');
  updateBlockHtml(activeEditor);
});

// After a heading, Enter starts a plain paragraph (not another heading)
function handleEditorKeydown(e, editor) {
  if (e.key === 'Enter' && !e.shiftKey) {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const node = sel.getRangeAt(0).startContainer;
    const ctx = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
    const headingEl = ctx.closest('h1,h2,h3');
    if (!headingEl || !editor.contains(headingEl)) return;
    e.preventDefault();
    const range = sel.getRangeAt(0);
    const atEnd = range.endOffset === (range.endContainer.length ?? 0) &&
                  !range.endContainer.nextSibling?.nodeValue;
    if (atEnd) {
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      headingEl.insertAdjacentElement('afterend', p);
      const newRange = document.createRange();
      newRange.setStart(p, 0);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
    } else {
      document.execCommand('insertParagraph', false, null);
      document.execCommand('formatBlock', false, 'p');
    }
    updateBlockHtml(editor);
  } else if (e.key === 'Enter' && e.shiftKey) {
    e.preventDefault();
    document.execCommand('insertHTML', false, '<br>');
    updateBlockHtml(editor);
  }
}

const stateCmds = ['bold','italic','underline','strikeThrough','subscript','superscript',
  'insertOrderedList','insertUnorderedList','justifyLeft','justifyCenter','justifyRight','justifyFull'];

function syncToolbarState() {
  document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    const cmd = btn.dataset.cmd;
    if (stateCmds.includes(cmd)) {
      try { btn.classList.toggle('active', document.queryCommandState(cmd)); }
      catch (e) { /* ignore */ }
    }
  });
  try {
    const block = (document.queryCommandValue('formatBlock') || '').toLowerCase();
    const match = ['p','h1','h2','h3'].find(t => t === block);
    formatSelect.value = match || 'p';
  } catch (e) {}
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !activeEditor) return;
  if (!activeEditor.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
  syncToolbarState();
});

/* ---- Output + persistence --------------------------------------------- */
function buildOutput() {
  const html = doc
    .map(b => b.html)
    .filter(h => h && h.trim())
    .join('\n')
    .replace(/\n{2,}/g, '\n')
    .trim();
  outputEl.value = html;
  preview.innerHTML = html;
  save(STORAGE_KEY, doc);
}

/* ---- Controls --------------------------------------------------------- */
function flash(btn, text) {
  const original = btn.textContent;
  btn.textContent = text;
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
}

document.getElementById('copyBtn').addEventListener('click', () => {
  if (!outputEl.value) return;
  navigator.clipboard.writeText(outputEl.value)
    .then(() => flash(document.getElementById('copyBtn'), '✓ Copied!'));
});

document.getElementById('exportBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(doc, null, 2))
    .then(() => flash(document.getElementById('exportBtn'), '✓ Copied JSON!'));
});

document.getElementById('importBtn').addEventListener('click', () => {
  const raw = window.prompt('Paste a previously exported Copy Block Builder JSON:');
  if (!raw) return;
  try {
    const parsed = sanitize(JSON.parse(raw));
    if (!parsed.length) { alert('No valid blocks found in that JSON.'); return; }
    doc = parsed;
    activeEditor = null;
    renderStack();
    buildOutput();
  } catch (err) {
    alert('Could not import — that does not look like valid JSON.');
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!doc.length) return;
  if (!confirm('Remove all blocks? This cannot be undone.')) return;
  doc = [];
  activeEditor = null;
  renderStack();
  buildOutput();
});

/* ---- Init ------------------------------------------------------------- */
renderPalette();
renderStack();
buildOutput();
</script>
</body>
</html>
