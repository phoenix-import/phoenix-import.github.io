<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>// PERSONAL HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fira+Code:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#131110;
  --bg-panel:#1a1714;
  --bg-hover:#221e1a;
  --bg-input:#0e0c0b;
  --text:#e3dbd2;
  --text-muted:#a08878;
  --text-dim:#6e5e50;
  --accent:#e07830;
  --accent-dim:#7a3f14;
  --accent-glow:rgba(224,120,48,0.15);
  --green:#7ab87a;
  --amber:#d4a840;
  --red:#c05040;
  --border:#261f1a;
  --border-bright:#3a2e26;
  --radius:4px;
  --font-head:'Syne',sans-serif;
  --font-mono:'Fira Code',monospace;
  --font-serif:'DM Serif Display',serif;
}
html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:13px;line-height:1.5}
canvas#particles{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}

/* ── HEADER ── */
#hud-header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:16px;
  padding:10px 16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-top:2px solid var(--accent);
}
.header-left{display:flex;align-items:center;gap:16px;flex-shrink:0}
.hud-title{font-family:var(--font-head);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.08em}
.hud-date{color:var(--text-muted);font-size:11px;white-space:nowrap}
.header-center{text-align:center;overflow:hidden}
.flavour-line{font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--text);opacity:.75}
.header-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.streak-display{font-size:11px;color:var(--text-muted)}
.streak-display span{color:var(--accent);font-weight:500}

/* ── ZEF WIDGET ── */
.zef-widget{position:relative;cursor:default}
.zef-cat{font-size:14px;color:var(--text-muted);letter-spacing:-.02em;transition:color .3s}
.zef-cat:hover{color:var(--accent)}
.zef-tooltip{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--bg-panel);border:1px solid var(--border-bright);
  padding:6px 10px;white-space:nowrap;font-size:11px;color:var(--text-muted);
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:100;
}
.zef-widget:hover .zef-tooltip{opacity:1}

/* ── MAIN GRID ── */
#hud-main{
  display:grid;
  grid-template-columns:280px 1fr 300px;
  gap:12px;
  flex:1;
  align-items:start;
}
.col-left,.col-center,.col-right{display:flex;flex-direction:column;gap:12px}

/* ── PANELS ── */
.panel{
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.panel-title{
  font-family:var(--font-head);font-weight:700;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

/* ── CHECK-IN ── */
.checkin-field{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.checkin-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)}
.checkin-label .val{color:var(--accent);font-weight:500}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;
  background:var(--border-bright);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--accent);cursor:pointer;transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3)}
.checkin-submit{
  margin-top:6px;padding:7px 14px;background:transparent;
  border:1px solid var(--accent);color:var(--accent);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;transition:all .2s;
}
.checkin-submit:hover{background:var(--accent);color:var(--bg)}
.checkin-done{
  text-align:center;padding:12px 0;
  font-size:11px;color:var(--text-muted);line-height:1.8;
}
.checkin-done .done-label{color:var(--green);display:block;font-weight:500;margin-bottom:4px}
.checkin-done .redo-btn{
  display:inline-block;margin-top:8px;font-size:10px;color:var(--text-dim);
  cursor:pointer;border-bottom:1px solid var(--border-bright);
}
.checkin-done .redo-btn:hover{color:var(--text-muted)}

/* ── CHARACTER SHEET ── */
.stat-row{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.stat-header{display:flex;justify-content:space-between;align-items:center}
.stat-name{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.stat-value{font-size:11px;color:var(--accent)}
.stat-level-label{font-size:9px;color:var(--text-dim)}
.stat-bar-track{height:3px;background:var(--border-bright);position:relative;overflow:hidden}
.stat-bar-fill{height:100%;background:var(--accent);transition:width .6s ease;position:relative}
.stat-bar-fill.low{background:var(--red)}
.stat-bar-fill.mid{background:var(--amber)}
.stat-bar-fill.high{background:var(--green)}
.stat-comment{font-size:10px;color:var(--text-dim);font-style:italic}

/* ── QUESTS ── */
.quest-card{
  border:1px solid var(--accent-dim);padding:12px;
  background:var(--bg-input);position:relative;
}
.quest-category{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dim);margin-bottom:6px}
.quest-text{font-size:12px;color:var(--text);line-height:1.5;margin-bottom:10px}
.quest-xp{font-size:10px;color:var(--text-muted);margin-bottom:10px}
.quest-actions{display:flex;gap:8px}
.quest-btn{
  flex:1;padding:6px 8px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;border:1px solid;
}
.quest-btn.complete{background:transparent;border-color:var(--green);color:var(--green)}
.quest-btn.complete:hover{background:var(--green);color:var(--bg)}
.quest-btn.refuse{background:transparent;border-color:var(--border-bright);color:var(--text-dim)}
.quest-btn.refuse:hover{border-color:var(--text-muted);color:var(--text-muted)}
.quest-refusal-msg{font-size:11px;color:var(--text-dim);font-style:italic;text-align:center;padding:8px 0}
.quest-roll-btn{
  width:100%;padding:8px;background:transparent;border:1px dashed var(--border-bright);
  color:var(--text-muted);font-family:var(--font-mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .2s;
}
.quest-roll-btn:hover{border-color:var(--accent);color:var(--accent)}
.quest-categories{margin-top:8px}
.quest-cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.quest-cat-btn{
  padding:6px 4px;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);font-family:var(--font-mono);font-size:9px;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s;text-align:center;
}
.quest-cat-btn:hover{border-color:var(--accent-dim);color:var(--text-muted)}
.quest-cat-btn.active{border-color:var(--accent);color:var(--accent)}
.quest-pool-list{margin-top:8px;display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.quest-pool-item{
  padding:8px;background:var(--bg-input);border:1px solid var(--border);
  cursor:pointer;transition:border-color .15s;font-size:11px;color:var(--text-muted);
}
.quest-pool-item:hover{border-color:var(--accent-dim);color:var(--text)}

/* ── BODY MAP ── */
.bodymap-container{display:flex;gap:16px;align-items:flex-start}
.bodymap-svg-wrap{flex-shrink:0}
.bodymap-zones{flex:1;display:flex;flex-direction:column;gap:4px}
.zone-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);
  cursor:pointer;transition:border-color .15s;
}
.zone-item:hover{border-color:var(--border-bright)}
.zone-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.zone-dots{display:flex;gap:3px}
.zone-dot{
  width:8px;height:8px;border-radius:50%;border:1px solid var(--border-bright);
  transition:background .2s;cursor:pointer;
}
.zone-dot.active-0{background:var(--green)}
.zone-dot.active-1{background:var(--amber)}
.zone-dot.active-2{background:var(--red)}
.zone-dot.active-3{background:#a02020}

/* ── WEATHER ── */
.weather-main{text-align:center;padding:8px 0}
.weather-temp{font-family:var(--font-head);font-size:36px;font-weight:700;color:var(--accent)}
.weather-apparent{font-size:10px;color:var(--text-muted);margin-top:2px}
.weather-condition{font-size:12px;color:var(--text-muted);margin:8px 0}
.weather-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.weather-detail{text-align:center;padding:6px;background:var(--bg-input);border:1px solid var(--border)}
.weather-detail .label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.weather-detail .value{font-size:13px;color:var(--text-muted);margin-top:2px}
.weather-interp{
  font-size:11px;color:var(--text-dim);font-style:italic;
  padding:8px;background:var(--bg-input);border-left:2px solid var(--accent-dim);margin-top:4px;
}

/* ── NEWS ── */
.news-list{display:flex;flex-direction:column;gap:1px}
.news-item{
  padding:9px 10px;background:var(--bg-input);border-left:2px solid transparent;
  transition:border-color .15s;cursor:pointer;text-decoration:none;display:block;
}
.news-item:hover{border-left-color:var(--accent-dim)}
.news-source{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.news-headline{font-size:11px;color:var(--text-muted);line-height:1.4}
.news-item:hover .news-headline{color:var(--text)}
.news-meta{font-size:9px;color:var(--text-dim);margin-top:3px}
.news-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.news-source-btn{
  padding:3px 8px;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);font-family:var(--font-mono);font-size:9px;
  letter-spacing:.05em;cursor:pointer;transition:all .15s;
}
.news-source-btn.active{border-color:var(--accent-dim);color:var(--accent)}
.news-source-btn:hover{border-color:var(--border-bright);color:var(--text-muted)}
.news-error{font-size:11px;color:var(--text-dim);font-style:italic;padding:8px 0}

/* ── COMPLETED QUEST TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--bg-panel);border:1px solid var(--accent);
  padding:12px 18px;font-size:12px;color:var(--text);
  max-width:300px;opacity:0;transform:translateY(10px);
  transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-bright)}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  #hud-main{grid-template-columns:1fr 1fr}
  .col-right{grid-column:1/-1;flex-direction:row}
  #panel-weather,#panel-news{flex:1}
}
@media(max-width:600px){
  #hud-main{grid-template-columns:1fr}
  .col-right{flex-direction:column}
  #hud-header{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  .header-center{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="toast" id="toast"></div>

<div id="app">
  <header id="hud-header">
    <div class="header-left">
      <span class="hud-title">// PERSONAL HUD</span>
      <span class="hud-date" id="hud-date"></span>
    </div>
    <div class="header-center">
      <span class="flavour-line" id="flavour-line"></span>
    </div>
    <div class="header-right">
      <span class="streak-display" id="streak-display"></span>
      <div class="zef-widget" id="zef-widget">
        <span class="zef-cat" id="zef-cat"></span>
        <div class="zef-tooltip" id="zef-tooltip"></div>
      </div>
    </div>
  </header>

  <main id="hud-main">
    <div class="col-left">
      <section class="panel" id="panel-checkin">
        <h2 class="panel-title">Morning Check-In</h2>
        <div id="checkin-content"></div>
      </section>
      <section class="panel" id="panel-stats">
        <h2 class="panel-title">Character Sheet</h2>
        <div id="stats-content"></div>
      </section>
    </div>

    <div class="col-center">
      <section class="panel" id="panel-quests">
        <h2 class="panel-title">Quest Log</h2>
        <div id="quests-content"></div>
      </section>
      <section class="panel" id="panel-bodymap">
        <h2 class="panel-title">Body Map</h2>
        <div id="bodymap-content"></div>
      </section>
    </div>

    <div class="col-right">
      <section class="panel" id="panel-weather">
        <h2 class="panel-title">Conditions</h2>
        <div id="weather-content"><span style="color:var(--text-dim);font-size:11px">Fetching weather...</span></div>
      </section>
      <section class="panel" id="panel-news">
        <h2 class="panel-title">Intel</h2>
        <div id="news-content"><span style="color:var(--text-dim);font-size:11px">Fetching news...</span></div>
      </section>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// DATA BANKS — pre-generated, static assets
// ═══════════════════════════════════════════════════════
const DATA = {

const STORAGE_KEY = {
  checkins: 'hud_checkins',
  stats: 'hud_stats',
  quests: 'hud_quests_log',
  activeQuest: 'hud_active_quest',
  streak: 'hud_streak',
  bodyMap: 'hud_bodymap'
};

const DEFAULT_STATS = {
  endurance:   { value: 40, lastActivity: null, label: "Endurance" },
  strength:    { value: 35, lastActivity: null, label: "Strength" },
  wisdom:      { value: 55, lastActivity: null, label: "Wisdom" },
  constitution:{ value: 45, lastActivity: null, label: "Constitution" },
  intelligence:{ value: 60, lastActivity: null, label: "Intelligence" },
  charisma:    { value: 50, lastActivity: null, label: "Charisma" },
  exploration: { value: 55, lastActivity: null, label: "Exploration" },
  cognition:   { value: 65, lastActivity: null, label: "Cognition" }
};

const DEFAULT_BODY_MAP = { jaw: 0, shoulders: 0, upper_back: 0, lower_back: 0, gut: 0, knees: 0 };

const LEVEL_LABELS = ["Dormant","Active","Practiced","Skilled","Master"];

function getLevel(v) {
  if (v <= 20) return 0;
  if (v <= 40) return 1;
  if (v <= 60) return 2;
  if (v <= 80) return 3;
  return 4;
}

function getBarClass(v) {
  if (v <= 30) return 'low';
  if (v <= 60) return 'mid';
  return 'high';
}

function load(key, def) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch { return def; }
}

function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function applyStatDecay(stats) {
  const now = Date.now();
  const dayMs = 86400000;
  for (const key of Object.keys(stats)) {
    if (stats[key].lastActivity) {
      const daysSince = Math.floor((now - stats[key].lastActivity) / dayMs);
      if (daysSince > 0) {
        stats[key].value = Math.max(5, stats[key].value - (daysSince * 2));
      }
    }
  }
  return stats;
}

function addStatXP(statKey, amount) {
  const stats = load(STORAGE_KEY.stats, DEFAULT_STATS);
  if (!stats[statKey]) return;
  stats[statKey].value = Math.min(100, stats[statKey].value + Math.ceil(amount / 10));
  stats[statKey].lastActivity = Date.now();
  save(STORAGE_KEY.stats, stats);
}

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getCheckinToday() {
  const checkins = load(STORAGE_KEY.checkins, {});
  return checkins[todayKey()] || null;
}

function saveCheckin(data) {
  const checkins = load(STORAGE_KEY.checkins, {});
  data.timestamp = Date.now();
  checkins[todayKey()] = data;
  save(STORAGE_KEY.checkins, checkins);
  updateStreak();
}

function updateStreak() {
  const streak = load(STORAGE_KEY.streak, { count: 0, lastDate: null });
  const today = todayKey();
  const yesterday = (() => {
    const d = new Date(); d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();
  if (streak.lastDate === today) return;
  if (streak.lastDate === yesterday) { streak.count++; }
  else { streak.count = 1; }
  streak.lastDate = today;
  save(STORAGE_KEY.streak, streak);
}

// PARTICLES
// ═══════════════════════════════════════════════════════
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      a: Math.random() * 0.4 + 0.1
    };
  }

  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 80; i++) particles.push(makeParticle());

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(224,120,48,${p.a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}

const CHECKIN_FIELDS = [
  { key: 'sleep',      label: 'Sleep quality',  max: 5 },
  { key: 'energy',     label: 'Energy',          max: 5 },
  { key: 'agitation',  label: 'Agitation',       max: 5 },

function renderCheckin() {
  const container = document.getElementById('checkin-content');
  const existing = getCheckinToday();

  if (existing) {
    renderCheckinDone(container, existing);
  } else {
    renderCheckinForm(container);
  }
}

function renderCheckinForm(container) {
  const vals = {};
  CHECKIN_FIELDS.forEach(f => vals[f.key] = 3);

  let html = '';
  CHECKIN_FIELDS.forEach(f => {
    html += `
    <div class="checkin-field">
      <div class="checkin-label">
        <span>${f.label}</span>
        <span class="val" id="val-${f.key}">3</span>
      </div>
      <input type="range" min="0" max="${f.max}" value="3" step="1"
        id="slider-${f.key}"
        oninput="document.getElementById('val-${f.key}').textContent=this.value">
    </div>`;
  });
  html += `<button class="checkin-submit" onclick="submitCheckin()">▶ Submit Check-In</button>`;
  container.innerHTML = html;
}

function renderCheckinDone(container, data) {
  const fields = CHECKIN_FIELDS.map(f =>
    `${f.label}: <strong style="color:var(--accent)">${data[f.key] ?? '—'}</strong>`
  ).join(' · ');

  container.innerHTML = `
    <div class="checkin-done">
      <span class="done-label">✓ Check-in complete</span>
      <div style="font-size:10px;color:var(--text-dim);line-height:1.8">${fields}</div>
      <span class="redo-btn" onclick="redoCheckin()">redo today's check-in</span>
    </div>`;
}

function submitCheckin() {
  const data = {};
  CHECKIN_FIELDS.forEach(f => {
    const el = document.getElementById(`slider-${f.key}`);
    data[f.key] = el ? parseInt(el.value) : 0;
  });
  saveCheckin(data);
  renderCheckin();
  initHeader(); // update streak
  renderQuests(); // energy affects quest filtering
  showToast("Check-in saved. The system knows your condition.");
}

function redoCheckin() {
  const container = document.getElementById('checkin-content');
  renderCheckinForm(container);
}

function renderStats() {
  let stats = load(STORAGE_KEY.stats, DEFAULT_STATS);

  const container = document.getElementById('stats-content');

      : '';

    html += `
    <div class="stat-row">
      <div class="stat-header">
        <span class="stat-name">${s.label}</span>

  container.innerHTML = html;

let questState = {
  browsing: false,
  activeCategory: null
};

function getMaxDifficulty() {
  const checkin = getCheckinToday();
  if (!checkin) return 2;
  const energy = checkin.energy ?? 3;
  if (energy <= 1) return 1;
  if (energy <= 3) return 2;
  return 3;
}

function getAllQuests(maxDiff) {
  const all = [];
  for (const [cat, quests] of Object.entries(DATA.questPools)) {
    for (const q of quests) {
      if (q.difficulty <= maxDiff) {
        all.push({ ...q, category: cat });
      }
    }
  }
  return all;
}

function renderQuests() {
  const container = document.getElementById('quests-content');
  const active = load(STORAGE_KEY.activeQuest, null);
  const maxDiff = getMaxDifficulty();

  let html = '';

  if (active && !questState.browsing) {
    html += `
    <div class="quest-card">
      <div class="quest-category">${active.category.toUpperCase()}</div>
      <div class="quest-text">${active.text}</div>
      <div class="quest-xp">+${active.xp.amount} XP → ${active.xp.stat}</div>
      <div class="quest-actions">
        <button class="quest-btn complete" onclick="completeQuest()">✓ Complete</button>
        <button class="quest-btn refuse" onclick="refuseQuest()">✕ Refuse</button>
      </div>
    </div>`;
  } else {
    if (!questState.browsing) {
      html += `<button class="quest-roll-btn" onclick="rollRandomQuest()">⟳ Roll Random Quest</button>`;
    }
  }

  html += `
  <div class="quest-categories">
    <button class="quest-roll-btn" onclick="toggleBrowse()" style="margin-bottom:${questState.browsing?'8px':'0'}">${questState.browsing ? '← Back to Active Quest' : 'Browse by Category'}</button>
    ${questState.browsing ? renderCategoryBrowse(maxDiff) : ''}
  </div>`;

  container.innerHTML = html;
}

function renderCategoryBrowse(maxDiff) {
  const cats = Object.keys(DATA.questPools);
  let html = `<div class="quest-cat-grid">`;
  for (const cat of cats) {
    const active = questState.activeCategory === cat;
    html += `<button class="quest-cat-btn ${active?'active':''}" onclick="selectCategory('${cat}')">${cat}</button>`;
  }
  html += `</div>`;

  if (questState.activeCategory) {
    const pool = DATA.questPools[questState.activeCategory].filter(q => q.difficulty <= maxDiff);
    html += `<div class="quest-pool-list">`;
    if (pool.length === 0) {
      html += `<div style="font-size:11px;color:var(--text-dim);padding:8px">No quests available at current energy level.</div>`;
    } else {
      for (let i = 0; i < pool.length; i++) {
        html += `<div class="quest-pool-item" onclick="selectQuest('${questState.activeCategory}',${i})">
          ${pool[i].text}
          <span style="color:var(--text-dim);font-size:9px;display:block;margin-top:2px">+${pool[i].xp.amount}xp → ${pool[i].xp.stat}</span>
        </div>`;
      }
    }
    html += `</div>`;
  }

  return html;
}

function rollRandomQuest() {
  const maxDiff = getMaxDifficulty();
  const all = getAllQuests(maxDiff);
  if (all.length === 0) return;
  const q = rand(all);
  save(STORAGE_KEY.activeQuest, q);
  questState.browsing = false;
  renderQuests();
}

function toggleBrowse() {
  questState.browsing = !questState.browsing;
  if (!questState.browsing) questState.activeCategory = null;
  renderQuests();
}

function selectCategory(cat) {
  questState.activeCategory = questState.activeCategory === cat ? null : cat;
  renderQuests();
}

function selectQuest(cat, idx) {
  const maxDiff = getMaxDifficulty();
  const pool = DATA.questPools[cat].filter(q => q.difficulty <= maxDiff);
  const q = { ...pool[idx], category: cat };
  save(STORAGE_KEY.activeQuest, q);
  questState.browsing = false;
  questState.activeCategory = null;
  renderQuests();
}

function completeQuest() {
  const q = load(STORAGE_KEY.activeQuest, null);
  if (!q) return;

  addStatXP(q.xp.stat, q.xp.amount);

  const log = load(STORAGE_KEY.quests, []);
  log.push({ ...q, completedAt: Date.now(), date: todayKey() });
  save(STORAGE_KEY.quests, log);
  save(STORAGE_KEY.activeQuest, null);

  renderStats();
  renderQuests();
  showToast(`Quest complete. +${q.xp.amount} XP → ${q.xp.stat}`);
}

function refuseQuest() {
  save(STORAGE_KEY.activeQuest, null);
  const msg = rand(DATA.refusalAcks);
  const container = document.getElementById('quests-content');

  let html = `<div class="quest-refusal-msg">${msg}</div>`;
  html += `<button class="quest-roll-btn" style="margin-top:8px" onclick="rollRandomQuest()">⟳ Roll Another</button>`;
  html += `<div class="quest-categories" style="margin-top:8px">
    <button class="quest-roll-btn" onclick="questState.browsing=true;renderQuests()">Browse by Category</button>
  </div>`;

  container.innerHTML = html;
}

const BODY_ZONES = [
  { key: 'jaw',       label: 'Jaw / Head' },
  { key: 'shoulders', label: 'Neck / Shoulders' },
  { key: 'upper_back',label: 'Upper Back' },
  { key: 'lower_back',label: 'Lower Back' },
  { key: 'gut',       label: 'Gut / Abdomen' },
  { key: 'knees',     label: 'Knees / Legs' }
];

const ZONE_COLORS = ['var(--green)', 'var(--amber)', 'var(--accent)', 'var(--red)'];
const ZONE_LABELS = ['Fine', 'Mild', 'Moderate', 'Significant'];

function renderBodyMap() {
  const bm = load(STORAGE_KEY.bodyMap, DEFAULT_BODY_MAP);
  const container = document.getElementById('bodymap-content');

  const svg = buildBodySVG(bm);

  let zonesHtml = '';
  for (const zone of BODY_ZONES) {
    const val = bm[zone.key] ?? 0;
    let dotsHtml = '';
    for (let i = 0; i < 4; i++) {
      const isActive = i <= val && val > 0;
      const color = isActive ? ZONE_COLORS[val] : 'var(--border-bright)';
      dotsHtml += `<div class="zone-dot" style="background:${color}" title="${ZONE_LABELS[i]}" onclick="cycleZone('${zone.key}')"></div>`;
    }
    if (val === 0) dotsHtml = `<div class="zone-dot" style="background:var(--green)" onclick="cycleZone('${zone.key}')"></div>
      <div class="zone-dot" onclick="cycleZone('${zone.key}')"></div>
      <div class="zone-dot" onclick="cycleZone('${zone.key}')"></div>
      <div class="zone-dot" onclick="cycleZone('${zone.key}')"></div>`;

    zonesHtml += `
    <div class="zone-item" onclick="cycleZone('${zone.key}')">
      <span class="zone-label">${zone.label}</span>
      <div class="zone-dots">${dotsHtml}</div>
    </div>`;
  }

  container.innerHTML = `
    <div class="bodymap-container">
      <div class="bodymap-svg-wrap">${svg}</div>
      <div class="bodymap-zones">${zonesHtml}</div>
    </div>`;
}

function buildBodySVG(bm) {
  const zoneColor = (key, opacity=0.7) => {
    const v = bm[key] ?? 0;
    if (v === 0) return `rgba(122,184,122,${opacity})`;
    if (v === 1) return `rgba(212,168,64,${opacity})`;
    if (v === 2) return `rgba(224,120,48,${opacity})`;
    return `rgba(192,80,64,${opacity})`;
  };

  return `<svg viewBox="0 0 60 170" width="60" height="170" xmlns="http://www.w3.org/2000/svg">
    <style>.bz{cursor:pointer;transition:opacity .2s;stroke:rgba(255,255,255,0.08);stroke-width:0.5}</style>
    <!-- Head/Jaw -->
    <ellipse cx="30" cy="14" rx="10" ry="12" class="bz" fill="${zoneColor('jaw')}" onclick="cycleZone('jaw')"/>
    <!-- Neck -->
    <rect x="26" y="25" width="8" height="8" class="bz" fill="${zoneColor('shoulders')}" onclick="cycleZone('shoulders')"/>
    <!-- Shoulders/Chest -->
    <rect x="14" y="33" width="32" height="28" rx="3" class="bz" fill="${zoneColor('shoulders')}" onclick="cycleZone('shoulders')"/>
    <!-- Upper back indicator -->
    <rect x="17" y="36" width="26" height="20" rx="2" class="bz" fill="${zoneColor('upper_back', 0.5)}" onclick="cycleZone('upper_back')"/>
    <!-- Abdomen/Gut -->
    <rect x="17" y="61" width="26" height="24" rx="2" class="bz" fill="${zoneColor('gut')}" onclick="cycleZone('gut')"/>
    <!-- Lower Back/Hips -->
    <rect x="17" y="85" width="26" height="18" rx="2" class="bz" fill="${zoneColor('lower_back')}" onclick="cycleZone('lower_back')"/>
    <!-- Left leg -->
    <rect x="17" y="103" width="11" height="55" rx="3" class="bz" fill="${zoneColor('knees')}" onclick="cycleZone('knees')"/>
    <!-- Right leg -->
    <rect x="32" y="103" width="11" height="55" rx="3" class="bz" fill="${zoneColor('knees')}" onclick="cycleZone('knees')"/>
  </svg>`;
}

function cycleZone(key) {
  const bm = load(STORAGE_KEY.bodyMap, DEFAULT_BODY_MAP);
  bm[key] = ((bm[key] ?? 0) + 1) % 4;
  save(STORAGE_KEY.bodyMap, bm);
  renderBodyMap();
}

// ═══════════════════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════════════════
const WMO_CODES = {
  0: { label: 'Clear sky', cat: 'clear' },
  1: { label: 'Mainly clear', cat: 'clear' },
  2: { label: 'Partly cloudy', cat: 'cloudy' },
  3: { label: 'Overcast', cat: 'cloudy' },
  45: { label: 'Fog', cat: 'fog' },
  48: { label: 'Depositing rime fog', cat: 'fog' },
  51: { label: 'Light drizzle', cat: 'drizzle' },
  53: { label: 'Moderate drizzle', cat: 'drizzle' },
  55: { label: 'Dense drizzle', cat: 'drizzle' },
  61: { label: 'Slight rain', cat: 'rain' },
  63: { label: 'Moderate rain', cat: 'rain' },
  65: { label: 'Heavy rain', cat: 'rain' },
  66: { label: 'Light freezing rain', cat: 'rain' },
  67: { label: 'Heavy freezing rain', cat: 'rain' },
  71: { label: 'Slight snow', cat: 'snow' },
  73: { label: 'Moderate snow', cat: 'snow' },
  75: { label: 'Heavy snow', cat: 'snow' },
  80: { label: 'Slight showers', cat: 'rain' },
  81: { label: 'Moderate showers', cat: 'rain' },
  82: { label: 'Violent showers', cat: 'rain' },
  95: { label: 'Thunderstorm', cat: 'thunderstorm' },
  96: { label: 'Thunderstorm w/ hail', cat: 'thunderstorm' },
  99: { label: 'Thunderstorm w/ heavy hail', cat: 'thunderstorm' }
};

async function fetchWeather() {
  const container = document.getElementById('weather-content');
  try {
    // IP geolocation — approximate, no key needed
    const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
    const lat = geo.latitude;
    const lon = geo.longitude;
    const city = geo.city || geo.region || 'Unknown';
    const tz = encodeURIComponent(geo.timezone || 'Europe/Amsterdam');

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,relative_humidity_2m&timezone=${tz}`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    const code = WMO_CODES[c.weather_code] || { label: 'Unknown', cat: 'cloudy' };
    const windKph = Math.round(c.wind_speed_10m);

    let interpCat = code.cat;
    if (windKph > 30) interpCat = 'wind_strong';
    const interps = DATA.weatherInterp[interpCat] || DATA.weatherInterp.cloudy;
    const interp = rand(interps);

    container.innerHTML = `
      <div class="weather-main">
        <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="weather-apparent">Feels like ${Math.round(c.apparent_temperature)}°C</div>
        <div class="weather-condition">${code.label}</div>
      </div>
      <div class="weather-details">
        <div class="weather-detail">
          <div class="label">Wind</div>
          <div class="value">${windKph} km/h</div>
        </div>
        <div class="weather-detail">
          <div class="label">Humidity</div>
          <div class="value">${c.relative_humidity_2m}%</div>
        </div>
        <div class="weather-detail">
          <div class="label">Precip</div>
          <div class="value">${c.precipitation} mm</div>
        </div>
        <div class="weather-detail">
          <div class="label">Location</div>
          <div class="value" style="font-size:10px">~${city}</div>
        </div>
      </div>
      <div class="weather-interp">${interp}</div>`;
  } catch (e) {
    document.getElementById('weather-content').innerHTML = `<div class="news-error">Weather unavailable. Consult the window.</div>`;
  }
}

// ═══════════════════════════════════════════════════════
// NEWS
// ═══════════════════════════════════════════════════════
const NEWS_SOURCES = [
  { id: 'nos', label: 'NOS', url: 'https://feeds.nos.nl/nosnieuwsalgemeen' },
  { id: 'bbc', label: 'BBC', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
  { id: 'dw',  label: 'DW',  url: 'https://rss.dw.com/xml/rss-en-all' },
  { id: 'aj',  label: 'AJE', url: 'https://www.aljazeera.com/xml/rss/all.xml' }
];

let activeNewsSource = 'nos';

async function fetchNews(sourceId) {
  const container = document.getElementById('news-content');
  const source = NEWS_SOURCES.find(s => s.id === sourceId) || NEWS_SOURCES[0];

  const filterBtns = NEWS_SOURCES.map(s =>
    `<button class="news-source-btn ${s.id === sourceId ? 'active' : ''}"
      onclick="switchNewsSource('${s.id}')">${s.label}</button>`
  ).join('');

  container.innerHTML = `
    <div class="news-filter">${filterBtns}</div>
    <div id="news-list"><span style="color:var(--text-dim);font-size:11px">Fetching...</span></div>`;

  try {
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}&count=8`;
    const res = await fetch(apiUrl);
    const json = await res.json();

    if (json.status !== 'ok' || !json.items?.length) throw new Error('No items');

    let html = '<div class="news-list">';
    for (const item of json.items) {
      const date = item.pubDate
        ? new Date(item.pubDate).toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
        : '';
      html += `
      <a class="news-item" href="${item.link}" target="_blank" rel="noopener">
        <div class="news-source">${source.label}</div>
        <div class="news-headline">${item.title}</div>
        ${date ? `<div class="news-meta">${date}</div>` : ''}
      </a>`;
    }
    html += '</div>';

    document.getElementById('news-list').outerHTML = html;
  } catch (e) {
    const listEl = document.getElementById('news-list');
    if (listEl) listEl.innerHTML = `<div class="news-error">Feed unavailable. Try another source or consult reality directly.</div>`;
  }
}

function switchNewsSource(id) {
  activeNewsSource = id;
  fetchNews(id);
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

  initParticles();
  initHeader();
  renderCheckin();
  renderStats();
  renderQuests();
  renderBodyMap();
  fetchWeather();
  fetchNews(activeNewsSource);
});
