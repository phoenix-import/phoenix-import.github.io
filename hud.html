<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>// PERSONAL HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fira+Code:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#131110;
  --bg-panel:#1a1714;
  --bg-hover:#221e1a;
  --bg-input:#0e0c0b;
  --text:#e3dbd2;
  --text-muted:#a08878;
  --text-dim:#6e5e50;
  --accent:#e07830;
  --accent-dim:#7a3f14;
  --accent-glow:rgba(224,120,48,0.15);
  --green:#7ab87a;
  --amber:#d4a840;
  --red:#c05040;
  --border:#261f1a;
  --border-bright:#3a2e26;
  --radius:4px;
  --font-head:'Syne',sans-serif;
  --font-mono:'Fira Code',monospace;
  --font-serif:'DM Serif Display',serif;
}
html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:13px;line-height:1.5}
canvas#particles{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}

/* ── HEADER ── */
#hud-header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:16px;
  padding:10px 16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-top:2px solid var(--accent);
}
.header-left{display:flex;align-items:center;gap:16px;flex-shrink:0}
.hud-title{font-family:var(--font-head);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.08em}
.hud-date{color:var(--text-muted);font-size:11px;white-space:nowrap}
.header-center{text-align:center;overflow:hidden}
.flavour-line{font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--text);opacity:.75}
.header-right{display:flex;align-items:center;gap:16px;flex-shrink:0}

/* ── MAIN GRID ── */
#hud-main{
  display:grid;
  grid-template-columns:280px 1fr 300px;
  gap:12px;
  flex:1;
  align-items:start;
}
.col-left,.col-center,.col-right{display:flex;flex-direction:column;gap:12px}

/* ── PANELS ── */
.panel{
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.panel-title{
  font-family:var(--font-head);font-weight:700;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

/* ── NOTES ── */
.notes-area{
  width:100%;min-height:120px;background:var(--bg-input);
  border:1px solid var(--border);color:var(--text);
  font-family:var(--font-mono);font-size:12px;line-height:1.6;
  padding:10px;resize:vertical;outline:none;
}
.notes-area:focus{border-color:var(--border-bright)}
.notes-saved{font-size:9px;color:var(--text-dim);text-align:right;margin-top:4px;min-height:12px}

/* ── TASKS ── */
.task-input-row{display:flex;gap:6px;margin-bottom:8px}
.task-input{
  flex:1;background:var(--bg-input);border:1px solid var(--border);
  color:var(--text);font-family:var(--font-mono);font-size:11px;
  padding:6px 8px;outline:none;
}
.task-input:focus{border-color:var(--border-bright)}
.task-add-btn{
  padding:6px 10px;background:transparent;border:1px solid var(--accent-dim);
  color:var(--accent);font-family:var(--font-mono);font-size:12px;
  cursor:pointer;transition:all .2s;
}
.task-add-btn:hover{background:var(--accent);color:var(--bg)}
.task-list{display:flex;flex-direction:column;gap:4px}
.task-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-input);border:1px solid var(--border)}
.task-check{
  width:12px;height:12px;border:1px solid var(--border-bright);
  cursor:pointer;flex-shrink:0;font-size:9px;color:var(--green);
  display:flex;align-items:center;justify-content:center;
}
.task-check.done{border-color:var(--green)}
.task-text{flex:1;font-size:11px;color:var(--text-muted);cursor:pointer}
.task-text.done{color:var(--text-dim);text-decoration:line-through}
.task-del{font-size:10px;color:var(--text-dim);cursor:pointer;padding:0 2px;transition:color .15s;line-height:1}
.task-del:hover{color:var(--red)}
.task-empty{font-size:11px;color:var(--text-dim);font-style:italic;padding:4px 0}

/* ── FOCUS TIMER ── */
.timer-display{text-align:center;padding:20px 0 14px}
.timer-time{font-family:var(--font-head);font-size:52px;font-weight:800;color:var(--accent);letter-spacing:.02em;line-height:1}
.timer-label{font-size:9px;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.timer-controls{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.timer-btn{
  padding:7px 16px;background:transparent;border:1px solid;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;transition:all .2s;
}
.timer-btn.primary{border-color:var(--accent);color:var(--accent)}
.timer-btn.primary:hover{background:var(--accent);color:var(--bg)}
.timer-btn.secondary{border-color:var(--border-bright);color:var(--text-dim)}
.timer-btn.secondary:hover{border-color:var(--text-muted);color:var(--text-muted)}
.timer-presets{display:flex;gap:6px;justify-content:center}
.timer-preset{
  padding:3px 10px;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);font-family:var(--font-mono);font-size:9px;
  cursor:pointer;transition:all .15s;
}
.timer-preset:hover,.timer-preset.active{border-color:var(--accent-dim);color:var(--accent)}

/* ── WEATHER ── */
.weather-main{text-align:center;padding:8px 0}
.weather-temp{font-family:var(--font-head);font-size:36px;font-weight:700;color:var(--accent)}
.weather-apparent{font-size:10px;color:var(--text-muted);margin-top:2px}
.weather-condition{font-size:12px;color:var(--text-muted);margin:8px 0}
.weather-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.weather-detail{text-align:center;padding:6px;background:var(--bg-input);border:1px solid var(--border)}
.weather-detail .label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.weather-detail .value{font-size:13px;color:var(--text-muted);margin-top:2px}
.weather-interp{
  font-size:11px;color:var(--text-dim);font-style:italic;
  padding:8px;background:var(--bg-input);border-left:2px solid var(--accent-dim);margin-top:4px;
}

/* ── NEWS ── */
.news-list{display:flex;flex-direction:column;gap:1px}
.news-item{
  padding:9px 10px;background:var(--bg-input);border-left:2px solid transparent;
  transition:border-color .15s;cursor:pointer;text-decoration:none;display:block;
}
.news-item:hover{border-left-color:var(--accent-dim)}
.news-source{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.news-headline{font-size:11px;color:var(--text-muted);line-height:1.4}
.news-item:hover .news-headline{color:var(--text)}
.news-meta{font-size:9px;color:var(--text-dim);margin-top:3px}
.news-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.news-source-btn{
  padding:3px 8px;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);font-family:var(--font-mono);font-size:9px;
  letter-spacing:.05em;cursor:pointer;transition:all .15s;
}
.news-source-btn.active{border-color:var(--accent-dim);color:var(--accent)}
.news-source-btn:hover{border-color:var(--border-bright);color:var(--text-muted)}
.news-error{font-size:11px;color:var(--text-dim);font-style:italic;padding:8px 0}

/* ── COMPLETED QUEST TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--bg-panel);border:1px solid var(--accent);
  padding:12px 18px;font-size:12px;color:var(--text);
  max-width:300px;opacity:0;transform:translateY(10px);
  transition:all .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}

/* ── SERVICE STATUS ── */
.status-service{margin-bottom:12px}
.status-service:last-child{margin-bottom:0}
.status-service-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.status-service-name{font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.status-badge{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:2px 6px;border:1px solid}
.status-badge.ok{color:var(--green);border-color:var(--green)}
.status-badge.degraded{color:var(--amber);border-color:var(--amber)}
.status-badge.outage{color:var(--red);border-color:var(--red)}
.status-badge.unknown{color:var(--text-dim);border-color:var(--border-bright)}
.status-components{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.status-component{display:flex;align-items:center;gap:4px}
.status-comp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-comp-label{font-size:9px;color:var(--text-muted);letter-spacing:.03em}
.status-timeline{display:flex;gap:2px;height:12px;margin-bottom:3px}
.status-slot{flex:1;height:100%}
.status-timeline-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim)}
.status-divider{border:none;border-top:1px solid var(--border);margin:12px 0}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-bright)}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  #hud-main{grid-template-columns:1fr 1fr}
  .col-right{grid-column:1/-1;flex-direction:row}
  #panel-weather,#panel-news{flex:1}
}
@media(max-width:600px){
  #hud-main{grid-template-columns:1fr}
  .col-right{flex-direction:column}
  #hud-header{grid-template-columns:1fr auto;grid-template-rows:auto auto}
  .header-center{grid-column:1/-1;grid-row:2}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="toast" id="toast"></div>

<div id="app">
  <header id="hud-header">
    <div class="header-left">
      <span class="hud-title">// PERSONAL HUD</span>
      <span class="hud-date" id="hud-date"></span>
    </div>
    <div class="header-center">
      <span class="flavour-line" id="flavour-line"></span>
    </div>
    <div class="header-right"></div>
  </header>

  <main id="hud-main">
    <div class="col-left">
      <section class="panel" id="panel-notes">
        <h2 class="panel-title">Notes</h2>
        <div id="notes-content"></div>
      </section>
      <section class="panel" id="panel-tasks">
        <h2 class="panel-title">Tasks</h2>
        <div id="tasks-content"></div>
      </section>
    </div>

    <div class="col-center">
      <section class="panel" id="panel-timer">
        <h2 class="panel-title">Focus</h2>
        <div id="timer-content"></div>
      </section>
    </div>

    <div class="col-right">
      <section class="panel" id="panel-weather">
        <h2 class="panel-title">Conditions</h2>
        <div id="weather-content"><span style="color:var(--text-dim);font-size:11px">Fetching weather...</span></div>
      </section>
      <section class="panel" id="panel-news">
        <h2 class="panel-title">Intel</h2>
        <div id="news-content"><span style="color:var(--text-dim);font-size:11px">Fetching news...</span></div>
      </section>
      <section class="panel" id="panel-status">
        <h2 class="panel-title">Service Status</h2>
        <div id="status-content"><span style="color:var(--text-dim);font-size:11px">Checking services...</span></div>
      </section>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// DATA BANKS — pre-generated, static assets
// ═══════════════════════════════════════════════════════
const DATA = {

  ]

  weatherInterp: {
    clear: ["Clear. No meteorological excuse for anything today.", "Clear skies. Longboard conditions: ideal.", "Visibility: excellent. The commute has no weather objections."],
    cloudy: ["Overcast. The light is flat and honest.", "Grey skies. The day requires no theatrical weather to be difficult.", "Clouds. This is the Netherlands."],
    rain: ["Rain. Longboard stays home. Accept the bus or accept the condition.", "Wet commute incoming. The board does not enjoy this.", "Rain. Adjust equipment selection accordingly."],
    drizzle: ["Drizzle. Borderline longboard conditions. Your call.", "Light precipitation. The board has survived worse. Barely.", "A damp morning. The Dutchness is strong."],
    snow: ["Snow. This is not a longboard day. This is a problem.", "Snow on the ground. Transit wins today.", "Snow. Exceptional event requiring adjusted expectations."],
    fog: ["Fog. The Netherlands in its natural state.", "Visibility reduced. Standard operating conditions for this country.", "Fog. Atmospheric, if inconvenient."],
    thunderstorm: ["Thunderstorm. Stay indoors. This is not debatable.", "Electrical weather event. Do not longboard through this.", "Storm incoming. The day reorganises around weather."],
    wind_strong: ["Strong wind advisory. Longboarding into a headwind builds character you didn't ask for.", "Wind. The commute becomes a workout regardless of effort.", "Wind: significant. The board is a liability today."]
  }
};

function load(key, def) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch { return def; }
}

function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}


function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}


// ═══════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════
function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      a: Math.random() * 0.4 + 0.1
    };
  }

  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 80; i++) particles.push(makeParticle());

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H;
      if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(224,120,48,${p.a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// ═══════════════════════════════════════════════════════
// HEADER
// ═══════════════════════════════════════════════════════
function initHeader() {
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now = new Date();
  document.getElementById('hud-date').textContent =
    `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  const dayNum = Math.floor(Date.now() / 86400000);
  document.getElementById('flavour-line').textContent =
    DATA.flavourLines[dayNum % DATA.flavourLines.length];
}





// ═══════════════════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════════════════
const WMO_CODES = {
  0: { label: 'Clear sky', cat: 'clear' },
  1: { label: 'Mainly clear', cat: 'clear' },
  2: { label: 'Partly cloudy', cat: 'cloudy' },
  3: { label: 'Overcast', cat: 'cloudy' },
  45: { label: 'Fog', cat: 'fog' },
  48: { label: 'Depositing rime fog', cat: 'fog' },
  51: { label: 'Light drizzle', cat: 'drizzle' },
  53: { label: 'Moderate drizzle', cat: 'drizzle' },
  55: { label: 'Dense drizzle', cat: 'drizzle' },
  61: { label: 'Slight rain', cat: 'rain' },
  63: { label: 'Moderate rain', cat: 'rain' },
  65: { label: 'Heavy rain', cat: 'rain' },
  66: { label: 'Light freezing rain', cat: 'rain' },
  67: { label: 'Heavy freezing rain', cat: 'rain' },
  71: { label: 'Slight snow', cat: 'snow' },
  73: { label: 'Moderate snow', cat: 'snow' },
  75: { label: 'Heavy snow', cat: 'snow' },
  80: { label: 'Slight showers', cat: 'rain' },
  81: { label: 'Moderate showers', cat: 'rain' },
  82: { label: 'Violent showers', cat: 'rain' },
  95: { label: 'Thunderstorm', cat: 'thunderstorm' },
  96: { label: 'Thunderstorm w/ hail', cat: 'thunderstorm' },
  99: { label: 'Thunderstorm w/ heavy hail', cat: 'thunderstorm' }
};

async function fetchWeather() {
  const container = document.getElementById('weather-content');
  try {
    // IP geolocation with timeout — falls back to Dalfsen if it fails
    let lat = 52.51, lon = 6.27, city = 'Dalfsen', tz = 'Europe%2FAmsterdam';
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3000);
      const geo = await fetch('https://ipapi.co/json/', { signal: ctrl.signal }).then(r => r.json());
      clearTimeout(timer);
      if (geo.latitude && geo.longitude) {
        lat = geo.latitude; lon = geo.longitude;
        city = geo.city || geo.region || 'Dalfsen';
        tz = encodeURIComponent(geo.timezone || 'Europe/Amsterdam');
      }
    } catch {}

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,relative_humidity_2m&timezone=${tz}`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    const code = WMO_CODES[c.weather_code] || { label: 'Unknown', cat: 'cloudy' };
    const windKph = Math.round(c.wind_speed_10m);

    let interpCat = code.cat;
    if (windKph > 30) interpCat = 'wind_strong';
    const interps = DATA.weatherInterp[interpCat] || DATA.weatherInterp.cloudy;
    const interp = rand(interps);

    container.innerHTML = `
      <div class="weather-main">
        <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="weather-apparent">Feels like ${Math.round(c.apparent_temperature)}°C</div>
        <div class="weather-condition">${code.label}</div>
      </div>
      <div class="weather-details">
        <div class="weather-detail">
          <div class="label">Wind</div>
          <div class="value">${windKph} km/h</div>
        </div>
        <div class="weather-detail">
          <div class="label">Humidity</div>
          <div class="value">${c.relative_humidity_2m}%</div>
        </div>
        <div class="weather-detail">
          <div class="label">Precip</div>
          <div class="value">${c.precipitation} mm</div>
        </div>
        <div class="weather-detail">
          <div class="label">Location</div>
          <div class="value" style="font-size:10px">~${city}</div>
        </div>
      </div>
      <div class="weather-interp">${interp}</div>`;
  } catch (e) {
    document.getElementById('weather-content').innerHTML = `<div class="news-error">Weather unavailable. Consult the window.</div>`;
  }
}

// ═══════════════════════════════════════════════════════
// NEWS
// ═══════════════════════════════════════════════════════
const NEWS_SOURCES = [
  { id: 'nos', label: 'NOS', url: 'https://feeds.nos.nl/nosnieuwsalgemeen' },
  { id: 'bbc', label: 'BBC', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
  { id: 'dw',  label: 'DW',  url: 'https://rss.dw.com/xml/rss-en-all' },
  { id: 'aj',  label: 'AJE', url: 'https://www.aljazeera.com/xml/rss/all.xml' }
];

let activeNewsSource = 'nos';

async function fetchNews(sourceId) {
  const container = document.getElementById('news-content');
  const source = NEWS_SOURCES.find(s => s.id === sourceId) || NEWS_SOURCES[0];

  const filterBtns = NEWS_SOURCES.map(s =>
    `<button class="news-source-btn ${s.id === sourceId ? 'active' : ''}"
      onclick="switchNewsSource('${s.id}')">${s.label}</button>`
  ).join('');

  container.innerHTML = `
    <div class="news-filter">${filterBtns}</div>
    <div id="news-list"><span style="color:var(--text-dim);font-size:11px">Fetching...</span></div>`;

  function renderItems(items, label) {
    let html = '<div class="news-list">';
    for (const { title, link, date } of items) {
      html += `
      <a class="news-item" href="${link}" target="_blank" rel="noopener">
        <div class="news-source">${label}</div>
        <div class="news-headline">${title}</div>
        ${date ? `<div class="news-meta">${date}</div>` : ''}
      </a>`;
    }
    return html + '</div>';
  }

  function fmtDate(str) {
    return str ? new Date(str).toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  }

  async function tryXML(text) {
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    const nodes = [...doc.querySelectorAll('item')].slice(0, 8);
    if (!nodes.length) throw new Error('No items');
    return nodes.map(n => ({
      title: n.querySelector('title')?.textContent || '',
      link:  n.querySelector('link')?.textContent || '#',
      date:  fmtDate(n.querySelector('pubDate')?.textContent)
    }));
  }

  // Attempt 1: direct fetch (works for feeds with CORS headers, e.g. BBC, DW)
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(source.url, { signal: ctrl.signal });
    if (!res.ok) throw new Error();
    const items = await tryXML(await res.text());
    document.getElementById('news-list').outerHTML = renderItems(items, source.label);
    return;
  } catch {}

  // Attempt 2: rss2json
  try {
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}&count=8`);
    const json = await res.json();
    if (json.status !== 'ok' || !json.items?.length) throw new Error('rss2json failed');
    const items = json.items.map(i => ({ title: i.title, link: i.link, date: fmtDate(i.pubDate) }));
    document.getElementById('news-list').outerHTML = renderItems(items, source.label);
    return;
  } catch {}

  // Attempt 3: allorigins + XML parse
  try {
    const res = await fetch(`https://api.allorigins.win/get?disableCache=true&url=${encodeURIComponent(source.url)}`);
    const json = await res.json();
    const items = await tryXML(json.contents);
    document.getElementById('news-list').outerHTML = renderItems(items, source.label);
  } catch {
    const el = document.getElementById('news-list');
    if (el) el.innerHTML = `<div class="news-error">Feed unavailable. Try another source or consult reality directly.</div>`;
  }
}

function switchNewsSource(id) {
  activeNewsSource = id;
  fetchNews(id);
}

// ═══════════════════════════════════════════════════════
// SERVICE STATUS
// ═══════════════════════════════════════════════════════
const STATUS_SERVICES = [
  { id: 'anthropic', label: 'Anthropic', rssUrl: 'https://status.anthropic.com/history.rss' },
  { id: 'openai',    label: 'OpenAI',    rssUrl: 'https://status.openai.com/history.rss' }
];

function buildStatusTimeline(items) {
  const now = Date.now();
  const hourMs = 3600000;
  const slots = Array(24).fill(0); // 0=ok, 1=resolved incident, 2=active incident

  for (const item of items) {
    const pubTime = new Date(item.pubDate).getTime();
    const hoursAgo = (now - pubTime) / hourMs;
    if (hoursAgo > 24) continue;
    const slotIdx = 23 - Math.floor(hoursAgo);
    if (slotIdx < 0 || slotIdx > 23) continue;
    const title = (item.title || '').toLowerCase();
    const isResolved = title.includes('resolved') || title.includes('postmortem');
    const sev = isResolved ? 1 : 2;
    // Spread ±1 slot — RSS items are point-in-time updates, not ranges
    for (let i = Math.max(0, slotIdx - 1); i <= Math.min(23, slotIdx + 1); i++) {
      slots[i] = Math.max(slots[i], sev);
    }
  }

  return slots.map((s, i) => {
    const hour = new Date(now - (23 - i) * hourMs);
    const hh = hour.getHours().toString().padStart(2, '0');
    const label = `${hh}:00 — ${s === 0 ? 'OK' : s === 1 ? 'Incident (resolved)' : 'Active incident'}`;
    const bg = s === 0 ? 'rgba(122,184,122,0.65)' : s === 1 ? 'rgba(212,168,64,0.75)' : 'rgba(192,80,64,0.8)';
    return `<div class="status-slot" style="background:${bg}" title="${label}"></div>`;
  }).join('');
}

async function fetchStatus() {
  const container = document.getElementById('status-content');

  async function fetchStatusRSS(url) {
    // Try rss2json first, fall back to allorigins
    try {
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=50`);
      const json = await res.json();
      if (json.status !== 'ok' || !json.items) throw new Error();
      return json.items;
    } catch {}
    const res = await fetch(`https://api.allorigins.win/get?disableCache=true&url=${encodeURIComponent(url)}`);
    const json = await res.json();
    const doc = new DOMParser().parseFromString(json.contents, 'text/xml');
    return [...doc.querySelectorAll('item')].map(n => ({
      title:   n.querySelector('title')?.textContent || '',
      link:    n.querySelector('link')?.textContent || '',
      pubDate: n.querySelector('pubDate')?.textContent || ''
    }));
  }

  const results = await Promise.allSettled(
    STATUS_SERVICES.map(async svc => {
      const items = await fetchStatusRSS(svc.rssUrl);
      return { svc, items };
    })
  );

  let html = '';
  results.forEach((result, idx) => {
    if (idx > 0) html += `<hr class="status-divider">`;
    if (result.status === 'rejected') {
      html += `<div class="news-error">Status unavailable.</div>`;
      return;
    }

    const { svc, items } = result.value;
    const now = Date.now();
    const hourMs = 3600000;

    // Active = non-resolved update within last 6 hours
    const active = items.find(item => {
      const age = now - new Date(item.pubDate).getTime();
      const t = (item.title || '').toLowerCase();
      return age < 6 * hourMs && !t.includes('resolved') && !t.includes('postmortem');
    });

    const badgeClass = active ? 'degraded' : 'ok';
    const badgeLabel = active ? 'Degraded' : 'Operational';
    const timeline = buildStatusTimeline(items);

    const recentHtml = items.slice(0, 3).map(item => {
      const t = item.title || '';
      const resolved = t.toLowerCase().includes('resolved') || t.toLowerCase().includes('postmortem');
      const col = resolved ? 'var(--text-dim)' : 'var(--amber)';
      const date = item.pubDate
        ? new Date(item.pubDate).toLocaleString('en-GB', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
        : '';
      return `<a href="${item.link||'#'}" target="_blank" rel="noopener"
        style="display:block;padding:5px 0;border-bottom:1px solid var(--border);text-decoration:none">
        <div style="font-size:9px;color:${col};line-height:1.4">${t}</div>
        <div style="font-size:9px;color:var(--text-dim);margin-top:1px">${date}</div>
      </a>`;
    }).join('');

    html += `
    <div class="status-service">
      <div class="status-service-header">
        <span class="status-service-name">${svc.label}</span>
        <span class="status-badge ${badgeClass}">${badgeLabel}</span>
      </div>
      <div class="status-timeline">${timeline}</div>
      <div class="status-timeline-meta"><span>24h ago</span><span>now</span></div>
      ${recentHtml ? `<div style="margin-top:8px">${recentHtml}</div>` : ''}
    </div>`;
  });

  container.innerHTML = html || '<div class="news-error">Status unavailable.</div>';
}

// ═══════════════════════════════════════════════════════
// NOTES
// ═══════════════════════════════════════════════════════
function renderNotes() {
  const saved = load('hud_notes', '');
  document.getElementById('notes-content').innerHTML =
    `<textarea class="notes-area" id="notes-area" placeholder="...">${saved}</textarea>
     <div class="notes-saved" id="notes-saved"></div>`;
  let timer;
  document.getElementById('notes-area').addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      save('hud_notes', this.value);
      const el = document.getElementById('notes-saved');
      if (!el) return;
      el.textContent = 'saved';
      setTimeout(() => { el.textContent = ''; }, 1200);
    }, 600);
  });
}

// ═══════════════════════════════════════════════════════
// TASKS
// ═══════════════════════════════════════════════════════
function renderTasks() {
  const tasks = load('hud_tasks', []);
  const items = tasks.map((t, i) => `
    <div class="task-item">
      <div class="task-check ${t.done ? 'done' : ''}" onclick="toggleTask(${i})">${t.done ? '✓' : ''}</div>
      <span class="task-text ${t.done ? 'done' : ''}" onclick="toggleTask(${i})">${t.text}</span>
      <span class="task-del" onclick="deleteTask(${i})">✕</span>
    </div>`).join('');
  document.getElementById('tasks-content').innerHTML = `
    <div class="task-input-row">
      <input class="task-input" id="task-input" type="text" placeholder="Add task..."
        onkeydown="if(event.key==='Enter')addTask()">
      <button class="task-add-btn" onclick="addTask()">+</button>
    </div>
    <div class="task-list">${items || '<div class="task-empty">No tasks. The day is open.</div>'}</div>`;
}

function addTask() {
  const input = document.getElementById('task-input');
  const text = input?.value.trim();
  if (!text) return;
  const tasks = load('hud_tasks', []);
  tasks.push({ text, done: false });
  save('hud_tasks', tasks);
  renderTasks();
  document.getElementById('task-input')?.focus();
}

function toggleTask(idx) {
  const tasks = load('hud_tasks', []);
  if (tasks[idx]) tasks[idx].done = !tasks[idx].done;
  save('hud_tasks', tasks);
  renderTasks();
}

function deleteTask(idx) {
  const tasks = load('hud_tasks', []);
  tasks.splice(idx, 1);
  save('hud_tasks', tasks);
  renderTasks();
}

// ═══════════════════════════════════════════════════════
// FOCUS TIMER
// ═══════════════════════════════════════════════════════
const timerState = { seconds: 25 * 60, running: false, intervalId: null, preset: 25 };

function renderTimer() {
  const m = Math.floor(timerState.seconds / 60);
  const s = timerState.seconds % 60;
  const display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const label = timerState.running ? 'Focus' : timerState.seconds === 0 ? 'Done' : 'Ready';
  document.getElementById('timer-content').innerHTML = `
    <div class="timer-display">
      <div class="timer-time">${display}</div>
      <div class="timer-label">${label}</div>
    </div>
    <div class="timer-controls">
      <button class="timer-btn primary" onclick="timerToggle()">${timerState.running ? '⏸ Pause' : '▶ Start'}</button>
      <button class="timer-btn secondary" onclick="timerReset()">↺ Reset</button>
    </div>
    <div class="timer-presets">
      ${[15,25,50,90].map(m => `<button class="timer-preset ${timerState.preset===m?'active':''}" onclick="timerSet(${m})">${m}m</button>`).join('')}
    </div>`;
}

function timerToggle() {
  if (timerState.seconds === 0) return;
  if (timerState.running) {
    clearInterval(timerState.intervalId);
    timerState.running = false;
  } else {
    timerState.running = true;
    timerState.intervalId = setInterval(() => {
      timerState.seconds--;
      if (timerState.seconds <= 0) {
        timerState.seconds = 0;
        timerState.running = false;
        clearInterval(timerState.intervalId);
        document.title = '// PERSONAL HUD';
        showToast('Focus session complete.');
      } else {
        const mm = String(Math.floor(timerState.seconds/60)).padStart(2,'0');
        const ss = String(timerState.seconds%60).padStart(2,'0');
        document.title = `${mm}:${ss} — HUD`;
      }
      renderTimer();
    }, 1000);
  }
  renderTimer();
}

function timerReset() {
  clearInterval(timerState.intervalId);
  timerState.running = false;
  timerState.seconds = timerState.preset * 60;
  document.title = '// PERSONAL HUD';
  renderTimer();
}

function timerSet(mins) {
  clearInterval(timerState.intervalId);
  timerState.running = false;
  timerState.preset = mins;
  timerState.seconds = mins * 60;
  document.title = '// PERSONAL HUD';
  renderTimer();
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initParticles();
  initHeader();
  renderNotes();
  renderTasks();
  renderTimer();
  fetchWeather();
  fetchNews(activeNewsSource);
  fetchStatus();
});
