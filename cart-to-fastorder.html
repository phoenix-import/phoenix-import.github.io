<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart JSON → Fast Order CSV</title>
<style>
  body{font-family:Calibri,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#fff;color:#333;}
  header{background:#68437B;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;}
  header h1{font-size:18px;font-weight:600;margin:0;}
  header img{height:36px;margin-left:auto;}
  .content{padding:2rem;max-width:42rem;}
  p.desc{color:#555;margin-bottom:1.5rem;line-height:1.6;}
  label{display:block;font-weight:600;margin-bottom:.4rem;}
  input[type=file]{display:block;margin-bottom:1.2rem;}
  button{padding:8px 20px;border:0;border-radius:4px;background:#ca427e;color:#fff;cursor:pointer;font-size:15px;}
  button:hover{background:#b33a6f;}
  #preview{margin-top:1.5rem;display:none;}
  #preview h2{font-size:15px;font-weight:600;margin-bottom:.5rem;color:#68437B;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th{background:#f7f2fa;color:#68437B;text-align:left;padding:6px 10px;border:1px solid #e0e0e0;}
  td{padding:6px 10px;border:1px solid #e0e0e0;}
  tr:nth-child(even) td{background:#fafafa;}
  #status{margin-top:1rem;font-size:14px;color:#555;}
  #error{color:#e74c3c;margin-top:.8rem;font-size:14px;}
</style>
</head>
<body>

<header>
  <h1>Cart JSON → Fast Order CSV</h1>
  <a href="index.html" style="margin-left:auto;line-height:0;"><img src="logo.png" alt="Phoenix Import"></a>
</header>

<div class="content">
  <p class="desc">Upload a cart history JSON from the recovery plugin. The tool extracts SKU and quantity for each line and downloads a semicolon-delimited CSV ready for fast order import.</p>

  <label for="file">Cart history JSON</label>
  <input type="file" id="file" accept=".json">
  <button id="go">Convert &amp; Download</button>
  <p id="error"></p>
  <p id="status"></p>

  <div id="preview">
    <h2>Preview</h2>
    <table id="table">
      <thead><tr><th>SKU</th><th>Quantity</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const err    = m => { document.getElementById('error').textContent = m; document.getElementById('status').textContent = ''; };
const status = m => { document.getElementById('status').textContent = m; document.getElementById('error').textContent = ''; };

document.getElementById('go').onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) { err('Please choose a JSON file first.'); return; }

  let data;
  try {
    data = JSON.parse(await f.text());
  } catch (e) {
    err('Could not parse JSON: ' + e.message);
    return;
  }

  if (!Array.isArray(data) || data.length === 0) {
    err('Expected a non-empty JSON array.');
    return;
  }

  const rows = [];
  for (const item of data) {
    const sku = (item.sku ?? '').toString().trim();
    const qty = parseInt(item.quantity, 10);
    if (!sku || isNaN(qty) || qty <= 0) continue;
    rows.push([sku, qty]);
  }

  if (rows.length === 0) {
    err('No valid SKU/quantity rows found in the file.');
    return;
  }

  // Build CSV
  const csv = ['sku;quantity', ...rows.map(r => r.join(';'))].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

  // Derive a filename from the uploaded file name, falling back to today
  const datePart = f.name.match(/\d{8}/) ? f.name.match(/\d{8}/)[0] : new Date().toISOString().slice(0,10).replace(/-/g,'');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `fastorder_${datePart}.csv`
  });
  a.click();
  URL.revokeObjectURL(a.href);

  // Populate preview table
  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML = '';
  for (const [sku, qty] of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${sku}</td><td>${qty}</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById('preview').style.display = 'block';
  status(`Done — ${rows.length} line${rows.length !== 1 ? 's' : ''} written to CSV.`);
};
</script>
</body>
</html>
