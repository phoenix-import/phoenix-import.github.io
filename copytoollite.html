/* =========================
   ENGINE
   ========================= */

function listWithAnd(items, lang) {
  const andWord = { EN:"and", NL:"en", DE:"und", FR:"et", ES:"y", IT:"e" }[lang] || "and";
  const arr = items.filter(Boolean);
  if (arr.length <= 1) return arr[0] || "";
  if (arr.length === 2) return `${arr[0]} ${andWord} ${arr[1]}`;
  return `${arr.slice(0,-1).join(", ")} ${andWord} ${arr[arr.length-1]}`;
}

function titleCase(s) {
  return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function renderFor(product, lang) {
  const tpl = (DATA.templates[product.type] && DATA.templates[product.type][lang])
    ? DATA.templates[product.type][lang]
    : (DATA.templates[product.type] ? DATA.templates[product.type].EN : "");

  const packLine = (DATA.packLine(product, lang) || "").trim();
  const disclaimer = DATA.disclaimer[lang] || DATA.disclaimer.EN;

  const stoneNames = (product.constituents || []).map(k => (DATA.stones[k] && DATA.stones[k][lang]) ? DATA.stones[k][lang] : k);
  const stoneList = listWithAnd(stoneNames, lang);

  const symbolName = product.symbol && DATA.symbols[product.symbol]
    ? DATA.symbols[product.symbol].name[lang]
    : "";
  const symbolBlurb = product.symbol && DATA.symbols[product.symbol]
    ? DATA.symbols[product.symbol].blurb[lang]
    : "";

  const s1k = product.constituents && product.constituents[0] ? product.constituents[0] : null;
  const s2k = product.constituents && product.constituents[1] ? product.constituents[1] : null;

  const s1Name = s1k && DATA.stones[s1k] ? titleCase(DATA.stones[s1k][lang]) : "";
  const s2Name = s2k && DATA.stones[s2k] ? titleCase(DATA.stones[s2k][lang]) : "";

  const s1Blurb = s1k && DATA.stoneBlurbs[s1k] ? DATA.stoneBlurbs[s1k][lang] : "";
  const s2Blurb = s2k && DATA.stoneBlurbs[s2k] ? DATA.stoneBlurbs[s2k][lang] : "";

  // Malas: one stone per line
  const stoneBlocks = (product.constituents || []).map((k, idx) => {
    const n = (DATA.stones[k] && DATA.stones[k][lang]) ? titleCase(DATA.stones[k][lang]) : k;
    const b = (DATA.stoneBlurbs[k] && DATA.stoneBlurbs[k][lang]) ? DATA.stoneBlurbs[k][lang] : "";
    const br = (idx === (product.constituents.length - 1)) ? "" : "<br>";
    return `<strong>${n}</strong> - ${b}${br}`;
  }).join("");

  const symbolBlock = symbolName
    ? `<br><strong>${symbolName}</strong> ${symbolBlurb}`
    : "";

  const malaExtra = (product.symbol && product.symbol === "mandala")
    ? ({ EN:" with a mandala pendant", NL:" met mandala hanger", DE:" mit Mandala-Anhänger", FR:" avec pendentif mandala", ES:" con colgante mandala", IT:" con pendente mandala" }[lang] || "")
    : "";

  let filled = tpl
    .replaceAll("{{PACK_LINE}}", packLine ? `<p>${packLine}</p>` : "")
    .replaceAll("<br>\n<em>{{DISCLAIMER}}</em>", "")
    .replaceAll("{{BEADS}}", product.beads || "")
    .replaceAll("{{SIZE}}", product.size || "")
    .replaceAll("{{STONE_LIST}}", stoneList)
    .replaceAll("{{S1_NAME}}", s1Name)
    .replaceAll("{{S2_NAME}}", s2Name)
    .replaceAll("{{S1_BLURB}}", s1Blurb)
    .replaceAll("{{S2_BLURB}}", s2Blurb)
    .replaceAll("{{SYMBOL_NAME}}", symbolName)
    .replaceAll("{{SYMBOL_BLURB}}", symbolBlurb)
    .replaceAll("{{STONE_BLOCKS}}", stoneBlocks)
    .replaceAll("{{SYMBOL_BLOCK}}", symbolBlock)
    .replaceAll("{{MALA_EXTRA}}", malaExtra);

  return filled;
}

function buildBundle(product) {
  const bundle = {};
  for (const L of DATA.languages) bundle[L.code] = renderFor(product, L.code);
  return bundle;
}

/* =========================
   UI
   ========================= */

const skuSel = document.getElementById("sku");
const langSel = document.getElementById("lang");
const out = document.getElementById("out");
const preview = document.getElementById("preview");
const meta = document.getElementById("meta");
const tabs = document.getElementById("tabs");
const copyBtn = document.getElementById("copyBtn");
const copyAllBtn = document.getElementById("copyAllBtn");

let currentLang = "EN";

function refreshTabs() {
  tabs.innerHTML = "";
  for (const L of DATA.languages) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(L.code === currentLang));
    b.textContent = L.label;
    b.addEventListener("click", () => {
      currentLang = L.code;
      langSel.value = currentLang;
      update();
    });
    tabs.appendChild(b);
  }
}

function update() {
  const sku = skuSel.value;
  const product = DATA.products.find(p => p.sku === sku);
  if (!product) return;

  const title = product.title && product.title[currentLang] ? product.title[currentLang] : (product.title ? product.title.EN : "");
  meta.innerHTML =
    `SKU <span class="pill">${product.sku}</span>` +
    ` Type <span class="pill">${product.type}</span>` +
    (title ? ` <span class="pill">${title}</span>` : "");

  const html = renderFor(product, currentLang);
  out.value = html;
  preview.innerHTML = html;

  refreshTabs();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const tmp = document.createElement("textarea");
    tmp.value = text;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand("copy");
    document.body.removeChild(tmp);
  }
}

copyBtn.addEventListener("click", async () => {
  await copyText(out.value);
});

copyAllBtn.addEventListener("click", async () => {
  const sku = skuSel.value;
  const product = DATA.products.find(p => p.sku === sku);
  const bundle = {
    sku: product.sku,
    line: DATA.lineName,
    type: product.type,
    html: buildBundle(product),
  };
  await copyText(JSON.stringify(bundle, null, 2));
});

skuSel.addEventListener("change", update);
langSel.addEventListener("change", () => {
  currentLang = langSel.value;
  update();
});

(function init() {
  for (const p of DATA.products) {
    const opt = document.createElement("option");
    opt.value = p.sku;
    opt.textContent = p.sku;
    skuSel.appendChild(opt);
  }
  for (const L of DATA.languages) {
    const opt = document.createElement("option");
    opt.value = L.code;
    opt.textContent = L.label;
    langSel.appendChild(opt);
  }
  skuSel.value = DATA.products[0].sku;
  currentLang = "EN";
  langSel.value = currentLang;
  update();
})();
