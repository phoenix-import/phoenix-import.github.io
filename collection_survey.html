document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

button>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"sp-ui-log\" style=\"position: absolute; left: 22px; bottom: 22px; width: 250px; background: var(--hull); border: 1px solid var(--line); border-radius: 15px; padding: 14px 15px; backdrop-filter: blur(7px);\">\n    <div style=\"display: flex; align-items: baseline; gap: 8px;\">\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); flex: 1;\">Ship's log<\u002Fspan>\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--go);\">{{ keptCount }} kept<\u002Fspan>\n      <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--pink);\">{{ cutCount }} cut<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 5px; margin-top: 10px;\">\n      <sc-for list=\"{{ log }}\" as=\"entry\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; gap: 8px; align-items: baseline;\">\n          <span style=\"{{ entry.tick }}\">{{ entry.mark }}<\u002Fspan>\n          <span style=\"flex: 1; font-size: 12px; line-height: 1.35; color: var(--muted);\">{{ entry.text }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ logEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size: 12px; line-height: 1.5; color: var(--muted);\">Nothing logged yet. Judge a link to fire the engines.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"height: 1px; background: var(--line); margin: 12px 0 11px;\"><\u002Fdiv>\n    <div style=\"display: flex; gap: 6px; align-items: center;\">\n      <button sc-camel-on-click=\"{{ saveProgress }}\" style=\"{{ ghostBtn }}\">Save<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ pickProgress }}\" style=\"{{ ghostBtn }}\">Load<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportMap }}\" style=\"{{ goldBtn }}\">Export survey<\u002Fbutton>\n      <input id=\"sp-file\" type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ onFile }}\" style=\"display: none;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"sp-ui-right\" style=\"position: absolute; top: 88px; right: 22px; width: 326px; max-height: calc(100vh - 118px); overflow-y: auto; background: var(--hull); border: 1px solid var(--line); border-radius: 16px; padding: 17px; backdrop-filter: blur(7px);\">\n\n    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted);\">{{ hereKind }}<\u002Fdiv>\n    <div style=\"font-size: 20px; font-weight: 600; margin-top: 5px; line-height: 1.2;\">{{ hereName }}<\u002Fdiv>\n    <div style=\"font-size: 12.5px; color: var(--muted); margin-top: 3px;\">{{ hereMeta }}<\u002Fdiv>\n\n    <div style=\"height: 1px; background: var(--line); margin: 14px 0;\"><\u002Fdiv>\n\n    <sc-if value=\"{{ hasCandidate }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold);\">Survey this link<\u002Fdiv>\n        <div style=\"font-size: 16px; font-weight: 500; margin-top: 8px; line-height: 1.3;\">{{ candTarget }}<\u002Fdiv>\n        <div style=\"font-size: 12px; color: var(--muted); margin-top: 3px;\">{{ candTargetParent }}<\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.55; margin-top: 11px; padding: 11px 13px; border-radius: 11px; background: rgba(150, 140, 190, 0.1); border-left: 2px solid var(--gold);\">{{ candReason }}<\u002Fdiv>\n        <div style=\"display: flex; gap: 7px; margin-top: 12px;\">\n          <button sc-camel-on-click=\"{{ voteKeep }}\" style=\"{{ keepBtn }}\">✓ Holds up<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ voteCut }}\" style=\"{{ cutBtn }}\">✕ Nonsense<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size: 11.5px; line-height: 1.5; color: var(--muted); margin-top: 9px;\">Either verdict flies you to {{ candTargetShort }}. Only a kept link is written into the survey.<\u002Fdiv>\n        <sc-if value=\"{{ hasAlternatives }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"height: 1px; background: var(--line); margin: 14px 0 11px;\"><\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted);\">Other headings · {{ altCount }}<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 4px; margin-top: 8px;\">\n              <sc-for list=\"{{ alternatives }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ a.choose }}\" style=\"{{ a.rowStyle }}\">\n                  <span style=\"{{ a.dotStyle }}\"><\u002Fspan>\n                  <span style=\"flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ a.label }}<\u002Fspan>\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);\">{{ a.dist }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noCandidate }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--lav);\">System surveyed<\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.55; color: var(--muted); margin-top: 9px;\">{{ strandedText }}<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 4px; margin-top: 11px;\">\n          <sc-for list=\"{{ lanes }}\" as=\"ln\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ ln.go }}\" style=\"{{ ln.rowStyle }}\">\n              <span style=\"{{ ln.dotStyle }}\"><\u002Fspan>\n              <span style=\"flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ ln.label }}<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: {{ ln.tint }};\">{{ ln.tag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ jumpNearest }}\" style=\"{{ warpBtn }}\">Warp to nearest unsurveyed system<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div id=\"sp-ui-help\" style=\"position: absolute; z-index: 6; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 430px; max-height: 84vh; overflow-y: auto; background: var(--hull-solid); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold); flex: 1;\">Mission briefing<\u002Fspan>\n        <span sc-camel-on-click=\"{{ toggleHelp }}\" style=\"cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: rgba(150, 140, 190, 0.14); color: var(--muted); font-size: 12px; line-height: 1;\">✕<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 22px; font-weight: 600; margin-top: 12px; line-height: 1.2;\">Welcome aboard, Wietze.<\u002Fdiv>\n      <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 10px;\">This is our product catalogue as a star chart. Every <strong style=\"color: var(--gold); font-weight: 500;\">sun<\u002Fstrong> is a main collection; the <strong style=\"color: var(--lav); font-weight: 500;\">planets<\u002Fstrong> orbiting it are its subcollections. The faint lines between systems are links a machine <em>thinks<\u002Fem> make sense. {{ totalCount }} of them. Nobody has checked whether they actually do.<\u002Fdiv>\n\n      <div style=\"font-size: 13.5px; font-weight: 500; margin-top: 16px;\">That's the job<\u002Fdiv>\n      <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 5px;\">Your ship has no throttle. The only way to move is to read the reasoning for a proposed link and rule on it. <strong style=\"color: var(--go); font-weight: 500;\">Holds up<\u002Fstrong> keeps it; <strong style=\"color: var(--pink); font-weight: 500;\">Nonsense<\u002Fstrong> throws it out. Either way the engines fire and you arrive at the other collection, where the next set of links is waiting.<\u002Fdiv>\n\n      <div style=\"font-size: 13.5px; font-weight: 500; margin-top: 16px;\">What good looks like<\u002Fdiv>\n      <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 5px;\">A link holds up if a customer browsing one collection would plausibly want the other — incense and incense holders, a yoga mat and its cleaner. Be ruthless about vague ones: \"both are spiritual\" is not a reason. If a collection seems linked to everything, that's a smell, not a hub.<\u002Fdiv>\n\n      <div style=\"font-size: 13.5px; font-weight: 500; margin-top: 16px;\">Service record<\u002Fdiv>\n      <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 5px;\">Fifteen achievements are hiding in the catalogue — some for distance covered, some for how you work. The ★ button top right keeps your record.<\u002Fdiv>\n\n      <div style=\"font-size: 13.5px; font-weight: 500; margin-top: 16px;\">Nothing is lost<\u002Fdiv>\n      <div style=\"font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 5px;\">Progress saves itself in this browser, so you can close the tab mid-flight. <strong style=\"color: var(--ink); font-weight: 500;\">Save file<\u002Fstrong> writes it out if you're switching machines, and <strong style=\"color: var(--ink); font-weight: 500;\">Export survey<\u002Fstrong> hands back the finished chart for the real tool. Drag the background to look around; scroll to zoom.<\u002Fdiv>\n\n      <button sc-camel-on-click=\"{{ toggleHelp }}\" style=\"width: 100%; margin-top: 20px; padding: 12px; border-radius: 999px; border: 0; background: var(--gold); color: #1a1405; font-size: 13px; font-weight: 500; cursor: pointer;\">{{ helpCta }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasUnlock }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; z-index: 7; top: 96px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 13px; padding: 13px 20px 13px 16px; background: var(--hull-solid); border: 1px solid var(--gold); border-radius: 14px; box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), 0 0 0 4px rgba(232, 196, 106, 0.08);\">\n      <span style=\"width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: #1a1405; font-size: 17px;\">★<\u002Fspan>\n      <span>\n        <span style=\"display: block; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);\">Achievement unlocked<\u002Fspan>\n        <span style=\"display: block; font-size: 15px; font-weight: 600; margin-top: 3px;\">{{ unlockName }}<\u002Fspan>\n        <span style=\"display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px;\">{{ unlockLine }}<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ badgesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; z-index: 6; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; max-height: 84vh; overflow-y: auto; background: var(--hull-solid); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold); flex: 1;\">Service record · {{ badgeCount }}<\u002Fspan>\n        <span sc-camel-on-click=\"{{ toggleBadges }}\" style=\"cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: rgba(150, 140, 190, 0.14); color: var(--muted); font-size: 12px; line-height: 1;\">✕<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; margin-top: 14px;\">\n        <sc-for list=\"{{ badgeList }}\" as=\"b\" hint-placeholder-count=\"8\">\n          <div style=\"{{ b.rowStyle }}\">\n            <span style=\"{{ b.iconStyle }}\">{{ b.icon }}<\u002Fspan>\n            <span style=\"flex: 1;\">\n              <span style=\"display: block; font-size: 13.5px; font-weight: 500;\">{{ b.name }}<\u002Fspan>\n              <span style=\"display: block; font-size: 12px; color: var(--muted); margin-top: 1px;\">{{ b.line }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"{{ toastStyle }}\">{{ toast }}<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Deep Space Survey&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst SAVE = 'collection-map.space.v1';\nconst RANKS = [\n  [0, 'Cadet navigator'], [10, 'Survey pilot'], [40, 'Chart officer'],\n  [100, 'Lane warden'], [200, 'Deep space cartographer'], [360, 'Admiralty of the catalogue']\n];\nconst key = function (a, b) { return a < b ? a + '|' + b : b + '|' + a; };\n\nconst BADGES = [\n  { id: 'first', n: 1, name: 'First Contact', line: 'You ruled on your first link.' },\n  { id: 'ten', n: 10, name: 'Ten Down', line: 'Ten links surveyed. The engines are warm.' },\n  { id: 'clear', ev: 'clear', name: 'System Cleared', line: 'Every link out of one collection, ruled on.' },\n  { id: 'cut5', ev: 'cut5', name: 'Hard To Please', line: 'Five nonsense calls in a row.' },\n  { id: 'keep5', ev: 'keep5', name: 'Good Eye', line: 'Five keepers in a row.' },\n  { id: 'twentyfive', n: 25, name: 'Quarter Century', line: '25 links behind you.' },\n  { id: 'warp', ev: 'warp', name: 'Warp Drive', line: 'You jumped across the catalogue.' },\n  { id: 'fifty', n: 50, name: 'Half Century', line: '50 surveyed. Chart officer material.' },\n  { id: 'tensystems', ev: 'tensystems', name: 'Long Haul', line: 'Ten different systems visited.' },\n  { id: 'hundred', n: 100, name: 'Centurion', line: '100 links judged. A fifth of the sky.' },\n  { id: 'onefifty', n: 150, name: 'Deep Field', line: '150 down.' },\n  { id: 'twohundred', n: 200, name: 'Cartographer', line: '200 links. The map is yours now.' },\n  { id: 'threehundred', n: 300, name: 'Star Pilot', line: '300 surveyed.' },\n  { id: 'fourhundred', n: 400, name: 'Home Stretch', line: '400. Not far now.' },\n  { id: 'all', ev: 'all', name: 'Admiralty', line: 'Every link in the catalogue surveyed.' }\n];\n\nclass Component extends DCLogic {\n  state = { lang: 'en', here: null, cand: null, verdicts: {}, log: [], helpOpen: false, toast: '', v: 0,\n    badges: {}, badgesOpen: false, unlocked: null, streak: null, streakN: 0, visited: {} };\n\n  componentDidMount() {\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch (e) {}\n    this.saved = saved;\n    try { if (!localStorage.getItem(SAVE)) this.setState({ helpOpen: true }); } catch (e) { this.setState({ helpOpen: true }); }\n\n    const c = document.getElementById('sp-canvas');\n    this.canvas = c;\n    this.cam = { yaw: 0.5, pitch: -0.3, dist: 3400 };\n    this.ship = { x: 0, y: 0, z: 0, hx: 0, hy: 0, hz: 0 };\n    this.travel = null;\n    this.drag = null;\n    this.t0 = performance.now();\n    c.addEventListener('pointerdown', this.onDown);\n    window.addEventListener('pointermove', this.onMove);\n    window.addEventListener('pointerup', this.onUp);\n    c.addEventListener('wheel', this.onWheel, { passive: false });\n    window.addEventListener('resize', this.resize);\n    this.resize();\n    this.tick();\n    this.fetchSource();\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('pointermove', this.onMove);\n    window.removeEventListener('pointerup', this.onUp);\n    window.removeEventListener('resize', this.resize);\n  }\n\n\n\n  fetchSource() {\n    const inline = function (id) {\n      const el = document.getElementById(id);\n      if (!el) return null;\n      try { return JSON.parse(el.textContent); } catch (e) { return null; }\n    };\n    const g = inline('sp-graph'), i = inline('sp-inferred');\n    if (g) { this.build(g, (i && i.links) || []); return; }\n    Promise.all([\n      fetch('./category-graph.json').then(function (r) { return r.json(); }),\n      fetch('./inferred-links.json').then(function (r) { return r.json(); }).catch(function () { return { links: [] }; })\n    ]).then((res) => this.build(res[0], res[1].links || []))\n      .catch((err) => { console.error('chart load failed: ' + (err && (err.stack || err.message || err))); this.flash('Could not load the star chart data'); });\n  }\n\n  /* ---------- world ---------- */\n\n  build(graph, inferred) {\n    const nodes = [], byId = {};\n    (graph.categories || []).forEach(function (c) {\n      if (byId[c.id]) return;\n      const n = {\n        id: c.id, en: (c.name && c.name.en) || c.id, nl: (c.name && c.name.nl) || (c.name && c.name.en) || c.id,\n        main: c.type === 'main', standalone: c.type === 'standalone',\n        parent: c.parent || null, products: c.products || 0,\n        urlNl: (c.url && c.url.nl) || null, urlEn: (c.url && c.url.en) || null\n      };\n      nodes.push(n); byId[c.id] = n;\n    });\n\n    const edges = [], seen = {};\n    const add = function (a, b, kind, reason) {\n      if (!byId[a] || !byId[b] || a === b) return;\n      const k = key(a, b);\n      if (seen[k]) return;\n      seen[k] = 1;\n      edges.push({ a: a, b: b, kind: kind, reason: reason || null, k: k });\n    };\n    nodes.forEach(function (n) { if (n.parent && byId[n.parent]) add(n.parent, n.id, 'menu'); });\n    (graph.links || []).forEach(function (l) { add(l.source, l.target, l.type || 'cross', l.reason); });\n    inferred.forEach(function (l) { add(l.source, l.target, 'inferred', l.reason || null); });\n\n    const mains = nodes.filter(function (n) { return n.main; });\n    mains.forEach(function (m, i) { m.hue = (34 + i * 300 / Math.max(mains.length, 1)) % 360; });\n    nodes.forEach(function (n) {\n      const root = n.main ? n : (byId[n.parent] || null);\n      n.hue = root && root.hue != null ? root.hue : 268;\n      n.sdeg = 0;\n      n.inf = [];\n    });\n    edges.forEach(function (e) {\n      if (e.kind === 'inferred') { byId[e.a].inf.push(e); byId[e.b].inf.push(e); }\n      else { byId[e.a].sdeg++; byId[e.b].sdeg++; }\n    });\n\n    const R = 1150;\n    nodes.forEach(function (n, i) {\n      const g = 2.399963 * i, r = R * Math.pow(i / Math.max(nodes.length - 1, 1), 0.5) * (n.main ? 0.5 : 1);\n      const ph = Math.acos(1 - 2 * ((i + 0.5) / nodes.length));\n      n.x = r * Math.sin(ph) * Math.cos(g); n.y = r * Math.sin(ph) * Math.sin(g); n.z = r * Math.cos(ph);\n      n.vx = 0; n.vy = 0; n.vz = 0;\n    });\n\n    this.nodes = nodes; this.byId = byId; this.edges = edges;\n    this.inferredEdges = edges.filter(function (e) { return e.kind === 'inferred'; });\n    this.settle(300);\n    nodes.forEach(function (n) { n.orbit = Math.random() * 6.2832; n.tilt = (Math.random() - 0.5) * 0.7; });\n    this.stars = [];\n    for (let i =     format: 'collection-map-survey-progress', version: 1,\n          saved: new Date().toISOString(), here: st.here, verdicts: st.verdicts, log: st.log\n        }, null, 1), 'application/json', (n) => this.flash('Saved ' + n + ' — ' + done + ' verdicts'));\n      },\n      pickProgress: () => { const i = document.getElementById('sp-file'); if (i) i.click(); },\n      onFile: (e) => {\n        const f = e.target.files && e.target.files[0];\n        e.target.value = '';\n        if (!f) return;\n        const rd = new FileReader();\n        rd.onload = () => {\n          try {\n            const d = JSON.parse(rd.result);\n            const v = d.verdicts || {};\n            const h = d.here && this.byId[d.here] ? d.here : st.here;\n            this.setState({ verdicts: v, log: d.log || [], here: h, cand: null });\n            setTimeout(() => { this.setState({ cand: this.firstPending(h) }); this.save(); }, 0);\n            const n = Object.keys(v).length;\n            this.flash('Resumed at ' + nm(this.byId[h]) + ' — ' + n + ' verdicts restored');\n          } catch (err) { this.flash('That file did not parse: ' + err.message); }\n        };\n        rd.readAsText(f);\n      },\n      exportMap: () => {\n        const links = [];\n        this.edges.forEach(function (e) {\n          if (e.kind === 'inferred') {\n            const v = st.verdicts[e.k];\n            if (v === 'cut') return;\n            links.push({ source: e.a, target: e.b, type: v === 'keep' ? 'manual' : 'inferred', reason: e.reason || null });\n          } else {\n            links.push({ source: e.a, target: e.b, type: e.kind, reason: e.reason || null });\n          }\n        });\n        const map = {\n          format: 'phoenix-collection-map', version: 1,\n          exported: new Date().toISOString(),\n          survey: { reviewed: done, kept: kept, cut: cut, remaining: total - done },\n          categories: nodes.map(function (n) {\n            return {\n              id: n.id, type: n.main ? 'main' : (n.standalone ? 'standalone' : 'sub'),\n              name: { en: n.en, nl: n.nl }, parent: n.parent || null,\n              products: n.products || 0, url: { nl: n.urlNl, en: n.urlEn }\n            };\n          }),\n          links: links\n        };\n        this.saveAs('collection-map-surveyed.json', JSON.stringify(map, null, 1), 'application/json',\n          (n) => this.flash('Saved ' + n + ' — ' + kept + ' kept, ' + cut + ' cut, ' + (total - done) + ' still open'));\n      },\n\n      toast: st.toast,\n      toastStyle: 'position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); max-width: 400px; padding: 11px 18px; border-radius: 999px; background: var(--hull-solid); border: 1px solid var(--line); font-size: 12.5px; text-align: center; transition: opacity 0.25s; opacity: ' + (st.toast ? '1' : '0') + '; pointer-events: none;'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
