<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SKU ↔ Handle Mapper (XLSX)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1115; color:#e6e6e6; margin:0; padding:20px; }
    h1 { margin:0 0 10px; }
    button { margin-top:10px; padding:8px 12px; border:0; border-radius:4px; background:#2b6cb0; color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .hint { font-size:.9em; color:#9aa0a6; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<h1>SKU ↔ Handle Mapper (XLSX)</h1>

<p class="hint">
  Upload a Shopify product export (joined is fine).<br>
  Output: Column A = SKU, Column B = Handle.
</p>

<input id="file" type="file" accept=".csv,text/csv"><br><br>
<button id="process" disabled>Generate XLSX</button>

<script>
let rowMap = {};

document.getElementById('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  rowMap = {};

  const data = new Uint8Array(await file.arrayBuffer());
  const workbook = XLSX.read(data, { type: 'array' });
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

  for (const row of rows) {
    const sku =
      (row["Variant SKU"] ||
       row["SKU"] ||
       row["Artikelnummer"] ||
       "").toString().trim();

    const handle = (row["Handle"] || "").toString().trim();
    const status = (row["Status"] || "").toString().toLowerCase();

    if (!sku || !handle) continue;
    if (sku.startsWith("'")) continue;
    if (status && status !== "active") continue;

    rowMap[sku] = handle;
  }

  document.getElementById('process').disabled = Object.keys(rowMap).length === 0;
});

document.getElementById('process').addEventListener('click', () => {
  const out = [["SKU","Handle"]];

  for (const [sku, handle] of Object.entries(rowMap)) {
    out.push([sku, handle]);
  }

  const ws = XLSX.utils.aoa_to_sheet(out);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "SKU-Handle");

  XLSX.writeFile(wb, "sku_handle_map.xlsx");
});
</script>

</body>
</html>
