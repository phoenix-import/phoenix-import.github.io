<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Import – Copy to HTML Writer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Calibri, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #68437B;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; margin: 0; }
    header span { font-size: 13px; opacity: 0.65; }

    .controls {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button.secondary {
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button.secondary:hover { background: #f9fafb; border-color: #9ca3af; }
    button.secondary.copied { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }

    button.ghost {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button.ghost:hover { background: #f9fafb; color: #374151; border-color: #9ca3af; }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #d1fae5;
      color: #065f46;
      font-weight: 500;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      height: calc(100vh - 106px);
    }

    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e5e7eb;
      overflow: hidden;
      min-width: 0;
    }

    .pane:last-child { border-right: none; }

    .pane-header {
      padding: 10px 16px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .pane-header h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    .hint {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 1px;
      padding: 5px 8px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .toolbar button {
      min-width: 28px;
      height: 26px;
      padding: 0 6px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      line-height: 1;
      font-family: inherit;
    }

    .toolbar button:hover {
      background: #e5e7eb;
      border-color: #d1d5db;
    }

    .toolbar button.active {
      background: #ede9fe;
      border-color: #c4b5fd;
      color: #5b21b6;
    }

    .toolbar .sep {
      display: inline-block;
      width: 1px;
      height: 18px;
      background: #d1d5db;
      margin: 0 4px;
      flex-shrink: 0;
    }

    .toolbar select {
      height: 26px;
      padding: 0 6px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 12px;
      color: #374151;
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    .toolbar select:hover { border-color: #9ca3af; }

    /* Editor (contenteditable) */
    .editor {
      flex: 1;
      padding: 16px;
      outline: none;
      overflow-y: auto;
      font-family: Calibri, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a2e;
      background: #fff;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: #9ca3af;
      pointer-events: none;
      display: block;
    }

    .editor h1 { font-size: 1.6em; font-weight: 700; margin: 0.5em 0 0.25em; }
    .editor h2 { font-size: 1.3em; font-weight: 600; margin: 0.5em 0 0.25em; }
    .editor h3 { font-size: 1.1em; font-weight: 600; margin: 0.5em 0 0.25em; }
    .editor p  { margin: 0.3em 0; }
    .editor ul, .editor ol { padding-left: 1.5em; margin: 0.3em 0; }
    .editor blockquote {
      border-left: 3px solid #68437B;
      margin: 0.5em 0;
      padding: 4px 12px;
      color: #555;
      background: #f9fafb;
    }
    .editor a { color: #68437B; }
    .editor hr {
      border: none;
      border-top: 1px solid #d1d5db;
      margin: 0.75em 0;
    }

    /* Output textarea */
    textarea#output {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 16px;
      background: #f9fafb;
      color: #1a1a2e;
    }
  </style>
</head>
<body>

<header>
  <h1>Phoenix Import — Copy to HTML Writer</h1>
  <span>Write content visually, get Shopify-ready HTML instantly</span>
  <a href="index.html" style="margin-left:auto;line-height:0;"><img src="logo.png" alt="Phoenix Import" style="height:36px;"></a>
</header>

<div class="controls">
  <button class="secondary" id="copyBtn">Copy Output</button>
  <button class="ghost" id="clearBtn">Clear</button>
  <span class="badge" id="badge">live</span>
</div>

<div class="workspace">
  <!-- Left pane: WYSIWYG editor -->
  <div class="pane">
    <div class="pane-header">
      <h2>Rich text input</h2>
      <span class="hint">Format text using the toolbar</span>
    </div>

    <div class="toolbar" id="toolbar">
      <button title="Undo (Ctrl+Z)" data-cmd="undo">↶</button>
      <button title="Redo (Ctrl+Y)" data-cmd="redo">↷</button>
      <span class="sep"></span>

      <select id="formatSelect" title="Paragraph style">
        <option value="p">Paragraph</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
      </select>
      <span class="sep"></span>

      <button title="Bold (Ctrl+B)" data-cmd="bold" style="font-weight:700">B</button>
      <button title="Italic (Ctrl+I)" data-cmd="italic" style="font-style:italic">I</button>
      <button title="Underline (Ctrl+U)" data-cmd="underline" style="text-decoration:underline">U</button>
      <button title="Strikethrough" data-cmd="strikeThrough" style="text-decoration:line-through">S</button>
      <span class="sep"></span>
      <button title="Subscript" data-cmd="subscript" style="font-size:11px">X<sub>2</sub></button>
      <button title="Superscript" data-cmd="superscript" style="font-size:11px">X<sup>2</sup></button>
      <span class="sep"></span>
      <button title="Remove formatting" data-cmd="removeFormat" style="font-size:11px">T<sub>x</sub></button>
      <span class="sep"></span>

      <button title="Numbered list" data-cmd="insertOrderedList">1.</button>
      <button title="Bullet list" data-cmd="insertUnorderedList">•</button>
      <button title="Decrease indent" data-cmd="outdent">⇤</button>
      <button title="Increase indent" data-cmd="indent">⇥</button>
      <span class="sep"></span>

      <button title="Blockquote" id="blockquoteBtn" style="font-size:16px;font-weight:700">&ldquo;</button>
      <span class="sep"></span>

      <button title="Align left" data-cmd="justifyLeft" aria-label="Align left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg>
      </button>
      <button title="Align center" data-cmd="justifyCenter" aria-label="Align center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm3 4h12v2H6V9zm-3 4h18v2H3v-2zm3 4h12v2H6v-2z"/></svg>
      </button>
      <button title="Align right" data-cmd="justifyRight" aria-label="Align right">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm6 4h12v2H9V9zm-6 4h18v2H3v-2zm6 4h12v2H9v-2z"/></svg>
      </button>
      <button title="Justify" data-cmd="justifyFull" aria-label="Justify">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm0 4h18v2H3V9zm0 4h18v2H3v-2zm0 4h18v2H3v-2z"/></svg>
      </button>
      <span class="sep"></span>

      <button title="Insert link" id="linkBtn">Link</button>
      <button title="Remove link" data-cmd="unlink">Unlink</button>
      <span class="sep"></span>

      <button title="Horizontal rule" data-cmd="insertHorizontalRule">―</button>
    </div>

    <div class="editor" id="editor" contenteditable="true" data-placeholder="Start writing your content here…"></div>
  </div>

  <!-- Right pane: HTML output -->
  <div class="pane">
    <div class="pane-header">
      <h2>Shopify-ready HTML output</h2>
      <span class="hint">Paste directly into metafield</span>
    </div>
    <textarea id="output" readonly placeholder="HTML appears here as you type…"></textarea>
  </div>
</div>

<script>
// Use <p> as default block separator (Chrome wraps in <div> otherwise)
try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

const editor = document.getElementById('editor');
const outputEl = document.getElementById('output');

function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function escText(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Serialize editor DOM to clean HTML
function serializeNode(node) {
  if (node.nodeType === Node.TEXT_NODE) return escText(node.textContent);
  if (node.nodeType !== Node.ELEMENT_NODE) return '';

  const tag = node.tagName.toLowerCase();
  const kids = Array.from(node.childNodes).map(serializeNode).join('');

  // Void elements
  if (tag === 'br') return '<br>';
  if (tag === 'hr') return '<hr>\n';

  // Normalize non-semantic tags
  const tagMap = { b: 'strong', i: 'em', strike: 's' };
  const out = tagMap[tag] || tag;

  // Chrome wraps newlines in <div> — convert to <p>
  if (tag === 'div') {
    if (!kids.trim() && !kids.includes('<br>')) return '';
    return `<p>${kids || '<br>'}</p>\n`;
  }

  // Drop <span>/<font> wrappers (usually browser styling artifacts)
  if (tag === 'span' || tag === 'font') return kids;

  // Build attributes
  let attrs = '';
  if (tag === 'a') {
    const href = node.getAttribute('href');
    if (href) attrs += ` href="${escAttr(href)}"`;
  }
  const ta = node.style && node.style.textAlign;
  if (ta && ta !== 'left' && ta !== 'start' && ta !== '') {
    attrs += ` style="text-align:${ta}"`;
  }

  const blockTags = new Set(['p','h1','h2','h3','ul','ol','li','blockquote']);
  const inlineTags = new Set(['strong','em','u','s','sub','sup','a']);

  if (blockTags.has(out)) {
    const body = kids.trim() ? kids : '<br>';
    return `<${out}${attrs}>${body}</${out}>\n`;
  }
  if (inlineTags.has(out)) {
    if (!kids) return '';
    return `<${out}${attrs}>${kids}</${out}>`;
  }

  // Unknown — pass through children
  return kids;
}

function getHTML() {
  return Array.from(editor.childNodes)
    .map(serializeNode)
    .join('')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

function updateOutput() {
  outputEl.value = getHTML();
}

editor.addEventListener('input', updateOutput);

editor.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    // After a heading, insert a plain paragraph instead of another heading
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const block = sel.getRangeAt(0).startContainer;
    const heading = block.nodeType === Node.TEXT_NODE ? block.parentElement : block;
    const headingEl = heading.closest('h1,h2,h3');
    if (!headingEl) return;
    e.preventDefault();
    // Move caret to end of heading, then insert a <p> after it
    const range = sel.getRangeAt(0);
    const atEnd = range.endOffset === (range.endContainer.length ?? 0) &&
                  !range.endContainer.nextSibling?.nodeValue;
    if (atEnd) {
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      headingEl.insertAdjacentElement('afterend', p);
      const newRange = document.createRange();
      newRange.setStart(p, 0);
      newRange.collapse(true);
      sel.removeAllRanges();
      sel.addRange(newRange);
    } else {
      document.execCommand('insertParagraph', false, null);
      document.execCommand('formatBlock', false, 'p');
    }
    updateOutput();
  } else if (e.key === 'Enter' && e.shiftKey) {
    e.preventDefault();
    document.execCommand('insertHTML', false, '<br>');
    updateOutput();
  }
});

// Toolbar command buttons
document.getElementById('toolbar').addEventListener('mousedown', e => {
  const btn = e.target.closest('button[data-cmd]');
  if (!btn) return;
  e.preventDefault(); // keep caret in editor
  editor.focus();
  document.execCommand(btn.dataset.cmd, false, null);
  updateOutput();
  syncToolbarState();
});

// Format dropdown
document.getElementById('formatSelect').addEventListener('change', e => {
  editor.focus();
  document.execCommand('formatBlock', false, e.target.value);
  updateOutput();
});

// Link prompt
document.getElementById('linkBtn').addEventListener('mousedown', e => {
  e.preventDefault();
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) {
    alert('Select some text first, then click Link.');
    return;
  }
  const url = window.prompt('Enter URL:', 'https://');
  if (url) {
    editor.focus();
    document.execCommand('createLink', false, url);
    updateOutput();
  }
});

// Blockquote toggle
document.getElementById('blockquoteBtn').addEventListener('mousedown', e => {
  e.preventDefault();
  editor.focus();
  document.execCommand('formatBlock', false, 'blockquote');
  updateOutput();
});

// Keep HTML links clickable-safe — strip pasted styles
editor.addEventListener('paste', e => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});

// Copy button
document.getElementById('copyBtn').addEventListener('click', () => {
  const html = getHTML();
  if (!html) return;
  navigator.clipboard.writeText(html).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy Output';
      btn.classList.remove('copied');
    }, 1800);
  });
});

// Clear button
document.getElementById('clearBtn').addEventListener('click', () => {
  editor.innerHTML = '';
  outputEl.value = '';
  editor.focus();
});

// Highlight active formatting in the toolbar
const stateCmds = ['bold','italic','underline','strikeThrough','subscript','superscript',
  'insertOrderedList','insertUnorderedList','justifyLeft','justifyCenter','justifyRight','justifyFull'];

function syncToolbarState() {
  document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    const cmd = btn.dataset.cmd;
    if (stateCmds.includes(cmd)) {
      try { btn.classList.toggle('active', document.queryCommandState(cmd)); }
      catch (e) { /* ignore */ }
    }
  });
  try {
    const block = (document.queryCommandValue('formatBlock') || '').toLowerCase();
    const sel = document.getElementById('formatSelect');
    const match = ['p','h1','h2','h3'].find(t => t === block);
    if (match) sel.value = match;
    else sel.value = 'p';
  } catch (e) {}
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  if (!editor.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
  syncToolbarState();
});
</script>
</body>
</html>
