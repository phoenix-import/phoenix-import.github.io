<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SKU ↔ Handle Mapper (XLSX)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Calibri, sans-serif; background:#fff; color:#333; margin:0; padding:0; }
    header { background:#68437B; color:#fff; padding:16px 24px; display:flex; align-items:center; gap:16px; }
    header h1 { font-size:18px; font-weight:600; margin:0; }
    header img { height:36px; margin-left:auto; }
    .content { padding:20px; }
    button { margin-top:10px; padding:8px 12px; border:0; border-radius:4px; background:#ca427e; color:#fff; cursor:pointer; }
    button:hover { background:#b33a6f; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .hint { font-size:.9em; color:#666; }
  </style>
  <!-- SheetJS library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>SKU ↔ Handle Mapper (XLSX)</h1>
    <img src="logo.png" alt="Phoenix Import">
  </header>
  <div class="content">
  <p class="hint">
    Upload a Shopify export with headers <code>Handle,Title,[Published,]Variant SKU,Status</code>.<br>
    (Published column is optional)<br>
    Output will be an Excel file with:<br>
    Column A = SKU numbers, Column B = Handles.
  </p>

  <input id="file" type="file" accept=".csv,text/csv"><br><br>
  <button id="process" disabled>Generate XLSX</button>
  </div>

<script>
// Simple CSV splitter that respects quotes
function splitCsvLine(line) {
  const regex = /("([^"]*)"|[^,]*)(,|$)/g;
  const result = [];
  let match;
  while ((match = regex.exec(line)) !== null) {
    let value = match[2] !== undefined ? match[2] : match[1];
    result.push(value.trim());
    if (match[3] === '') break;
  }
  return result;
}

let parsedRows = [];

document.getElementById('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  const text = await file.text();
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  parsedRows = [];

  // Detect format by checking header
  const headerParts = splitCsvLine(lines[0] || '');
  const hasPublished = headerParts.some(h => h.toLowerCase().includes('published'));

  // Set column indices based on format
  const skuIndex = hasPublished ? 3 : 2;
  const statusIndex = hasPublished ? 4 : 3;
  const minColumns = hasPublished ? 5 : 4;

  for (let i=1; i<lines.length; i++){ // skip header
    const row = lines[i].trim();
    if (!row) continue;
    const parts = splitCsvLine(row);
    if (parts.length < minColumns) continue;

    const handle = (parts[0] || '').trim();
    const sku = (parts[skuIndex] || '').trim();
    const status = (parts[statusIndex] || '').trim().toLowerCase();

    // Skip if SKU or handle missing, or row is clearly junk
    if (!handle || !sku) continue;
    if (sku.toLowerCase().startsWith("'")) continue; // skip those weird 02575 rows

    parsedRows.push([sku, handle]);
  }

  if (parsedRows.length === 0) {
    alert("No valid rows found.");
    document.getElementById('process').disabled = true;
  } else {
    document.getElementById('process').disabled = false;
  }
});

document.getElementById('process').addEventListener('click', () => {
  const out = [];
  out.push(["SKU","Handle"]); // header

  for (const row of parsedRows) {
    out.push(row);
  }

  const ws = XLSX.utils.aoa_to_sheet(out);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "SKU-Handle");

  XLSX.writeFile(wb, "sku_handle_map.xlsx");
});
</script>
</body>
</html>
