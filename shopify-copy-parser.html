  .status-badge.warn { background: #fef3c7; color: #92400e; }

<header>
  <h1>Phoenix Import — Shopify Copy Parser</h1>
  <span>Converts old-site HTML to Shopify-ready copy</span>
</header>

<div class="controls">
  <label for="langSelect">Language:</label>
  <select id="langSelect">
    <option value="NL">🇳🇱 Nederlands (NL)</option>
    <option value="EN">🇬🇧 English (EN)</option>
    <option value="DE">🇩🇪 Deutsch (DE)</option>
    <option value="FR">🇫🇷 Français (FR)</option>
    <option value="ES">🇪🇸 Español (ES)</option>
    <option value="IT">🇮🇹 Italiano (IT)</option>
  </select>
  <button id="parseBtn">▶ Parse &amp; Convert</button>
  <button id="copyBtn">Copy Output</button>
  <span id="statusBadge" class="status-badge">Idle</span>
</div>

<div class="workspace">
  <div class="pane">
    <div class="pane-header">
      <h2>Input — Raw HTML</h2>
      <button onclick="document.getElementById('input').value=''" style="font-size:11px;background:none;border:1px solid #e5e7eb;border-radius:4px;padding:2px 8px;cursor:pointer;color:#6b7280;">Clear</button>
    </div>
    <textarea id="input" placeholder="Paste the full page HTML source here…" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">
      <h2>Output — Shopify-ready HTML</h2>
    </div>
    <textarea id="output" readonly placeholder="Converted HTML will appear here after parsing…" spellcheck="false"></textarea>
  </div>
</div>
<div id="log" class="log"><span class="info">Ready. Paste HTML on the left and click Parse &amp; Convert.</span>
</div>

// ─── Utility ────────────────────────────────────────────────────────────────────────────

function slugify(str) {
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, " ")
    .replace(/\s+/g, " ").trim()
    .split(" ");
}

const STOP_WORDS = {
  NL: new Set(["en","de","het","van","in","op","te","een","met","voor","aan","bij","uit","is","zijn","naar","over","ook","maar","als","dan","er","dit","dat","we","ze","hij","al","meer","niet","of","door","om","zo","nog","die","den","der","des","ons","hun","heeft","haar","hem","zij","onze"]),
  EN: new Set(["and","the","of","in","for","to","a","an","with","or","on","at","by","from","is","are","its","it","this","that","our","we","all","more"]),
  DE: new Set(["und","die","der","das","in","von","zu","mit","auf","an","fur","bei","ist","ein","eine","den","des","dem","im","am","zum","zur","als","auch","oder","noch","sich","sie","wir","ihr"]),
  FR: new Set(["et","les","des","de","la","le","en","pour","avec","ou","sur","au","aux","un","une","ce","se","son","sa","ses","ils","nous","vous","par","dans","est","plus","aussi"]),
  ES: new Set(["y","los","las","de","la","el","en","para","con","o","un","una","se","su","sus","es","por","del","al","lo","como","mas","tambien","son","nos"]),
  IT: new Set(["e","i","le","di","la","il","in","per","con","o","un","una","si","su","gli","lo","al","dal","del","nel","piu","anche","sono","loro","questa","questo"]),
};

function scoreMatch(linkTextWords, handle, lang) {
  const hw = handle.split("-").filter(w => w.length > 1);
  const stops = STOP_WORDS[lang] || new Set();
  let score = 0;
  for (const lw of linkTextWords) {
    if (lw.length < 3 || stops.has(lw)) continue;
    for (const h of hw) {
      if (h.length < 3) continue;
      if (h === lw)                            { score += 3; break; }
      if (h.startsWith(lw) || lw.startsWith(h)){ score += 2; break; }
      if (h.includes(lw)   || lw.includes(h))  { score += 1; break; }
    }
  }
  return score;
}

function findHandle(linkText, lang) {
  const handles = COLLECTIONS[lang] || [];
  const words = slugify(linkText);
  let best = null, bestScore = 0;
  for (const h of handles) {
    const s = scoreMatch(words, h, lang);
    if (s > bestScore) { bestScore = s; best = h; }
  }
  return bestScore >= 2 ? best : null;
}

function handleToLabel(handle) {
  const skip = new Set(["de","en","nl","fr","es","it","und","et","y","e"]);
  return handle.split("-")
    .filter(w => w.length > 1 && !skip.has(w))
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(" ");
}

function processHTML(rawHTML, lang) {
  const logs = [];
  const parser = new DOMParser();
  const doc = parser.parseFromString(rawHTML, "text/html");

  // 1. Strip junk attributes from every element
  doc.body.querySelectorAll("*").forEach(el => {
    ["style","class","id","data-mce-style","data-mce-href"].forEach(a => el.removeAttribute(a));
  });

  // 2. Unwrap bare <span> tags (no remaining attributes)
  //    Work on a snapshot so detached nodes are never re-visited
  Array.from(doc.body.querySelectorAll("span")).forEach(span => {
    if (!span.parentNode) return;          // already detached
    if (span.hasAttributes()) return;      // keep if attrs remain
    const parent = span.parentNode;
    while (span.firstChild) parent.insertBefore(span.firstChild, span);
    parent.removeChild(span);
  });

  // 3. Replace phoeniximport.com links
  let linksTotal = 0, linksMatched = 0, linksFallback = 0;
  doc.body.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href") || "";
    if (!href.includes("phoeniximport.com")) return;
    linksTotal++;
    // Remove target/rel while we're here
    a.removeAttribute("target");
    a.removeAttribute("rel");
    const linkText = a.textContent.trim();
    const handle = findHandle(linkText, lang);
    if (handle) {
      a.setAttribute("href", "/collections/" + handle);
      linksMatched++;
      logs.push({ type:"ok",   msg: '\u2713 "' + linkText + '" \u2192 /collections/' + handle });
    } else {
      a.setAttribute("href", HOMEPAGE);
      linksFallback++;
      logs.push({ type:"warn", msg: '? "' + linkText + '" \u2192 fallback homepage' });
    }
  });

  // 4. Handle the related-links block
  const relatedBlock = detectRelatedBlock(doc.body);
  if (relatedBlock) {
    logs.push({ type:"info", msg: "\u2139 Related links block detected \u2014 links updated above." });
  } else {
    logs.push({ type:"info", msg: "\u2139 No related links block found \u2014 generating one." });
    const generated = generateRelatedBlock(doc.body, lang);
    if (generated) {
      doc.body.appendChild(generated);
      logs.push({ type:"ok", msg: "\u2713 Generated related links block with " + generated.querySelectorAll("a").length + " collections." });
    }
  }

  // 5. Serialise
  const output = doc.body.innerHTML
    .replace(/\n{3,}/g, "\n\n")
    .replace(/[ \t]{2,}/g, " ")
    .trim();

  return { output, logs, linksTotal, linksMatched, linksFallback };
}

function detectRelatedBlock(body) {
  for (const el of body.querySelectorAll("p, div")) {
    const anchors = el.querySelectorAll("a");
    const text = el.textContent;
    if (anchors.length >= 4 && (text.includes("|") || /groothandel|wholesale|gros|all'ingrosso|Gro\u00dfhandel|al por mayor/i.test(text))) {
      return el;
    }
  }
  return null;
}

function generateRelatedBlock(body, lang) {
  const handles = COLLECTIONS[lang] || [];
  if (!handles.length) return null;
  const bodyWords = slugify(body.textContent);
  const scored = handles
    .map(h => ({ handle: h, score: scoreMatch(bodyWords, h, lang) }))
    .filter(x => x.score >= 2)
    .sort((a, b) => b.score - a.score);

  const picked = [];
  const seen = new Set();
  for (const item of scored) {
    if (picked.length >= 10) break;
    if (!seen.has(item.handle)) { picked.push(item.handle); seen.add(item.handle); }
  }
  // Pad with random handles if fewer than 6
  if (picked.length < 6) {
    const shuffled = handles.filter(h => !seen.has(h)).sort(() => Math.random() - 0.5);
    for (const h of shuffled) {
      if (picked.length >= 8) break;
      picked.push(h); seen.add(h);
    }
  }
  if (!picked.length) return null;

  const p = document.createElement("p");
  const strong = document.createElement("strong");
  picked.forEach((h, i) => {
    const a = document.createElement("a");
    a.href = "/collections/" + h;
    a.textContent = handleToLabel(h);
    strong.appendChild(a);
    if (i < picked.length - 1) strong.appendChild(document.createTextNode(" | "));
  });
  p.appendChild(strong);
  return p;
}

// ─── UI ────────────────────────────────────────────────────────────────────────────

const logEl = document.getElementById("log");
function appendLog(type, msg) {
  const span = document.createElement("span");
  span.className = type;
  span.textContent = msg + "\n";
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog() { logEl.innerHTML = ""; }

document.getElementById("parseBtn").addEventListener("click", () => {
  const raw = document.getElementById("input").value.trim();
  const lang = document.getElementById("langSelect").value;
  const badge = document.getElementById("statusBadge");
  const outputEl = document.getElementById("output");

  if (!raw) {
    badge.textContent = "No input";
    badge.className = "status-badge warn";
    return;
  }

  clearLog();
  badge.textContent = "Processing\u2026";
  badge.className = "status-badge";

  try {
    const { output, logs, linksTotal, linksMatched, linksFallback } = processHTML(raw, lang);
    outputEl.value = output;
    logs.forEach(l => appendLog(l.type, l.msg));
    appendLog("info", "\u2014 " + linksTotal + " link(s) found: " + linksMatched + " matched, " + linksFallback + " \u2192 homepage");
    if (linksFallback === 0 && linksTotal > 0) {
      badge.textContent = "All " + linksMatched + " links matched";
      badge.className = "status-badge ok";
    } else if (linksMatched > 0) {
      badge.textContent = linksMatched + "/" + linksTotal + " matched";
      badge.className = "status-badge warn";
    } else {
      badge.textContent = linksTotal === 0 ? "Done (no links)" : "No matches";
      badge.className = "status-badge warn";
    }
  } catch(e) {
    appendLog("err", "Error: " + e.message + " (" + e.stack + ")");
    badge.textContent = "Error";
    badge.className = "status-badge warn";
  }
});

document.getElementById("copyBtn").addEventListener("click", () => {
  const val = document.getElementById("output").value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "\u2713 Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy Output"; btn.classList.remove("copied"); }, 2000);
  });
});
</script>
