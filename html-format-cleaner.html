<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Import – Old HTML Copy Cleaner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Calibri, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #68437B;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; margin: 0; }
    header span { font-size: 13px; opacity: 0.65; }

    .controls {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 13px;
      font-weight: 500;
      color: #374151;
    }

    button.primary {
      background: #ca427e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.primary:hover { background: #b33a6f; }

    button.secondary {
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    button.secondary:hover { background: #f9fafb; border-color: #9ca3af; }
    button.secondary.copied { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      height: calc(100vh - 110px);
    }

    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e5e7eb;
    }

    .pane:last-child { border-right: none; }

    .pane-header {
      padding: 10px 16px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-header h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    .hint {
      font-size: 11px;
      color: #9ca3af;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12.5px;
      line-height: 1.6;
      padding: 16px;
      background: #fff;
      color: #1a1a2e;
    }

    textarea#output {
      background: #f9fafb;
    }

    .log {
      font-size: 11px;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 8px 16px;
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
      white-space: pre-wrap;
      border-top: 1px solid #333;
    }

    .log .ok   { color: #a6e3a1; }
    .log .warn { color: #f9e2af; }
    .log .info { color: #89dceb; }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #f3f4f6;
      color: #6b7280;
      font-weight: 500;
    }

    .badge.ok   { background: #d1fae5; color: #065f46; }
    .badge.warn { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

<header>
  <h1>Phoenix Import — Old HTML Copy Cleaner</h1>
  <span>Strips rogue formatting from translated copy and outputs clean, Shopify-ready HTML</span>
  <a href="index.html" style="margin-left:auto;line-height:0;"><img src="logo.png" alt="Phoenix Import" style="height:36px;"></a>
</header>

<div class="controls">
  <button class="primary" id="cleanBtn">▶ Clean</button>
  <button class="secondary" id="copyBtn">Copy Output</button>
  <span class="badge" id="badge">ready</span>
</div>

<div class="workspace">
  <div class="pane">
    <div class="pane-header">
      <h2>Input — paste HTML or plain text here</h2>
      <span class="hint">Raw copy from Word / translator — HTML or plain text</span>
    </div>
    <textarea id="input" placeholder="Paste raw HTML or plain text here — plain text will be converted to HTML automatically…"></textarea>
  </div>

  <div class="pane">
    <div class="pane-header">
      <h2>Output — cleaned HTML</h2>
      <span class="hint">Ready for Shopify</span>
    </div>
    <textarea id="output" readonly placeholder="Cleaned output will appear here…"></textarea>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
// ─── Helpers ────────────────────────────────────────────────────────────────

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const line = document.createElement('span');
  line.className = type;
  line.textContent = msg + '\n';
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

function setBadge(text, type = '') {
  const b = document.getElementById('badge');
  b.textContent = text;
  b.className = 'badge' + (type ? ' ' + type : '');
}

// ─── Plain-text detector ─────────────────────────────────────────────────────
// Returns true if the input contains no meaningful HTML tags.

function isPlainText(str) {
  // Strip comments and CDATA, then check for any tag-like structure
  const stripped = str.replace(/<!--[\s\S]*?-->/g, '').replace(/<!\[CDATA[\s\S]*?\]\]>/g, '');
  return !/<[a-z][\s\S]*?>/i.test(stripped);
}

// ─── Plain-text → HTML converter ─────────────────────────────────────────────
// Heuristics:
//   - First non-empty line → <h1>
//   - Lines that are short (≤ 60 chars), ALL-CAPS or Title Case, not ending in
//     sentence punctuation, and preceded by a blank line → heading candidate
//   - Indented lines or lines starting with - / * / • → <li> inside <ul>
//   - Everything else → <p>
// Heading depth: first heading after h1 → h2, subsequent same-depth → h2,
// deeper indented headings → h3.

function plainTextToHTML(text) {
  const lines = text.split(/\r?\n/);
  const out = [];
  let h1Done = false;
  let inList = false;
  let lastHeadingDepth = 0; // 0 = none yet, 1 = h2, 2 = h3

  function closeList() {
    if (inList) { out.push('</ul>'); inList = false; }
  }

  function isHeadingCandidate(line, prevBlank) {
    if (!prevBlank && h1Done) return false; // headings must follow a blank line
    const trimmed = line.trim();
    if (trimmed.length === 0 || trimmed.length > 72) return false;
    // Must not end in sentence-ending punctuation
    if (/[.!?,;]$/.test(trimmed)) return false;
    // Either short all-caps, or Title Case (most words capitalised)
    const isAllCaps = trimmed === trimmed.toUpperCase() && /[A-Z]/.test(trimmed);
    const words = trimmed.split(/\s+/);
    const titleCaseCount = words.filter(w => /^[A-Z\u00C0-\u017E]/.test(w)).length;
    const isTitleCase = words.length >= 2 && titleCaseCount / words.length >= 0.6;
    return isAllCaps || isTitleCase;
  }

  let prevBlank = true; // treat start-of-doc as preceded by blank

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const trimmed = raw.trim();

    if (trimmed === '') {
      closeList();
      prevBlank = true;
      continue;
    }

    // List item?
    if (/^[-*•]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      const content = trimmed.replace(/^[-*•]\s+/, '').replace(/^\d+\.\s+/, '');
      out.push(`<li>${content}</li>`);
      prevBlank = false;
      continue;
    }

    closeList();

    // First non-empty line always becomes h1
    if (!h1Done) {
      out.push(`<h1>${trimmed}</h1>`);
      h1Done = true;
      prevBlank = false;
      continue;
    }

    if (isHeadingCandidate(trimmed, prevBlank)) {
      // Determine depth based on indentation hint (leading spaces before trim)
      const indent = raw.match(/^(\s*)/)[1].length;
      let tag;
      if (indent >= 4 || lastHeadingDepth >= 1) {
        tag = 'h3';
        lastHeadingDepth = 2;
      } else {
        tag = 'h2';
        lastHeadingDepth = 1;
      }
      out.push(`<${tag}>${trimmed}</${tag}>`);
      prevBlank = false;
      continue;
    }

    out.push(`<p>${trimmed}</p>`);
    prevBlank = false;
  }

  closeList();
  return out.join('\n');
}

// ─── Core cleaner ────────────────────────────────────────────────────────────

function cleanHTML(raw) {
  // 0. Strip &nbsp; entities (literal and encoded) before any DOM parsing
  raw = raw.replace(/&nbsp;/gi, ' ')       // named entity
           .replace(/&#160;/g, ' ')        // decimal entity
           .replace(/&#xA0;/gi, ' ')       // hex entity
           .replace(/\u00A0/g, ' ');       // bare non-breaking space character

  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="root">' + raw + '</div>', 'text/html');
  const root = doc.getElementById('root');

  let warnings = 0;

  // 1. Strip all inline style attributes
  root.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));

  // 2. Strip class attributes (Word's MsoNormal etc.)
  root.querySelectorAll('[class]').forEach(el => el.removeAttribute('class'));

  // 3. Unwrap semantically empty wrappers
  function unwrapTag(tagName) {
    root.querySelectorAll(tagName).forEach(el => {
      const parent = el.parentNode;
      while (el.firstChild) parent.insertBefore(el.firstChild, el);
      parent.removeChild(el);
    });
  }
  unwrapTag('span');
  unwrapTag('font');

  // 4. Remove empty tags
  function removeEmpties(parent) {
    Array.from(parent.children).forEach(child => {
      removeEmpties(child);
      const tag = child.tagName.toLowerCase();
      if (tag === 'a') return;
      if (child.innerHTML.trim() === '' && child.textContent.trim() === '') {
        child.remove();
      }
    });
  }
  removeEmpties(root);

  // 5. Collapse consecutive <br> spacers
  let html = root.innerHTML;
  html = html.replace(/(<br\s*\/?>\s*){2,}/gi, '<br>');

  // 6. Strip Word/Office boilerplate
  html = html.replace(/<\/?o:[^>]*>/gi, '');
  html = html.replace(/<\/?w:[^>]*>/gi, '');
  html = html.replace(/<\/?m:[^>]*>/gi, '');
  html = html.replace(/<!--\[if[^\]]*\]>[\s\S]*?<!\[endif\]-->/gi, '');
  html = html.replace(/<!--.*?-->/gs, '');

  // 7. Normalise header hierarchy (second DOM pass)
  const doc2 = parser.parseFromString('<div id="root2">' + html + '</div>', 'text/html');
  const root2 = doc2.getElementById('root2');

  let h1Count = 0;
  root2.querySelectorAll('h1').forEach(el => {
    h1Count++;
    if (h1Count > 1) {
      const h2 = doc2.createElement('h2');
      h2.innerHTML = el.innerHTML;
      el.replaceWith(h2);
      warnings++;
      log(`⚠ Extra <h1> demoted to <h2>: "${el.textContent.trim().slice(0, 60)}"`, 'warn');
    }
  });

  ['h4','h5','h6'].forEach(tag => {
    root2.querySelectorAll(tag).forEach(el => {
      const p = doc2.createElement('p');
      p.innerHTML = el.innerHTML;
      el.replaceWith(p);
      warnings++;
      log(`⚠ <${tag}> converted to <p>`, 'warn');
    });
  });

  // 8. Strip presentational attributes
  root2.querySelectorAll('*').forEach(el => {
    ['bgcolor','color','size','face','align','valign','width','height',
     'border','cellspacing','cellpadding'].forEach(attr => {
      if (el.hasAttribute(attr) && el.tagName.toLowerCase() !== 'img') {
        el.removeAttribute(attr);
      }
    });
  });

  // 9. Serialise
  html = root2.innerHTML;

  // 10. Tidy whitespace
  html = html
    .replace(/\n{3,}/g, '\n\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n[ \t]+</g, '\n<')
    .trim();

  // 11. Pretty-print block tags onto their own lines
  const blocks = ['p','h1','h2','h3','ul','ol','li','table','tr','td','th','blockquote','div','br'];
  const blockRe = new RegExp(`(<(?:${blocks.join('|')})[^>]*>|</(?:${blocks.join('|')})>)`, 'gi');
  html = html.replace(blockRe, '\n$1\n').replace(/\n{3,}/g, '\n\n').trim();

  return { html, warnings };
}

// ─── UI wiring ───────────────────────────────────────────────────────────────

document.getElementById('cleanBtn').addEventListener('click', () => {
  clearLog();
  const raw = document.getElementById('input').value.trim();
  if (!raw) { log('⚠ Nothing to clean – paste some content first.', 'warn'); return; }

  try {
    let result;

    if (isPlainText(raw)) {
      log('ℹ Plain text detected – converting to HTML…', 'info');
      const converted = plainTextToHTML(raw);
      result = cleanHTML(converted);
      log('✓ Plain text converted and cleaned.', 'ok');
    } else {
      log('Starting clean…', 'info');
      result = cleanHTML(raw);
    }

    document.getElementById('output').value = result.html;

    if (result.warnings === 0) {
      log('✓ Done. No structural issues found.', 'ok');
      setBadge('clean', 'ok');
    } else {
      log(`✓ Done with ${result.warnings} warning(s). Check output.`, 'warn');
      setBadge(`${result.warnings} warning${result.warnings > 1 ? 's' : ''}`, 'warn');
    }
  } catch(e) {
    log('✗ Error: ' + e.message, 'warn');
    setBadge('error', 'warn');
  }
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const out = document.getElementById('output').value;
  if (!out) return;
  navigator.clipboard.writeText(out).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy Output';
      btn.classList.remove('copied');
    }, 1800);
  });
});
</script>
</body>
</html>
