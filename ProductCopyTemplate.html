    body{font-family:Segoe,sans-serif; margin:0; line-height:1.35; background:#fafafa; color:#222}

    header label{font-size:12px; display:block; margin-bottom:4px; color:rgba(255,255,255,.8)}
    select{padding:8px 10px; font-size:14px}
    button{padding:8px 14px; font-size:14px; cursor:pointer; background:#ca427e; color:#fff; border:none; border-radius:6px; transition:background .15s}
    button:hover{background:#b33a6f}
    .content{padding:0 16px 16px}
    .card{border:1px solid #ddd; border-radius:10px; padding:12px; margin-top:12px; background:#fff}
    .meta{font-size:13px; color:#333}
    .tabs{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px}
    .tab{border:1px solid #ccc; background:#f7f7f7; padding:6px 10px; border-radius:999px; color:#333}
    .tab:hover{background:#e8e8e8}
    .tab[aria-selected="true"]{background:#68437B; color:#fff; border-color:#68437B}
    .tab[aria-selected="true"]:hover{background:#573466}
    textarea{width:100%; min-height:340px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; padding:10px; border-radius:10px; border:1px solid #ddd}
    .grid{display:grid; grid-template-columns:1fr; gap:12px}
    @media (min-width: 980px){ .grid{grid-template-columns: 1fr 1fr;} }
    .muted{color:#666; font-size:12px}
  </style>
</head>

      </div>
      <div>

const skuSel = document.getElementById("sku");
const langSel = document.getElementById("lang");
const out = document.getElementById("out");
const meta = document.getElementById("meta");
const tabs = document.getElementById("tabs");
const preview = document.getElementById("preview");

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function buildOptions(){
  DATA.products.forEach(p=>{
    const opt=document.createElement("option");
    opt.value=p.sku;
    opt.textContent=p.sku;
    skuSel.appendChild(opt);
  });
  DATA.languages.forEach(l=>{
    const opt=document.createElement("option");
    opt.value=l.code;
    opt.textContent=l.label;
    langSel.appendChild(opt);
  });
}

function setTab(lang){
  [...tabs.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-selected", b.dataset.lang===lang ? "true":"false"));
  langSel.value = lang;
  render();
}

function buildTabs(){
  tabs.innerHTML="";
  DATA.languages.forEach(l=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="tab";
    b.dataset.lang=l.code;
    b.setAttribute("aria-selected","false");
    b.textContent=l.label;
    b.addEventListener("click", ()=>setTab(l.code));
    tabs.appendChild(b);
  });
}

function currentProduct(){
  const sku = skuSel.value;
  return DATA.products.find(p=>p.sku===sku);
}

function render(){
  const p=currentProduct();
  const lang=langSel.value;
  const title = p.title[lang] || "";
  meta.innerHTML = `<div><strong>${escapeHtml(title)}</strong></div>`;
  const htmlText = p.html[lang] || "";
  out.value = htmlText;
  preview.innerHTML = htmlText;
  [...tabs.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-selected", b.dataset.lang===lang ? "true":"false"));
}

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
  } catch(e) {
    const tmp = document.createElement("textarea");
    tmp.value = text;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand("copy");
    document.body.removeChild(tmp);
  }
}

document.getElementById("copyBtn").addEventListener("click", async ()=>{
  await copyText(out.value);
});

document.getElementById("copyAllBtn").addEventListener("click", async ()=>{
  const p = currentProduct();
  const bundle = {
    sku: p.sku,
    line: DATA.lineName,
    html: {}
  };
  DATA.languages.forEach(l=>{
    bundle.html[l.code] = p.html[l.code] || "";
  });
  await copyText(JSON.stringify(bundle, null, 2));
});

skuSel.addEventListener("change", render);
langSel.addEventListener("change", render);

buildOptions();
buildTabs();
skuSel.value = DATA.products[0].sku;
langSel.value = DATA.languages[0].code;
render();
</script>
